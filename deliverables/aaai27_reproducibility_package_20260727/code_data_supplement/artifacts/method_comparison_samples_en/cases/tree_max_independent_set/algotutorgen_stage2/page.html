<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tree DP — Maximum Independent Set on a Tree</title>
    <style>
        :root {
            --bg: #f7f8fc;
            --card-bg: #ffffff;
            --text: #1a1a2e;
            --text-secondary: #555;
            --accent: #2563eb;
            --accent-light: #dbeafe;
            --take: #16a34a;
            --take-bg: #dcfce7;
            --take-stroke: #15803d;
            --skip: #ea580c;
            --skip-bg: #fff7ed;
            --skip-stroke: #c2410c;
            --highlight: #facc15;
            --highlight-bg: #fef9c3;
            --highlight-stroke: #ca8a04;
            --selected: #22c55e;
            --selected-bg: #bbf7d0;
            --selected-stroke: #15803d;
            --not-selected: #e5e7eb;
            --not-selected-stroke: #9ca3af;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08), 0 2px 4px rgba(0, 0, 0, 0.04);
            --radius: 12px;
            --radius-sm: 8px;
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --mono: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }

        #app {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            text-align: center;
            padding: 8px 0;
        }
        .header h1 {
            font-size: 1.55rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: #0f172a;
            margin-bottom: 2px;
        }
        .header .subtitle {
            font-size: 0.9rem;
            color: #64748b;
            font-weight: 400;
        }

        .result-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #fef3c7;
            border: 1.5px solid #f59e0b;
            border-radius: 24px;
            padding: 6px 16px;
            font-weight: 600;
            font-size: 1.05rem;
            color: #92400e;
            letter-spacing: -0.01em;
            box-shadow: var(--shadow-sm);
        }
        .result-badge .icon {
            font-size: 1.3rem;
        }
        .result-badge .value {
            font-family: var(--mono);
            font-size: 1.3rem;
            color: #b45309;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            padding: 20px 24px;
            border: 1px solid #e8ecf1;
        }

        #stage {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 380px;
            padding: 8px;
            overflow: visible;
        }

        #stage svg {
            width: 100%;
            height: auto;
            max-height: 420px;
            display: block;
        }

        /* Node styles */
        .node-circle {
            transition: fill 0.35s ease, stroke 0.35s ease, stroke-width 0.35s ease, r 0.35s ease;
            cursor: default;
        }
        .node-circle.default {
            fill: #e8f0fe;
            stroke: #90b4d6;
            stroke-width: 2.5;
        }
        .node-circle.visited {
            fill: #dbeafe;
            stroke: #3b82f6;
            stroke-width: 3;
        }
        .node-circle.highlighted {
            fill: #fef9c3;
            stroke: #eab308;
            stroke-width: 3.5;
            animation: pulse-glow 1s ease-in-out infinite;
        }
        .node-circle.take-dominant {
            fill: #dcfce7;
            stroke: #22c55e;
            stroke-width: 3;
        }
        .node-circle.skip-dominant {
            fill: #fff7ed;
            stroke: #f97316;
            stroke-width: 3;
        }
        .node-circle.optimal-selected {
            fill: #bbf7d0;
            stroke: #15803d;
            stroke-width: 4;
            filter: drop-shadow(0 0 6px rgba(34, 197, 94, 0.5));
        }
        .node-circle.optimal-skipped {
            fill: #f3f4f6;
            stroke: #9ca3af;
            stroke-width: 2.5;
        }

        @keyframes pulse-glow {
            0%,
            100% {
                filter: drop-shadow(0 0 4px rgba(234, 179, 8, 0.5));
            }
            50% {
                filter: drop-shadow(0 0 14px rgba(234, 179, 8, 0.9));
            }
        }

        .node-id {
            font-family: var(--mono);
            font-weight: 700;
            font-size: 15px;
            fill: #1e293b;
            text-anchor: middle;
            dominant-baseline: central;
            pointer-events: none;
            transition: fill 0.3s;
        }
        .node-value {
            font-family: var(--mono);
            font-weight: 500;
            font-size: 11px;
            fill: #64748b;
            text-anchor: middle;
            pointer-events: none;
            transition: fill 0.3s;
        }
        .dp-label {
            font-family: var(--mono);
            font-size: 10.5px;
            text-anchor: middle;
            pointer-events: none;
            transition: opacity 0.4s, fill 0.3s;
        }
        .dp-label.take {
            fill: #15803d;
            font-weight: 600;
        }
        .dp-label.skip {
            fill: #c2410c;
            font-weight: 600;
        }
        .dp-label.hidden {
            opacity: 0;
        }
        .dp-label.visible {
            opacity: 1;
        }

        .tree-edge {
            stroke: #cbd5e1;
            stroke-width: 2.5;
            stroke-linecap: round;
            transition: stroke 0.4s, stroke-width 0.3s;
        }
        .tree-edge.active-path {
            stroke: #94a3b8;
            stroke-width: 3.5;
        }
        .tree-edge.optimal {
            stroke: #22c55e;
            stroke-width: 3.5;
            stroke-dasharray: none;
            filter: drop-shadow(0 0 3px rgba(34, 197, 94, 0.35));
        }

        .controls-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 9px 18px;
            font-size: 0.9rem;
            font-weight: 600;
            font-family: var(--font);
            border-radius: 24px;
            border: 1.5px solid #d1d5db;
            background: #fff;
            color: #374151;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            letter-spacing: 0.01em;
        }
        .btn:hover {
            background: #f3f4f6;
            border-color: #9ca3af;
            box-shadow: var(--shadow-sm);
        }
        .btn:active {
            transform: scale(0.96);
            background: #e5e7eb;
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
            filter: grayscale(0.3);
        }
        .btn.primary {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .btn.primary:hover {
            background: #1d4ed8;
            border-color: #1d4ed8;
        }

        #counter {
            font-family: var(--mono);
            font-weight: 700;
            font-size: 1rem;
            color: #374151;
            min-width: 80px;
            text-align: center;
            background: #f1f5f9;
            border-radius: 20px;
            padding: 6px 14px;
            letter-spacing: 0.02em;
        }

        input[type="range"] {
            -webkit-appearance: none;
            flex: 1;
            min-width: 120px;
            max-width: 300px;
            height: 8px;
            border-radius: 4px;
            background: #e2e8f0;
            outline: none;
            cursor: pointer;
            accent-color: var(--accent);
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: var(--accent);
            border: 3px solid #fff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.18);
            cursor: pointer;
            transition: transform 0.15s;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }

        #explanation {
            font-size: 0.92rem;
            color: #334155;
            line-height: 1.65;
            min-height: 60px;
            padding: 12px 16px;
            background: #f8fafc;
            border-radius: var(--radius-sm);
            border-left: 4px solid var(--accent);
            letter-spacing: 0.01em;
            transition: border-color 0.3s;
        }
        #explanation .phase-tag {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            padding: 3px 10px;
            border-radius: 12px;
            margin-right: 8px;
            background: #e0e7ff;
            color: #3730a3;
        }
        #explanation .formula-display {
            display: inline-block;
            font-family: var(--mono);
            background: #fef3c7;
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin: 4px 0;
            color: #92400e;
            letter-spacing: 0.02em;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            font-size: 0.78rem;
            color: #64748b;
            padding: 4px 0;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .legend-dot {
            width: 13px;
            height: 13px;
            border-radius: 50%;
            border: 2px solid;
            flex-shrink: 0;
        }
        .legend-dot.take {
            background: #dcfce7;
            border-color: #22c55e;
        }
        .legend-dot.skip {
            background: #fff7ed;
            border-color: #f97316;
        }
        .legend-dot.highlight {
            background: #fef9c3;
            border-color: #eab308;
        }
        .legend-dot.optimal {
            background: #bbf7d0;
            border-color: #15803d;
            box-shadow: 0 0 4px rgba(34, 197, 94, 0.5);
        }

        @media (max-width: 600px) {
            #stage {
                min-height: 300px;
            }
            #stage svg {
                max-height: 300px;
            }
            .btn {
                padding: 7px 13px;
                font-size: 0.8rem;
            }
            #counter {
                font-size: 0.85rem;
                padding: 5px 10px;
                min-width: 60px;
            }
            .header h1 {
                font-size: 1.25rem;
            }
            .legend {
                gap: 6px;
                font-size: 0.7rem;
            }
        }
    </style>
</head>

    <div id="app">
        <!-- Header with verified result -->
        <div class="header">
            <h1>Tree DP: Maximum Independent Set on a Tree</h1>
            <p class="subtitle">Urban district planning — adjacent plots cannot be developed simultaneously</p>
            <div style="margin-top:8px;">
                <span class="result-badge">
                    <span class="icon">✓</span> Verified Maximum Value:
                    <span class="value" id="verified-result-display">14</span>
                </span>
            </div>
        </div>

        <!-- Legend -->
        <div class="legend">
            <span class="legend-item"><span class="legend-dot highlight"></span> Current node</span>
            <span class="legend-item"><span class="legend-dot take"></span> dp_take dominant</span>
            <span class="legend-item"><span class="legend-dot skip"></span> dp_skip dominant</span>
            <span class="legend-item"><span class="legend-dot optimal"></span> Optimal selection</span>
        </div>

        <!-- Stage: SVG visualization -->
        <div class="card" id="stage">
            <svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" aria-label="Tree DP visualization stage">
                <!-- Edges will be inserted here -->
                <g id="edges-group"></g>
                <!-- Nodes will be inserted here -->
                <g id="nodes-group"></g>
                <!-- DP labels will be inserted here -->
                <g id="dplabels-group"></g>
            </svg>
        </div>

        <!-- Explanation -->
        <div class="card" style="padding:14px 20px;">
            <div id="explanation">
                <span class="phase-tag">INIT</span> Loading visualization...
            </div>
        </div>

        <!-- Controls -->
        <div class="card" style="padding:14px 20px;">
            <div class="controls-row">
                <button class="btn" id="prev" title="Previous step (Left Arrow)" aria-label="Previous step">◀ Prev</button>
                <span id="counter">Step 0 / 0</span>
                <button class="btn" id="next" title="Next step (Right Arrow)" aria-label="Next step">Next ▶</button>
                <input type="range" id="range" min="0" max="0" value="0" step="1" title="Jump to step" aria-label="Step slider">
                <button class="btn primary" id="goto-final" title="Jump to final result" aria-label="Jump to final result">⏭ Final</button>
            </div>
        </div>
    </div>

1,"2":2,"3":1,"1":14},"dp_skip":{"4":0,"5":0,"2":11,"3":0,"1":12},"answer":14},"interaction":{"type":"input","prompt":"Internal non-English diagnostic omitted.","options":[],"answer":"14","explanation":"Internal non-English diagnostic omitted.","wrong_explanation":"Internal non-English diagnostic omitted.","option_explanations":{}},"teaching":{"what":"Internal non-English diagnostic omitted.","why":"Internal non-English diagnostic omitted.","formula":"result = max(dp_take[root], dp_skip[root])","invariant":"","common_mistake":"","hint":"Internal non-English diagnostic omitted."},"evidence":{"operation":"mark","targets":["answer"],"deps":[],"role":"answer","value":14,"before":null,"after":null,"changes":[{"target":"answer","operation":"mark","source":"event","before":null,"after":null,"value":14}],"reason":"Internal non-English diagnostic omitted.","code_line":1,"timeline":{"phase":"Internal non-English diagnostic omitted.","operation":"mark","keyframe":true,"keyframe_label":"Internal non-English diagnostic omitted.","targets":["answer"],"role":"answer"},"process":{"status":"Internal non-English diagnostic omitted.","kind":"Internal non-English diagnostic omitted.","summary":"Internal non-English diagnostic omitted.","checks":[{"label":"Internal non-English diagnostic omitted.","text":"answer"},{"label":"Internal non-English diagnostic omitted.","text":"answer: None -> None"}]},"visual_patterns":[]}}],"result":14}</script>
<script>
        (function() {
            // ──────────────────────────────────────────────
            // Read artifact from injected script tag
            // ──────────────────────────────────────────────
            const artifactScript = document.getElementById('algolab-artifact');
            let artifact;
            if (artifactScript && artifactScript.textContent.trim()) {
                try {
                    artifact = JSON.parse(artifactScript.textContent);
                } catch (e) {
                    console.warn('Failed to parse algolab-artifact, using empty fallback.', e);
                    artifact = { input_data: null, result: null, frames: [] };
                }
            } else {
                console.warn('algolab-artifact script tag not found or empty.');
                artifact = { input_data: null, result: null, frames: [] };
            }

            // ──────────────────────────────────────────────
            // Extract data
            // ──────────────────────────────────────────────
            const frames = artifact.frames || [];
            const totalFrames = frames.length;
            const verifiedResult = artifact.result;
            const inputData = artifact.input_data || artifact.input || null;

            // Parse node values from input_data
            const nodeValueMap = {};
            if (inputData && inputData.tree && inputData.tree.nodes) {
                for (const n of inputData.tree.nodes) {
                    nodeValueMap[String(n.id)] = n.value;
                }
            }

            // Parse tree edges from first frame's state (or input)
            let treeEdges = [];
            let treeNodes = [];
            if (frames.length > 0 && frames[0].state && frames[0].state.Tree) {
                const t = frames[0].state.Tree;
                treeNodes = t.nodes || [];
                treeEdges = t.edges || [];
            } else if (inputData && inputData.tree && inputData.tree.edges) {
                treeNodes = (inputData.tree.nodes || []).map(n => String(n.id));
                treeEdges = inputData.tree.edges.map(e => {
                    if (Array.isArray(e)) return { u: String(e[0]), v: String(e[1]) };
                    return { u: String(e.u), v: String(e.v) };
                });
            }

            // ──────────────────────────────────────────────
            // Fixed node positions (computed for this specific 5-node tree)
            // ──────────────────────────────────────────────
            const nodePositions = {
                '1': { cx: 400, cy: 70 },
                '2': { cx: 240, cy: 200 },
                '3': { cx: 560, cy: 200 },
                '4': { cx: 140, cy: 350 },
                '5': { cx: 340, cy: 350 }
            };
            const nodeRadius = 30;

            // ──────────────────────────────────────────────
            // DOM references
            // ──────────────────────────────────────────────
            const stage = document.getElementById('stage');
            const svg = stage.querySelector('svg');
            const edgesGroup = document.getElementById('edges-group');
            const nodesGroup = document.getElementById('nodes-group');
            const dplabelsGroup = document.getElementById('dplabels-group');
            const counterEl = document.getElementById('counter');
            const prevBtn = document.getElementById('prev');
            const nextBtn = document.getElementById('next');
            const rangeEl = document.getElementById('range');
            const explanationEl = document.getElementById('explanation');
            const gotoFinalBtn = document.getElementById('goto-final');
            const verifiedResultDisplay = document.getElementById('verified-result-display');

            // Display verified result
            if (verifiedResult !== null && verifiedResult !== undefined) {
                verifiedResultDisplay.textContent = String(verifiedResult);
            }

            let currentFrameIndex = 0;

            // ──────────────────────────────────────────────
            // Build SVG elements (static tree structure)
            // ──────────────────────────────────────────────
            // Edge elements
            const edgeElements = {};
            const allEdgeKeys = [];

            // Collect all unique undirected edges and build adjacency
            const adjacency = {};
            const edgeSet = new Set();
            for (const e of treeEdges) {
                const u = String(e.u);
                const v = String(e.v);
                const key = [u, v].sort().join('-');
                if (edgeSet.has(key)) continue;
                edgeSet.add(key);
                allEdgeKeys.push({ u, v, key });
                if (!adjacency[u]) adjacency[u] = [];
                if (!adjacency[v]) adjacency[v] = [];
                adjacency[u].push(v);
                adjacency[v].push(u);
            }

            // Create edge SVG lines
            for (const { u, v, key } of allEdgeKeys) {
                const posU = nodePositions[u];
                const posV = nodePositions[v];
                if (!posU || !posV) continue;
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', posU.cx);
                line.setAttribute('y1', posU.cy);
                line.setAttribute('x2', posV.cx);
                line.setAttribute('y2', posV.cy);
                line.setAttribute('class', 'tree-edge');
                line.setAttribute('data-edge-key', key);
                line.setAttribute('data-derived-visual-only', 'true');
                edgesGroup.appendChild(line);
                edgeElements[key] = line;
            }

            // Create node groups
            const nodeGroups = {};
            for (const nodeId of treeNodes) {
                const pos = nodePositions[nodeId];
                if (!pos) continue;
                const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                g.setAttribute('data-node-id', nodeId);
                g.setAttribute('data-derived-visual-only', 'true');

                // Circle
                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', pos.cx);
                circle.setAttribute('cy', pos.cy);
                circle.setAttribute('r', nodeRadius);
                circle.setAttribute('class', 'node-circle default');
                circle.setAttribute('data-node-circle', nodeId);
                g.appendChild(circle);

                // Node ID text
                const idText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                idText.setAttribute('x', pos.cx);
                idText.setAttribute('y', pos.cy - 5);
                idText.setAttribute('class', 'node-id');
                idText.textContent = nodeId;
                g.appendChild(idText);

                // Value text
                const valText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                valText.setAttribute('x', pos.cx);
                valText.setAttribute('y', pos.cy + 13);
                valText.setAttribute('class', 'node-value');
                const val = nodeValueMap[nodeId];
                valText.textContent = val !== undefined ? 'v=' + val : '';
                g.appendChild(valText);

                nodesGroup.appendChild(g);
                nodeGroups[nodeId] = {
                    group: g,
                    circle: circle,
                    idText: idText,
                    valText: valText,
                    pos: pos
                };
            }

            // Create DP label elements for each node
            const dpLabelElements = {};
            for (const nodeId of treeNodes) {
                const pos = nodePositions[nodeId];
                if (!pos) continue;
                const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                g.setAttribute('data-dp-labels', nodeId);
                g.setAttribute('data-derived-visual-only', 'true');

                // dp_take label (left side, green)
                const takeLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                takeLabel.setAttribute('x', pos.cx - 32);
                takeLabel.setAttribute('y', pos.cy + nodeRadius + 18);
                takeLabel.setAttribute('class', 'dp-label take hidden');
                takeLabel.textContent = '';
                g.appendChild(takeLabel);

                // dp_skip label (right side, orange)
                const skipLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                skipLabel.setAttribute('x', pos.cx + 32);
                skipLabel.setAttribute('y', pos.cy + nodeRadius + 18);
                skipLabel.setAttribute('class', 'dp-label skip hidden');
                skipLabel.textContent = '';
                g.appendChild(skipLabel);

                dplabelsGroup.appendChild(g);
                dpLabelElements[nodeId] = { group: g, take: takeLabel, skip: skipLabel };
            }

            // ──────────────────────────────────────────────
            // Determine optimal selection via backtracking
            // ──────────────────────────────────────────────
            function computeOptimalSelection(dpTake, dpSkip, rootId) {
                const selected = new Set();
                const skipped = new Set();

                function backtrack(nodeId, parentId) {
                    const takeVal = dpTake[nodeId] !== undefined ? dpTake[nodeId] : -Infinity;
                    const skipVal = dpSkip[nodeId] !== undefined ? dpSkip[nodeId] : -Infinity;

                    if (takeVal >= skipVal) {
                        // Select this node
                        selected.add(nodeId);
                        const children = (adjacency[nodeId] || []).filter(c => c !== parentId);
                        for (const child of children) {
                            skipped.add(child);
                            // For each child, since parent is selected, child must be skipped
                            // Then the child's children can be chosen freely
                            backtrackSkippedChild(child, nodeId);
                        }
                    } else {
                        // Skip this node
                        skipped.add(nodeId);
                        const children = (adjacency[nodeId] || []).filter(c => c !== parentId);
                        for (const child of children) {
                            backtrack(child, nodeId);
                        }
                    }
                }

                function backtrackSkippedChild(nodeId, parentId) {
                    // This node is forced-skipped; its children are free
                    const children = (adjacency[nodeId] || []).filter(c => c !== parentId);
                    for (const child of children) {
                        backtrack(child, nodeId);
                    }
                }

                backtrack(rootId, null);
                return { selected, skipped };
            }

            // Determine root: use node 1 as default, or find the one with dp values computed last
            const rootNodeId = '1';

            // ──────────────────────────────────────────────
            // Render a specific frame
            // ──────────────────────────────────────────────
            function renderFrame(index) {
                if (totalFrames === 0) {
                    counterEl.textContent = 'No frames';
                    explanationEl.innerHTML =
                        '<span class="phase-tag">EMPTY</span> No trace frames available for visualization.';
                    return;
                }
                if (index < 0) index = 0;
                if (index >= totalFrames) index = totalFrames - 1;
                currentFrameIndex = index;

                const frame = frames[index];
                const state = frame.state || {};
                const evidence = frame.evidence || {};
                const teaching = frame.teaching || {};
                const phase = evidence.phase || '';

                // Update counter
                counterEl.textContent = 'Step ' + frame.step + ' / ' + (totalFrames - 1);

                // Update range slider
                rangeEl.value = index;
                rangeEl.max = totalFrames - 1;

                // Update button states
                prevBtn.disabled = (index === 0);
                nextBtn.disabled = (index >= totalFrames - 1);

                // Update explanation
                let explHTML = '';
                if (phase) {
                    explHTML += '<span class="phase-tag">' + escapeHTML(phase) + '</span> ';
                }
                if (teaching.what) {
                    explHTML += escapeHTML(teaching.what) + ' ';
                }
                if (teaching.why && teaching.why !== teaching.what) {
                    explHTML += '<br><small style="color:#64748b;">Why: ' + escapeHTML(teaching.why) + '</small>';
                }
                if (teaching.formula) {
                    explHTML +=
                        ' <span class="formula-display">' + escapeHTML(teaching.formula) + '</span>';
                }
                if (!teaching.what && frame.description) {
                    explHTML += escapeHTML(frame.description);
                }
                explanationEl.innerHTML = explHTML || 'Step ' + frame.step;

                // ── Extract highlight targets ──
                const highlightNodes = new Set();
                if (evidence.targets && Array.isArray(evidence.targets)) {
                    for (const t of evidence.targets) {
                        if (typeof t === 'string' && t.startsWith('node:')) {
                            highlightNodes.add(t.slice(5));
                        }
                    }
                }

                // ── Extract dp values from state ──
                const dpTake = state.dp_take || {};
                const dpSkip = state.dp_skip || {};
                const hasAnswer = (state.answer !== undefined && state.answer !== null);

                // ── Compute optimal selection for final frame ──
                const isFinalFrame = (index === totalFrames - 1) || hasAnswer;
                let optimalSelection = null;
                if (isFinalFrame && Object.keys(dpTake).length >= treeNodes.length && Object.keys(dpSkip)
                    .length >= treeNodes.length) {
                    optimalSelection = computeOptimalSelection(dpTake, dpSkip, rootNodeId);
                }

                // ── Update node circles ──
                for (const nodeId of treeNodes) {
                    const ng = nodeGroups[nodeId];
                    if (!ng) continue;
                    const circle = ng.circle;
                    const hasDp = (dpTake[nodeId] !== undefined && dpSkip[nodeId] !== undefined);
                    const takeVal = dpTake[nodeId];
                    const skipVal = dpSkip[nodeId];

                    // Determine class
                    let circleClass = 'node-circle default';
                    if (optimalSelection && optimalSelection.selected.has(nodeId)) {
                        circleClass = 'node-circle optimal-selected';
                    } else if (optimalSelection && optimalSelection.skipped.has(nodeId)) {
                        circleClass = 'node-circle optimal-skipped';
                    } else if (highlightNodes.has(nodeId)) {
                        circleClass = 'node-circle highlighted';
                    } else if (hasDp && takeVal !== undefined && skipVal !== undefined) {
                        if (takeVal > skipVal) {
                            circleClass = 'node-circle take-dominant';
                        } else if (skipVal > takeVal) {
                            circleClass = 'node-circle skip-dominant';
                        } else {
                            circleClass = 'node-circle visited';
                        }
                    } else if (hasDp) {
                        circleClass = 'node-circle visited';
                    }
                    circle.setAttribute('class', circleClass);
                }

                // ── Update DP labels ──
                for (const nodeId of treeNodes) {
                    const lbls = dpLabelElements[nodeId];
                    if (!lbls) continue;
                    const takeVal = dpTake[nodeId];
                    const skipVal = dpSkip[nodeId];
                    const hasDp = (takeVal !== undefined && skipVal !== undefined);

                    if (hasDp) {
                        lbls.take.textContent = 'T:' + takeVal;
                        lbls.skip.textContent = 'S:' + skipVal;
                        lbls.take.setAttribute('class', 'dp-label take visible');
                        lbls.skip.setAttribute('class', 'dp-label skip visible');
                    } else if (takeVal !== undefined) {
                        lbls.take.textContent = 'T:' + takeVal;
                        lbls.skip.textContent = '';
                        lbls.take.setAttribute('class', 'dp-label take visible');
                        lbls.skip.setAttribute('class', 'dp-label skip hidden');
                    } else {
                        lbls.take.textContent = '';
                        lbls.skip.textContent = '';
                        lbls.take.setAttribute('class', 'dp-label take hidden');
                        lbls.skip.setAttribute('class', 'dp-label skip hidden');
                    }
                }

                // ── Update edges for optimal path in final frame ──
                for (const key of Object.keys(edgeElements)) {
                    const line = edgeElements[key];
                    if (optimalSelection) {
                        const [u, v] = key.split('-');
                        const uSel = optimalSelection.selected.has(u);
                        const vSel = optimalSelection.selected.has(v);
                        if (uSel || vSel) {
                            line.setAttribute('class', 'tree-edge optimal');
                        } else {
                            line.setAttribute('class', 'tree-edge');
                        }
                    } else {
                        line.setAttribute('class', 'tree-edge');
                    }
                }

                // ── Update answer highlight ──
                if (hasAnswer) {
                    const rootNg = nodeGroups[rootNodeId];
                    if (rootNg && !optimalSelection) {
                        rootNg.circle.setAttribute('class', 'node-circle optimal-selected');
                    }
                }
            }

            function escapeHTML(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            // ──────────────────────────────────────────────
            // Event handlers
            // ──────────────────────────────────────────────
            function goToFrame(index) {
                if (totalFrames === 0) return;
                if (index < 0) index = 0;
                if (index >= totalFrames) index = totalFrames - 1;
                renderFrame(index);
            }

            prevBtn.addEventListener('click', () => goToFrame(currentFrameIndex - 1));
            nextBtn.addEventListener('click', () => goToFrame(currentFrameIndex + 1));
            gotoFinalBtn.addEventListener('click', () => goToFrame(totalFrames - 1));

            rangeEl.addEventListener('input', () => {
                goToFrame(parseInt(rangeEl.value, 10));
            });

            // Keyboard navigation
            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT' && e.target.type === 'range') return;
                if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    goToFrame(currentFrameIndex - 1);
                } else if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    goToFrame(currentFrameIndex + 1);
                } else if (e.key === 'Home') {
                    e.preventDefault();
                    goToFrame(0);
                } else if (e.key === 'End') {
                    e.preventDefault();
                    goToFrame(totalFrames - 1);
                }
            });

            // ──────────────────────────────────────────────
            // Initialize
            // ──────────────────────────────────────────────
            if (totalFrames > 0) {
                rangeEl.max = totalFrames - 1;
                rangeEl.value = 0;
                renderFrame(0);
            } else {
                counterEl.textContent = 'No frames';
                rangeEl.max = 0;
                rangeEl.value = 0;
                explanationEl.innerHTML =
                    '<span class="phase-tag">INFO</span> No trace frames found. The tree structure is displayed above. The verified result is <strong>' +
                    (verifiedResult !== null && verifiedResult !== undefined ? verifiedResult : 'N/A') +
                    '</strong>.';
                // Still show the tree with default styling
                for (const nodeId of treeNodes) {
                    const ng = nodeGroups[nodeId];
                    if (ng) ng.circle.setAttribute('class', 'node-circle default');
                }
            }
        })();
    </script>
</body>
</html>
