            margin: 0;
            padding: 0;

            background: var(--bg);
            color: var(--text);

            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 24px 16px;
            line-height: 1.5;
        }

        #app {
            width: 100%;
            max-width: 860px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .header {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        .header h1 {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            margin-bottom: 4px;
        }
        .header .subtitle {
            font-size: 0.875rem;
            color: var(--muted);

            background: var(--green-light);
            color: var(--green);
            font-size: 0.78rem;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 20px;
            margin-left: 10px;
            vertical-align: middle;
        }

        .viz-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 16px 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        #stage {
            width: 100%;
            overflow: visible;
            display: block;
        }

        .controls-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 14px 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        .controls-bar button {
            font-family: var(--font);
            font-size: 0.875rem;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: #fff;
            cursor: pointer;
            transition: all 0.15s ease;
            color: var(--text);
            white-space: nowrap;
            min-width: 44px;
            text-align: center;
        }
        .controls-bar button:hover {
            background: #f3f5f7;
            border-color: #c5cdd5;
        }
        .controls-bar button:active {
            background: #e8ecf0;
            transform: scale(0.97);
        }
        .controls-bar button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }
        .controls-bar #counter {
            font-weight: 700;
            font-size: 0.9rem;
            min-width: 80px;
            text-align: center;
            color: var(--text);
            letter-spacing: 0.01em;
        }
        .controls-bar input[type="range"] {
            flex: 1;
            min-width: 100px;
            max-width: 280px;
            accent-color: var(--blue);
            height: 6px;
            cursor: pointer;
        }

            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 18px 22px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            font-size: 0.9rem;
            min-height: 60px;
            line-height: 1.6;
            color: var(--text);
            transition: background 0.2s ease;
        }
        #explanation .exp-what {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 4px;
        }
        #explanation .exp-why {
            color: var(--muted);
            font-size: 0.85rem;
            margin-top: 2px;
        }
        #explanation .exp-hint {
            color: var(--orange);
            font-size: 0.82rem;
            font-style: italic;
            margin-top: 4px;
        }
        #explanation .interaction-block {
            margin-top: 10px;
            padding: 12px 14px;
            background: #fefdf8;
            border-left: 3px solid var(--orange);
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            font-size: 0.85rem;
        }
        .interaction-block .int-prompt {
            font-weight: 600;
            margin-bottom: 4px;
        }
        .interaction-block .int-answer {
            color: var(--green);
            font-weight: 600;
        }
        .interaction-block .int-explanation {
            color: var(--muted);
            font-size: 0.8rem;
            margin-top: 3px;
        }

        .result-bar {
            background: var(--green-light);
            border: 1px solid #c3e6d4;
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            font-weight: 600;
            color: var(--green);
            font-size: 0.95rem;
            text-align: center;
            letter-spacing: 0.02em;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px 6px;
            }
            .header {
                padding: 14px 16px;

            .header h1 {

                padding: 10px 12px;
            }
            .controls-bar button {
                padding: 6px 10px;
                font-size: 0.8rem;
                min-width: 36px;
            }
            #explanation {
                padding: 12px 14px;
                font-size: 0.82rem;
            }
        }

<script>
        (function() {
            // ── Read injected artifact ──────────────────────────────
            const artifactEl = document.getElementById('algolab-artifact');
            let artifact;
            try {
                artifact = JSON.parse(artifactEl.textContent.trim());
            } catch (e) {
                console.error('Failed to parse algolab-artifact:', e);
                artifact = null;
            }

            // ── DOM references ──────────────────────────────────────
            const stage = document.getElementById('stage');
            const counter = document.getElementById('counter');
            const prevBtn = document.getElementById('prev');
            const nextBtn = document.getElementById('next');
            const rangeInput = document.getElementById('range');
            const playBtn = document.getElementById('playBtn');
            const explanation = document.getElementById('explanation');
            const resultDisplay = document.getElementById('resultDisplay');

            // ── Extract data ────────────────────────────────────────
            const frames = artifact?.frames || [];
            const verifiedResult = artifact?.result || [[1, 6], [8, 10], [15, 18]];
            const totalFrames = frames.length || 16;

            // Update range input max
            rangeInput.max = totalFrames - 1;
            rangeInput.value = 0;

            // Display verified result
            const resultStr = JSON.stringify(verifiedResult);
            resultDisplay.textContent = 'Verified Result: ' + resultStr;

            // ── State ───────────────────────────────────────────────
            let currentIndex = 0;
            let playInterval = null;
            let isPlaying = false;

            // ── SVG coordinate helpers ──────────────────────────────
            const TIME_MIN = 0;
            const TIME_MAX = 20;
            const SVG_LEFT = 55;
            const SVG_RIGHT = 760;
            const SVG_WIDTH = SVG_RIGHT - SVG_LEFT;
            const timeToX = (t) => SVG_LEFT + (t - TIME_MIN) / (TIME_MAX - TIME_MIN) * SVG_WIDTH;

            // ── Parse interval from description string ──────────────
            function parseIntervalFromDesc(desc) {
                const match = desc.match(/\[(\d+)\s*,\s*(\d+)\]/);
                if (match) {
                    return [parseInt(match[1]), parseInt(match[2])];
                }
                return null;
            }

            // ── Derive current interval for visual highlighting ─────
            function deriveCurrentInterval(frame, prevMergedLen) {
                // Try parsing from description
                const fromDesc = parseIntervalFromDesc(frame.description || '');
                if (fromDesc && frame.evidence?.phase !== 'Return result') {
                    return fromDesc;
                }
                // Try from evidence targets
                const targets = frame.evidence?.targets || [];
                for (const t of targets) {
                    const m = t.match(/\[(\d+)\s*,\s*(\d+)\]/);
                    if (m) return [parseInt(m[1]), parseInt(m[2])];
                }
                // Infer from merged state change
                const merged = frame.state?.merged || [];
                if (merged.length > prevMergedLen && merged.length > 0) {
                    // A new interval was added or the last one was extended
                    return null; // Can't determine precisely
                }
                return null;
            }

            // ── Render a single frame ───────────────────────────────
            let prevMergedLength = 0;

            function renderFrame(index) {
                if (index < 0 || index >= totalFrames) return;
                currentIndex = index;

                const frame = frames[index] || {};
                const state = frame.state || {};
                const inputIntervals = state.input_intervals || [[1, 3], [2, 6], [8, 10], [15, 18]];
                const merged = state.merged || [];
                const answer = state.answer || null;
                const teaching = frame.teaching || {};
                const interaction = frame.interaction || null;
                const phase = frame.evidence?.phase || '';

                // Derive current interval for highlighting
                const currentInterval = deriveCurrentInterval(frame, prevMergedLength);
                prevMergedLength = merged.length;

                // ── Build SVG ───────────────────────────────────────
                let svgContent = '';

                // Background
                svgContent += `<rect x="0" y="0" width="800" height="330" fill="#fafcfd" rx="8"/>`;

                // Timeline ruler
                svgContent += `<line x1="${SVG_LEFT}" y1="28" x2="${SVG_RIGHT}" y2="28" stroke="#c5cdd5" stroke-width="2"/>`;
                for (let t = TIME_MIN; t <= TIME_MAX; t += 2) {
                    const cx = timeToX(t);
                    svgContent += `<line x1="${cx}" y1="22" x2="${cx}" y2="34" stroke="#c5cdd5" stroke-width="1.5"/>`;
                    svgContent += `<text x="${cx}" y="18" text-anchor="middle" font-size="11" fill="#7a8593" font-family="var(--font)">${t}</text>`;
                }
                svgContent += `<text x="${SVG_LEFT - 8}" y="14" text-anchor="end" font-size="10" fill="#9aa5b1" font-family="var(--font)">Time →</text>`;

                // ── Row 1: Input Intervals ──────────────────────────
                const row1Y = 52;
                svgContent += `<text x="${SVG_LEFT - 6}" y="${row1Y + 18}" text-anchor="end" font-size="11" fill="#5f6b7a" font-weight="600" font-family="var(--font)">Input</text>`;
                svgContent += `<line x1="${SVG_LEFT}" y1="${row1Y + 38}" x2="${SVG_RIGHT}" y2="${row1Y + 38}" stroke="#e8ecf0" stroke-width="1" stroke-dasharray="4,3"/>`;

                inputIntervals.forEach((iv, i) => {
                    const x1 = timeToX(iv[0]);
                    const x2 = timeToX(iv[1]);
                    const w = Math.max(x2 - x1, 14);
                    const isCurrent = currentInterval && iv[0] === currentInterval[0] && iv[1] === currentInterval[1];
                    const fill = isCurrent ? '#fef5ec' : '#e8f2fb';
                    const stroke = isCurrent ? '#f08c2e' : '#4a90d9';
                    const strokeW = isCurrent ? 2.5 : 1.5;
                    const opacity = (merged.length > 0 && !isCurrent && phase === 'Main loop') ? 0.55 : 0.9;

                    svgContent += `<rect x="${x1}" y="${row1Y}" width="${w}" height="30" rx="6" fill="${fill}" stroke="${stroke}" stroke-width="${strokeW}" opacity="${opacity}" data-derived-visual-only="true"/>`;
                    const labelX = (x1 + x2) / 2;
                    svgContent += `<text x="${labelX}" y="${row1Y + 19}" text-anchor="middle" font-size="11" fill="${isCurrent ? '#c2671a' : '#3a6fa0'}" font-weight="600" font-family="var(--font)" data-derived-visual-only="true">[${iv[0]},${iv[1]}]</text>`;

                    if (isCurrent) {
                        // Pulsing indicator dot
                        svgContent += `<circle cx="${x1 - 2}" cy="${row1Y + 15}" r="5" fill="#f08c2e" opacity="0.8" data-derived-visual-only="true">
              <animate attributeName="r" values="4;7;4" dur="1.2s" repeatCount="indefinite"/>
              <animate attributeName="opacity" values="0.9;0.3;0.9" dur="1.2s" repeatCount="indefinite"/>
            </circle>`;
                    }
                });

                // ── Row 2: Current Operation indicator ──────────────
                const row2Y = 120;
                svgContent += `<text x="${SVG_LEFT - 6}" y="${row2Y + 16}" text-anchor="end" font-size="10" fill="#9aa5b1" font-weight="500" font-family="var(--font)">Op</text>`;
                svgContent += `<line x1="${SVG_LEFT}" y1="${row2Y + 30}" x2="${SVG_RIGHT}" y2="${row2Y + 30}" stroke="#e8ecf0" stroke-width="1" stroke-dasharray="4,3"/>`;

                if (currentInterval && phase === 'Main loop') {
                    const cx1 = timeToX(currentInterval[0]);
                    const cx2 = timeToX(currentInterval[1]);
                    const cw = Math.max(cx2 - cx1, 14);
                    svgContent += `<rect x="${cx1}" y="${row2Y}" width="${cw}" height="24" rx="5" fill="#fef5ec" stroke="#f08c2e" stroke-width="2" stroke-dasharray="5,2" data-derived-visual-only="true"/>`;
                    svgContent +=
                        `<text x="${(cx1+cx2)/2}" y="${row2Y+16}" text-anchor="middle" font-size="11" fill="#c2671a" font-weight="600" font-family="var(--font)" data-derived-visual-only="true">Processing [${currentInterval[0]},${currentInterval[1]}]</text>`;
                } else if (phase === 'Return result') {
                    svgContent +=
                        `<text x="${(SVG_LEFT+SVG_RIGHT)/2}" y="${row2Y+16}" text-anchor="middle" font-size="12" fill="#2ea879" font-weight="600" font-family="var(--font)" data-derived-visual-only="true">✓ Finalizing answer</text>`;
                } else if (phase === 'Initialization') {
                    svgContent +=
                        `<text x="${(SVG_LEFT+SVG_RIGHT)/2}" y="${row2Y+16}" text-anchor="middle" font-size="11" fill="#7a8593" font-family="var(--font)" data-derived-visual-only="true">Initializing data structures</text>`;
                } else if (merged.length === 0) {
                    svgContent +=
                        `<text x="${(SVG_LEFT+SVG_RIGHT)/2}" y="${row2Y+16}" text-anchor="middle" font-size="11" fill="#7a8593" font-family="var(--font)" data-derived-visual-only="true">Preparing to process intervals</text>`;
                }

                // ── Row 3: Merged Result ────────────────────────────
                const row3Y = 185;
                svgContent += `<text x="${SVG_LEFT - 6}" y="${row3Y + 18}" text-anchor="end" font-size="11" fill="#2ea879" font-weight="700" font-family="var(--font)">Merged</text>`;
                svgContent += `<line x1="${SVG_LEFT}" y1="${row3Y + 38}" x2="${SVG_RIGHT}" y2="${row3Y + 38}" stroke="#d4e8de" stroke-width="1" stroke-dasharray="4,3"/>`;

                if (merged.length === 0) {
                    svgContent +=
                        `<text x="${(SVG_LEFT+SVG_RIGHT)/2}" y="${row3Y+19}" text-anchor="middle" font-size="11" fill="#b0bcc7" font-style="italic" font-family="var(--font)" data-derived-visual-only="true">(empty — no intervals merged yet)</text>`;
                } else {
                    merged.forEach((iv) => {
                        const mx1 = timeToX(iv[0]);
                        const mx2 = timeToX(iv[1]);
                        const mw = Math.max(mx2 - mx1, 14);
                        svgContent +=
                            `<rect x="${mx1}" y="${row3Y}" width="${mw}" height="30" rx="6" fill="#eaf8f2" stroke="#2ea879" stroke-width="2" data-derived-visual-only="true"/>`;
                        const mlx = (mx1 + mx2) / 2;
                        svgContent +=
                            `<text x="${mlx}" y="${row3Y+19}" text-anchor="middle" font-size="11" fill="#1d6b4a" font-weight="600" font-family="var(--font)" data-derived-visual-only="true">[${iv[0]},${iv[1]}]</text>`;
                    });
                }

                // ── Row 4: Answer (if present) ──────────────────────
                if (answer && phase === 'Return result') {
                    const row4Y = 265;
                    svgContent += `<text x="${SVG_LEFT - 6}" y="${row4Y + 16}" text-anchor="end" font-size="11" fill="#d94848" font-weight="700" font-family="var(--font)">Answer</text>`;
                    svgContent +=
                        `<line x1="${SVG_LEFT}" y1="${row4Y + 28}" x2="${SVG_RIGHT}" y2="${row4Y + 28}" stroke="#f5d5d5" stroke-width="1" stroke-dasharray="4,3"/>`;
                    answer.forEach((iv, ai) => {
                        const ax1 = timeToX(iv[0]);
                        const ax2 = timeToX(iv[1]);
                        const aw = Math.max(ax2 - ax1, 14);
                        svgContent +=
                            `<rect x="${ax1}" y="${row4Y}" width="${aw}" height="26" rx="5" fill="#fdf2f2" stroke="#d94848" stroke-width="2" data-derived-visual-only="true"/>`;
                        const alx = (ax1 + ax2) / 2;
                        svgContent +=
                            `<text x="${alx}" y="${row4Y+17}" text-anchor="middle" font-size="11" fill="#a83434" font-weight="600" font-family="var(--font)" data-derived-visual-only="true">[${iv[0]},${iv[1]}]</text>`;
                    });
                }

                // ── Phase label ─────────────────────────────────────
                const phaseColors = {
                    'Initialization': '#7a8593',
                    'Main loop': '#4a90d9',
                    'Return result': '#2ea879'
                };
                const phaseColor = phaseColors[phase] || '#7a8593';
                svgContent +=
                    `<text x="${SVG_RIGHT}" y="318" text-anchor="end" font-size="10" fill="${phaseColor}" font-weight="600" font-family="var(--font)" data-derived-visual-only="true">Phase: ${phase || '—'}</text>`;
                svgContent +=
                    `<text x="${SVG_LEFT}" y="318" text-anchor="start" font-size="10" fill="#9aa5b1" font-family="var(--font)" data-derived-visual-only="true">Frame ${index + 1} of ${totalFrames}</text>`;

                stage.innerHTML = svgContent;

                // ── Update explanation ─────────────────────────────
                let explHTML = '';
                if (teaching.what) {
                    explHTML += `<div class="exp-what">${escapeHTML(teaching.what)}</div>`;
                }
                if (teaching.why) {
                    explHTML += `<div class="exp-why">${escapeHTML(teaching.why)}</div>`;
                }
                if (teaching.hint) {
                    explHTML += `<div class="exp-hint">💡 Hint: ${escapeHTML(teaching.hint)}</div>`;
                }
                if (teaching.common_mistake) {
                    explHTML +=
                        `<div class="exp-hint" style="color:#d94848;">⚠️ Common mistake: ${escapeHTML(teaching.common_mistake)}</div>`;
                }
                if (interaction && interaction.type === 'judge') {
                    explHTML += `<div class="interaction-block">
              <div class="int-prompt">❓ ${escapeHTML(interaction.prompt)}</div>
              <div class="int-answer">Answer: ${interaction.answer ? 'True' : 'False'}</div>
              <div class="int-explanation">${escapeHTML(interaction.explanation || '')}</div>
            </div>`;
                }
                if (!teaching.what && !interaction) {
                    explHTML +=
                        `<div class="exp-what">${escapeHTML(frame.description || 'Processing step ' + (index + 1))}</div>`;
                }
                explanation.innerHTML = explHTML;

                // ── Update controls ─────────────────────────────────
                counter.textContent = `Step ${index + 1} / ${totalFrames}`;
                rangeInput.value = index;
                prevBtn.disabled = (index <= 0);
                nextBtn.disabled = (index >= totalFrames - 1);
            }

            function escapeHTML(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            // ── Navigation ──────────────────────────────────────────
            function goToFrame(index) {
                const clamped = Math.max(0, Math.min(totalFrames - 1, index));
                renderFrame(clamped);
            }

            prevBtn.addEventListener('click', () => goToFrame(currentIndex - 1));
            nextBtn.addEventListener('click', () => goToFrame(currentIndex + 1));
            rangeInput.addEventListener('input', () => goToFrame(parseInt(rangeInput.value)));

            // Keyboard navigation
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    goToFrame(currentIndex - 1);
                } else if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    goToFrame(currentIndex + 1);
                } else if (e.key === 'Home') {
                    e.preventDefault();
                    goToFrame(0);
                } else if (e.key === 'End') {
                    e.preventDefault();
                    goToFrame(totalFrames - 1);
                }
            });

            // Play/pause
            function stopPlayback() {
                if (playInterval) clearInterval(playInterval);
                playInterval = null;
                isPlaying = false;
                playBtn.textContent = '▶ Play';
            }

            function startPlayback() {
                isPlaying = true;
                playBtn.textContent = '⏸ Pause';
                playInterval = setInterval(() => {
                    if (currentIndex >= totalFrames - 1) {
                        stopPlayback();
                        return;
                    }
                    goToFrame(currentIndex + 1);
                }, 900);
            }

            playBtn.addEventListener('click', () => {
                if (isPlaying) {
                    stopPlayback();
                } else {
                    startPlayback();
                }
            });

            // ── Initial render ──────────────────────────────────────
            renderFrame(0);

            // ── Log ─────────────────────────────────────────────────
            console.log('Merge Intervals visualization ready.');
            console.log('Frames available:', totalFrames);
            console.log('Verified result:', verifiedResult);
            console.log('Use arrow keys, buttons, or scrubber to navigate frames.');
            console.log('All visual elements marked data-derived-visual-only="true" are for display only.');
        })();
    </script>
