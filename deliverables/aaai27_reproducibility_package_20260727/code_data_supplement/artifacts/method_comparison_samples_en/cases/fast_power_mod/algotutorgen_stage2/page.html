<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Power Algorithm — Security Verification</title>
    <style>
        :root {
            --bg: #f8f9fb;
            --card-bg: #ffffff;
            --text: #1a1d28;
            --text-secondary: #5a5f72;
            --accent: #2563eb;
            --accent-light: #e8f0fe;
            --success: #0d9488;
            --success-light: #e6f7f5;
            --warning: #ea580c;
            --warning-light: #fef3e7;
            --border: #e2e5ee;
            --shadow: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08), 0 2px 4px rgba(0, 0, 0, 0.04);
            --radius: 12px;
            --radius-sm: 8px;
            --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', 'Monaco', 'Liberation Mono', monospace;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        #app {
            width: 100%;
            max-width: 820px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Header */
        .header {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 24px;
            box-shadow: var(--shadow);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }
        .header .problem-info h1 {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: var(--text);
            margin: 0 0 4px 0;
        }
        .header .problem-info .subtitle {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-family: var(--font-mono);
            background: #f3f4f8;
            padding: 4px 10px;
            border-radius: 6px;
            display: inline-block;
        }
        .verified-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--success-light);
            border: 1.5px solid #b7e5de;
            border-radius: 24px;
            padding: 10px 18px;
            font-weight: 600;
            font-size: 0.95rem;
            color: #0b5e56;
            white-space: nowrap;
        }
        .verified-badge .check-icon {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--success);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            flex-shrink: 0;
        }
        .verified-badge .result-value {
            font-family: var(--font-mono);
            font-size: 1.3rem;
            font-weight: 700;
            color: #0b5e56;
        }

        /* Stage — main visualization */
        #stage {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-height: 320px;
        }
        .var-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 14px;
        }
        .var-card {
            background: #fafbfc;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 16px 14px;
            text-align: center;
            transition: border-color var(--transition), box-shadow var(--transition), transform var(--transition);
            position: relative;
            cursor: default;
        }
        .var-card.changed {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
            animation: pulseCard 0.5s ease-out;
        }
        .var-card.final-answer {
            border-color: var(--success);
            background: var(--success-light);
            box-shadow: 0 0 0 4px rgba(13, 148, 136, 0.1);
        }
        @keyframes pulseCard {
            0% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.35);
            }
            50% {
                transform: scale(1.03);
                box-shadow: 0 0 0 8px rgba(37, 99, 235, 0.06);
            }
            100% {
                transform: scale(1);
                box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
            }
        }
        .var-card .var-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: 6px;
        }
        .var-card .var-value {
            font-family: var(--font-mono);
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text);
            transition: color var(--transition);
        }
        .var-card.changed .var-value {
            color: var(--accent);
        }
        .var-card.final-answer .var-value {
            color: #0b5e56;
        }
        .var-card .var-old {
            font-size: 0.75rem;
            color: #9ca3af;
            font-family: var(--font-mono);
            text-decoration: line-through;
            min-height: 1em;
            margin-top: 2px;
        }

        /* Binary decomposition */
        .binary-section {
            background: #f9fafc;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 16px 18px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 14px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        .binary-section .binary-label {
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            white-space: nowrap;
        }
        .binary-digits {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .binary-digit {
            width: 38px;
            height: 44px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: 1.1rem;
            border: 2px solid var(--border);
            background: #fff;
            transition: all var(--transition);
            position: relative;
        }
        .binary-digit.bit-one {
            border-color: #f59e0b;
            background: #fffbeb;
            color: #b45309;
        }
        .binary-digit.bit-zero {
            border-color: #d1d5db;
            background: #f9fafb;
            color: #9ca3af;
        }
        .binary-digit.current-bit {
            border-color: var(--accent) !important;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.18);
            background: var(--accent-light) !important;
            color: var(--accent) !important;
            transform: translateY(-3px);
            z-index: 2;
        }
        .binary-digit .bit-weight {
            font-size: 0.6rem;
            font-weight: 500;
            color: inherit;
            opacity: 0.7;
            line-height: 1;
            margin-top: 1px;
        }
        .binary-arrow {
            font-size: 1.2rem;
            color: #94a3b8;
            font-weight: 700;
        }
        .binary-contribution {
            font-size: 0.82rem;
            font-family: var(--font-mono);
            color: var(--text);
            background: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            white-space: nowrap;
        }

        /* Explanation */
        #explanation {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 22px;
            box-shadow: var(--shadow);
            min-height: 60px;
            font-size: 0.9rem;
            color: var(--text);
            line-height: 1.55;
        }
        #explanation .explain-what {
            font-weight: 600;
            margin-bottom: 4px;
        }
        #explanation .explain-why {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }
        #explanation .explain-formula {
            font-family: var(--font-mono);
            background: #f3f4f8;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.82rem;
            margin-top: 6px;
            display: inline-block;
        }
        #explanation .explain-empty {
            color: #9ca3af;
            font-style: italic;
        }

        /* Controls */
        .controls {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 20px;
            box-shadow: var(--shadow);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
        }
        .controls button {
            padding: 9px 18px;
            border-radius: 8px;
            border: 1.5px solid var(--border);
            background: #fff;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all var(--transition);
            color: var(--text);
            white-space: nowrap;
            user-select: none;
        }
        .controls button:hover:not(:disabled) {
            background: #f3f4f8;
            border-color: #c4c9d4;
        }
        .controls button:active:not(:disabled) {
            background: #e8eaf0;
            transform: scale(0.97);
        }
        .controls button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background: #f9fafb;
        }
        .controls button#next {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .controls button#next:hover:not(:disabled) {
            background: #1d4ed8;
            border-color: #1d4ed8;
        }
        #range {
            flex: 1;
            min-width: 120px;
            height: 6px;
            accent-color: var(--accent);
            cursor: pointer;
        }
        #counter {
            font-family: var(--font-mono);
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text);
            white-space: nowrap;
            min-width: 80px;
            text-align: center;
        }
        .step-title-mini {
            font-size: 0.78rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 200px;
        }

        /* Responsive */
        @media (max-width: 600px) {
            #app {
                gap: 14px;
                padding: 0;
            }
            .var-cards {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }
            .var-card {
                padding: 10px 8px;
            }
            .var-card .var-value {
                font-size: 1.2rem;
            }
            .binary-digits {
                gap: 3px;
            }
            .binary-digit {
                width: 30px;
                height: 36px;
                font-size: 0.9rem;
                border-radius: 6px;
            }
            .header {
                padding: 14px 16px;
                flex-direction: column;
                align-items: flex-start;
            }
            .controls {
                gap: 8px;
                padding: 12px 14px;
            }
            .controls button {
                padding: 7px 12px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>

    <div id="app">
        <!-- Header with problem info and verified result -->
        <header class="header">
            <div class="problem-info">
                <h1>Fast Power Algorithm — Modular Exponentiation</h1>
                <span class="subtitle">base<sup>exponent</sup> mod modulus</span>
            </div>
            <div class="verified-badge" id="verified-badge">
                <span class="check-icon">&#10003;</span>

                <span class="result-value" id="verified-result-display">—</span>
            </div>
        </header>

                    <div class="var-value">—</div>
                    <div class="var-old"></div>
                </div>
                <div class="var-card" id="card-exponent" data-var="exponent">
                    <div class="var-label">Exponent</div>
                    <div class="var-value">—</div>
                    <div class="var-old"></div>
                </div>
                <div class="var-card" id="card-mod" data-var="mod">
                    <div class="var-label">Modulus</div>
                    <div class="var-value">—</div>
                    <div class="var-old"></div>
                </div>
                <div class="var-card" id="card-result" data-var="result">
                    <div class="var-label">Result</div>
                    <div class="var-value">—</div>
                    <div class="var-old"></div>
                </div>
            </div>
            <!-- Binary decomposition — derived from current exponent -->
            <div class="binary-section" id="binary-section" data-derived-visual-only="true">
                <span class="binary-label">Binary Decomposition of Exponent</span>
                <div class="binary-digits" id="binary-digits-container"></div>
                <span class="binary-contribution" id="binary-contribution-text"></span>
            </div>
        </div>

        <!-- Explanation area -->
        <div id="explanation">
            <span class="explain-empty">Navigate through the steps to see the algorithm unfold.</span>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button id="prev" title="Previous step (Left Arrow)">&#8592; Prev</button>
            <input type="range" id="range" title="Scrub through steps" min="0" max="0" value="0" />
            <button id="next" title="Next step (Right Arrow)">Next &#8594;</button>
            <span id="counter">Step 0 / 0</span>
            <span class="step-title-mini" id="step-title-mini"></span>
        </div>
    </div>

                while (n > 0) {
                    bits.push({ bit: n & 1, weight: Math.pow(2, pos), position: pos });
                    n = Math.floor(n / 2);
                    pos++;
                }
                // bits are LSB-first; reverse for display (MSB on left)
                bits.reverse();
                return { bits, originalExponent: original };
            }

            // ───────────────────────────────────────
            // Determine which bit is being "processed" based on the original exponent
            // and the current exponent value
            // ───────────────────────────────────────
            function getCurrentBitIndex(originalExponent, currentExponent) {
                if (originalExponent === null || originalExponent === undefined) return -1;
                if (currentExponent === null || currentExponent === undefined) return -1;
                if (originalExponent === 0) return -1;
                // The number of times we've halved = number of bits processed
                // original bits count:
                const totalBits = Math.floor(Math.log2(originalExponent)) + 1;
                if (currentExponent === 0) return totalBits; // all processed
                const bitsRemaining = Math.floor(Math.log2(currentExponent)) + 1;
                const bitsProcessed = totalBits - bitsRemaining;
                return bitsProcessed; // 0-based index from LSB
            }

            // ───────────────────────────────────────
            // Render the binary decomposition section
            // ───────────────────────────────────────
            function renderBinaryDecomposition(accumulatedState, originalExponent) {
                const exponentVal = accumulatedState.exponent;
                const binaryData = computeBinaryDecomposition(
                    originalExponent !== undefined ? originalExponent : exponentVal
                );

                if (!binaryData.originalExponent && binaryData.originalExponent !== 0) {
                    binaryDigitsContainer.innerHTML =
                        '<span style="color:#9ca3af;font-style:italic;">Waiting for exponent…</span>';
                    binaryContributionText.textContent = '';
                    return;
                }

                const origExp = binaryData.originalExponent;
                const currentExp = exponentVal !== undefined ? exponentVal : origExp;
                const currentBitIdx = getCurrentBitIndex(origExp, currentExp);
                // currentBitIdx is 0-based from LSB; in our reversed display array,
                // LSB is at the end (last element)
                const displayBits = binaryData.bits;
                const lsbDisplayIndex = displayBits.length - 1; // LSB position in reversed array
                const currentDisplayIdx = (currentBitIdx >= 0 && currentBitIdx < displayBits.length)
                    ? lsbDisplayIndex - currentBitIdx
                    : -1;

                let html = '';
                for (let i = 0; i < displayBits.length; i++) {
                    const b = displayBits[i];
                    let classes = 'binary-digit';
                    if (b.bit === 1) {
                        classes += ' bit-one';
                    } else {
                        classes += ' bit-zero';
                    }
                    if (i === currentDisplayIdx) {
                        classes += ' current-bit';
                    }
                    html += `
                        <div class="${classes}" data-derived-visual-only="true">
                            <span>${b.bit}</span>
                            <span class="bit-weight">2<sup>${b.position}</sup></span>
                        </div>`;
                    if (i < displayBits.length - 1) {
                        html += '<span class="binary-arrow" data-derived-visual-only="true">&nbsp;</span>';
                    }
                }
                binaryDigitsContainer.innerHTML = html;

                // Contribution text
                if (currentBitIdx >= 0 && currentBitIdx < displayBits.length) {
                    const currentBitData = displayBits[lsbDisplayIndex - currentBitIdx];
                    if (currentBitData && currentBitData.bit === 1) {
                        binaryContributionText.textContent =
                            'Bit=1 → multiply base into result';
                    } else if (currentBitData && currentBitData.bit === 0) {
                        binaryContributionText.textContent =
                            'Bit=0 → skip multiplication';
                    } else {
                        binaryContributionText.textContent = '';
                    }
                } else if (currentExp === 0 && origExp > 0) {
                    binaryContributionText.textContent = 'All bits processed. Loop complete.';
                } else {
                    binaryContributionText.textContent = '';
                }
            }

            // ───────────────────────────────────────
            // Render variable cards
            // ───────────────────────────────────────
            function renderVarCards(accumulatedState, prevAccumulatedState) {
                const varNames = ['base', 'exponent', 'mod', 'result'];
                const displayNames = { base: 'Base', exponent: 'Exponent', mod: 'Modulus', result: 'Result' };

                for (const vn of varNames) {
                    const card = varCards[vn];
                    if (!card) continue;
                    const valueEl = card.querySelector('.var-value');
                    const oldEl = card.querySelector('.var-old');
                    const currentVal = accumulatedState[vn];
                    const prevVal = prevAccumulatedState[vn];

                    // Update value
                    if (currentVal !== undefined && currentVal !== null) {
                        valueEl.textContent = currentVal;
                    } else {
                        valueEl.textContent = '—';
                    }

                    // Show old value if changed
                    if (prevVal !== undefined && prevVal !== null && currentVal !== prevVal && currentVal !==
                        undefined) {
                        oldEl.textContent = 'was ' + prevVal;
                        card.classList.add('changed');
                        // Remove animation class after it completes
                        setTimeout(() => card.classList.remove('changed'), 600);
                    } else if (prevVal === undefined && currentVal !== undefined) {
                        oldEl.textContent = '';
                        card.classList.add('changed');
                        setTimeout(() => card.classList.remove('changed'), 600);
                    } else if (currentVal === prevVal) {
                        oldEl.textContent = '';
                        card.classList.remove('changed');
                    } else {
                        oldEl.textContent = '';
                    }

                    // Highlight final answer
                    if (vn === 'result' && accumulatedState.answer !== undefined && currentVal === verifiedResult) {
                        card.classList.add('final-answer');
                    } else {
                        card.classList.remove('final-answer');
                    }
                }

                // Handle answer card if present in state
                if (accumulatedState.answer !== undefined && accumulatedState.answer !== null) {
                    let answerCard = document.getElementById('card-answer');
                    if (!answerCard) {
                        answerCard = document.createElement('div');
                        answerCard.className = 'var-card final-answer';
                        answerCard.id = 'card-answer';
                        answerCard.setAttribute('data-var', 'answer');
                        answerCard.innerHTML = `
                            <div class="var-label">Answer (Verified)</div>
                            <div class="var-value">${accumulatedState.answer}</div>
                            <div class="var-old"></div>`;
                        varCardsContainer.appendChild(answerCard);
                        varCards['answer'] = answerCard;
                    } else {
                        answerCard.querySelector('.var-value').textContent = accumulatedState.answer;
                    }
                } else {
                    const answerCard = document.getElementById('card-answer');
                    if (answerCard) {
                        answerCard.remove();
                        delete varCards['answer'];
                    }
                }
            }

            // ───────────────────────────────────────
            // Render explanation
            // ───────────────────────────────────────
            function renderExplanation(frame) {
                if (!frame || !frame.teaching) {
                    explanationEl.innerHTML =
                        '<span class="explain-empty">No explanation available for this step.</span>';
                    return;
                }
                const t = frame.teaching;
                let html = '';
                if (t.what) {
                    html += `<div class="explain-what">${escapeHtml(t.what)}</div>`;
                }
                if (t.why) {
                    html += `<div class="explain-why">${escapeHtml(t.why)}</div>`;
                }
                if (t.formula) {
                    html += `<span class="explain-formula">${escapeHtml(t.formula)}</span>`;
                }
                if (t.invariant) {
                    html +=
                        `<div class="explain-why" style="margin-top:4px;color:#0d9488;"><strong>Invariant:</strong> ${escapeHtml(t.invariant)}</div>`;
                }
                if (!html) {
                    html = '<span class="explain-empty">No detailed explanation for this step.</span>';
                }
                explanationEl.innerHTML = html;
            }

            function escapeHtml(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            // ───────────────────────────────────────
            // Main render function
            // ───────────────────────────────────────
            function renderFrame(index) {
                if (totalFrames === 0) {
                    counterEl.textContent = 'No frames';
                    rangeEl.max = 0;
                    rangeEl.value = 0;
                    prevBtn.disabled = true;
                    nextBtn.disabled = true;
                    stepTitleMini.textContent = '';
                    explanationEl.innerHTML =
                        '<span class="explain-empty">No algorithm trace data available.</span>';
                    return;
                }

                // Clamp index
                const clampedIndex = Math.max(0, Math.min(totalFrames - 1, index));
                currentFrameIndex = clampedIndex;

                const frame = frames[clampedIndex];
                const accumulatedState = getAccumulatedState(clampedIndex);
                const prevAccumulatedState = getPrevAccumulatedState(clampedIndex);

                // Update previous state reference for next render
                previousState = { ...accumulatedState };

                // Render variable cards
                renderVarCards(accumulatedState, prevAccumulatedState);

                // Determine original exponent (from input or earliest frame)
                let originalExponent = inputData.exponent;
                if (originalExponent === undefined) {
                    // Try to find it in early frames
                    for (let i = 0; i < totalFrames; i++) {
                        const s = frames[i].state;
                        if (s && s.exponent !== undefined) {
                            // The first time exponent appears, that's likely close to original
                            // But we want the initial value. Check frame 1 or 2.
                            if (originalExponent === undefined && s.exponent > 0) {
                                originalExponent = s.exponent;
                            }
                        }
                    }
                }
                // For our specific problem, original exponent is 5
                if (originalExponent === undefined) originalExponent = 5;

                // Render binary decomposition
                renderBinaryDecomposition(accumulatedState, originalExponent);

                // Render explanation
                renderExplanation(frame);

                // Update controls
                counterEl.textContent = `Step ${clampedIndex + 1} / ${totalFrames}`;
                rangeEl.max = totalFrames - 1;
                rangeEl.value = clampedIndex;
                prevBtn.disabled = clampedIndex === 0;
                nextBtn.disabled = clampedIndex >= totalFrames - 1;
                stepTitleMini.textContent = frame.title || frame.description || '';
            }

            // ───────────────────────────────────────
            // Event handlers
            // ───────────────────────────────────────
            prevBtn.addEventListener('click', () => {
                if (currentFrameIndex > 0) {
                    renderFrame(currentFrameIndex - 1);
                }
            });

            nextBtn.addEventListener('click', () => {
                if (currentFrameIndex < totalFrames - 1) {
                    renderFrame(currentFrameIndex + 1);
                }
            });

            rangeEl.addEventListener('input', () => {
                const val = parseInt(rangeEl.value, 10);
                if (!isNaN(val)) {
                    renderFrame(val);
                }
            });

            // Keyboard navigation
            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT' && e.target.type === 'range') return;
                if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    if (currentFrameIndex > 0) renderFrame(currentFrameIndex - 1);
                } else if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    if (currentFrameIndex < totalFrames - 1) renderFrame(currentFrameIndex + 1);
                } else if (e.key === 'Home') {
                    e.preventDefault();
                    renderFrame(0);
                } else if (e.key === 'End') {
                    e.preventDefault();
                    renderFrame(totalFrames - 1);
                }
            });

            // ───────────────────────────────────────
            // Initialize
            // ───────────────────────────────────────
            rangeEl.min = 0;
            rangeEl.max = totalFrames > 0 ? totalFrames - 1 : 0;
            rangeEl.value = 0;

            if (totalFrames > 0) {
                renderFrame(0);
            } else {
                counterEl.textContent = 'No frames';
                prevBtn.disabled = true;
                nextBtn.disabled = true;
                stepTitleMini.textContent = '';
                explanationEl.innerHTML =
                    '<span class="explain-empty">No algorithm trace frames available. The artifact may be incomplete.</span>';
                // Still try to show the verified result
                if (verifiedResult !== null && verifiedResult !== undefined) {
                    explanationEl.innerHTML +=
                        `<br><span style="font-weight:600;color:#0d9488;">Verified result: ${verifiedResult}</span>`;
                }
            }
        })();
    </script>
</body>
</html>
