<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naive String Matching — DNA Strand Search Visualization</title>
    <style>
        :root {
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --border: #e2e8f0;
            --accent: #3b82f6;
            --accent-light: #dbeafe;
            --match: #22c55e;
            --match-bg: #dcfce7;
            --mismatch: #ef4444;
            --mismatch-bg: #fee2e2;
            --comparing: #f59e0b;
            --comparing-bg: #fef3c7;
            --window-bg: #eff6ff;
            --window-border: #93c5fd;
            --default-cell: #f1f5f9;
            --shadow: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.05), 0 2px 4px rgba(0, 0, 0, 0.04);
            --radius: 10px;
            --radius-sm: 6px;
            --transition: 0.2s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #f0f4f8 0%, #e8edf3 50%, #f0f4f8 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            line-height: 1.6;
        }

        #app {
            width: 100%;
            max-width: 820px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: var(--shadow-md), 0 12px 40px rgba(0, 0, 0, 0.06);
            padding: 28px 32px 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            text-align: center;
        }
        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: #0f172a;
            margin-bottom: 4px;
        }
        .header .subtitle {
            font-size: 0.875rem;
            color: var(--muted);
            font-weight: 400;
        }
        .header .badge-row {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 6px;
        }
        .badge {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            padding: 3px 10px;
            border-radius: 99px;
            background: #eef2ff;
            color: #4338ca;
            border: 1px solid #c7d2fe;
        }
        .badge.result-badge {
            background: #dcfce7;
            color: #166534;
            border-color: #bbf7d0;
        }

        /* Stage */
        #stage {
            background: #fafbfc;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px 20px 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-height: 180px;
            position: relative;
            overflow-x: auto;
        }

        .strand-label {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--muted);
            margin-bottom: 2px;
        }

        .char-row {
            display: flex;
            gap: 3px;
            align-items: flex-end;
            flex-wrap: nowrap;
        }
        .char-row.pattern-row {
            padding-left: 0;
            transition: padding-left var(--transition);
        }

        .char-cell-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            min-width: 42px;
            transition: transform var(--transition), opacity var(--transition);
        }
        .char-index {
            font-size: 0.6rem;
            font-weight: 600;
            color: #94a3b8;
            letter-spacing: 0.03em;
            user-select: none;
        }
        .char-cell {
            width: 38px;
            height: 42px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
            font-weight: 700;
            font-family: 'SF Mono', 'Fira Code', 'Consolas', 'Monaco', monospace;
            background: var(--default-cell);
            color: #475569;
            border: 2px solid transparent;
            transition: all var(--transition);
            user-select: none;
            position: relative;
        }
        .char-cell.in-window {
            background: var(--window-bg);
            border-color: var(--window-border);
            color: #1e40af;
        }
        .char-cell.comparing {
            background: var(--comparing-bg);
            border-color: var(--comparing);
            color: #92400e;
            transform: scale(1.08);
            z-index: 2;
            box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.18);
            animation: pulse-attention 0.7s ease-in-out infinite;
        }
        .char-cell.match {
            background: var(--match-bg);
            border-color: var(--match);
            color: #166534;
        }
        .char-cell.mismatch {
            background: var(--mismatch-bg);
            border-color: var(--mismatch);
            color: #991b1b;
            animation: shake 0.35s ease-in-out;
        }
        .char-cell.pattern-cell {
            background: #f8fafc;
            border-color: #cbd5e1;
            color: #334155;
            font-size: 1rem;
        }
        .char-cell.pattern-cell.comparing {
            background: var(--comparing-bg);
            border-color: var(--comparing);
            color: #92400e;
            transform: scale(1.08);
            z-index: 2;
            box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.18);
        }
        .char-cell.pattern-cell.match {
            background: var(--match-bg);
            border-color: var(--match);
            color: #166534;
        }
        .char-cell.pattern-cell.mismatch {
            background: var(--mismatch-bg);
            border-color: var(--mismatch);
            color: #991b1b;
        }

        @keyframes pulse-attention {
            0%,
            100% {
                box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.18);
            }
            50% {
                box-shadow: 0 0 0 8px rgba(245, 158, 11, 0.07);
            }
        }
        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-3px);
            }
            75% {
                transform: translateX(3px);
            }
        }

        .window-marker {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #3b82f6;
            padding: 4px 0;
            user-select: none;
        }
        .window-marker .arrow {
            font-size: 1rem;
        }

        /* Explanation */
        #explanation {
            background: #fefce8;
            border: 1px solid #fde68a;
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            font-size: 0.85rem;
            color: #713f12;
            min-height: 48px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            transition: all var(--transition);
        }
        #explanation .what {
            font-weight: 700;
            font-size: 0.9rem;
            color: #92400e;
        }
        #explanation .why {
            color: #a16207;
            font-size: 0.8rem;
        }
        #explanation .hint {
            font-size: 0.75rem;
            color: #b45309;
            font-style: italic;
            margin-top: 2px;
        }

        /* Result display */
        .result-display {
            text-align: center;
            padding: 10px 16px;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 0.95rem;
            color: #166534;
            transition: opacity var(--transition);
        }
        .result-display.dim {
            opacity: 0.5;
        }
        .result-display .result-value {
            font-size: 1.4rem;
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            color: #15803d;
            letter-spacing: 0.02em;
        }

        /* Controls */
        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            padding: 8px 18px;
            border-radius: 99px;
            border: 1px solid #cbd5e1;
            background: #fff;
            color: #334155;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all var(--transition);
            user-select: none;
            white-space: nowrap;
        }
        .btn:hover {
            background: #f1f5f9;
            border-color: #94a3b8;
        }
        .btn:active {
            transform: scale(0.96);
            background: #e2e8f0;
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }
        .btn.primary {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .btn.primary:hover {
            background: #2563eb;
            border-color: #2563eb;
        }
        #counter {
            font-weight: 700;
            font-size: 0.9rem;
            color: #475569;
            min-width: 80px;
            text-align: center;
            user-select: none;
        }
        #range {
            flex: 1;
            min-width: 120px;
            max-width: 280px;
            accent-color: var(--accent);
            cursor: pointer;
            height: 6px;
        }
        .speed-group {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.75rem;
            color: var(--muted);
        }
        .speed-group select {
            font-size: 0.75rem;
            padding: 3px 6px;
            border-radius: 4px;
            border: 1px solid #cbd5e1;
            background: #fff;
            cursor: pointer;
        }

        /* Responsive */
        @media (max-width: 600px) {
            #app {
                padding: 16px 12px 14px;
                gap: 12px;
            }
            .char-cell {
                width: 30px;
                height: 34px;
                font-size: 0.95rem;
            }
            .char-cell-wrapper {
                min-width: 32px;
            }
            #stage {
                padding: 12px 8px 10px;
            }
            .btn {
                padding: 6px 12px;
                font-size: 0.78rem;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Header -->
        <div class="header">
            <h1>DNA Strand Search</h1>
            <p class="subtitle">Naive String Matching — Find the first occurrence of a gene probe pattern</p>
            <div class="badge-row">
                <span class="badge">Text: ababc</span>
                <span class="badge">Pattern: abc</span>
                <span class="badge result-badge" id="result-badge">Result: 2</span>
            </div>
        </div>

        <!-- Stage -->
        <div id="stage">
            <div class="strand-label">Text Strand (indices above)</div>
            <div class="char-row" id="text-row" data-derived-visual-only="true"></div>
            <div class="window-marker" id="window-marker" data-derived-visual-only="true"></div>
            <div class="strand-label">Gene Probe Pattern</div>
            <div class="char-row pattern-row" id="pattern-row" data-derived-visual-only="true"></div>
        </div>

        <!-- Explanation -->
        <div id="explanation">
            <span class="what">Loading visualization…</span>
            <span class="why"></span>
            <span class="hint"></span>
        </div>

        <!-- Verified Result -->
        <div class="result-display dim" id="result-display">
            Verified answer: <span class="result-value" id="result-value">—</span>
            <span style="font-size:0.75rem;display:block;color:#6b7280;">(from artifact.result)</span>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button class="btn" id="prev" title="Previous step">◀ Prev</button>
            <button class="btn primary" id="play-pause" title="Auto-play">▶ Play</button>
            <button class="btn" id="next" title="Next step">Next ▶</button>
            <span id="counter">Step 0 / 0</span>
            <input type="range" id="range" min="0" max="0" value="0" title="Timeline scrubber" />
            <span class="speed-group">
                Speed:
                <select id="speed-select">
                    <option value="1200">0.5×</option>
                    <option value="700" selected>1×</option>
                    <option value="350">2×</option>
                    <option value="180">4×</option>
                </select>
            </span>
        </div>
    </div>

<script>
        (function() {
            /* ── Read injected artifact ── */
            const artifactEl = document.getElementById('algolab-artifact');
            if (!artifactEl) {
                document.getElementById('explanation').innerHTML =
                    '<span class="what">Error: Missing artifact data.</span>';
                return;
            }
            let artifact;
            try {
                artifact = JSON.parse(artifactEl.textContent);
            } catch (e) {
                document.getElementById('explanation').innerHTML =
                    '<span class="what">Error: Invalid artifact JSON.</span>';
                return;
            }

            const frames = artifact.frames || [];
            const verifiedResult = artifact.result;
            const totalFrames = frames.length;

            if (totalFrames === 0) {
                document.getElementById('explanation').innerHTML =
                    '<span class="what">No animation frames available.</span>';
                return;
            }

            /* ── DOM refs ── */
            const stage = document.getElementById('stage');
            const textRow = document.getElementById('text-row');
            const patternRow = document.getElementById('pattern-row');
            const windowMarker = document.getElementById('window-marker');
            const explanationEl = document.getElementById('explanation');
            const resultDisplay = document.getElementById('result-display');
            const resultValueEl = document.getElementById('result-value');
            const counterEl = document.getElementById('counter');
            const prevBtn = document.getElementById('prev');
            const nextBtn = document.getElementById('next');
            const playPauseBtn = document.getElementById('play-pause');
            const rangeEl = document.getElementById('range');
            const speedSelect = document.getElementById('speed-select');
            const resultBadge = document.getElementById('result-badge');

            /* ── State ── */
            let currentFrameIndex = 0;
            let isPlaying = false;
            let playInterval = null;
            let playSpeed = 700;

            /* ── Display verified result ── */
            if (verifiedResult !== undefined && verifiedResult !== null) {
                resultValueEl.textContent = verifiedResult;
                resultBadge.textContent = 'Result: ' + verifiedResult;
            } else {
                resultValueEl.textContent = '—';
            }

            /* ── Pre-process frames to build visual state timeline ── */
            const visualTimeline = [];
            let ws = -1; // windowStart
            let comps = []; // comparisons: [{textIdx, patternIdx, match}]
            let txtArr = [];
            let patArr = [];
            let ans = null;
            let currentPhase = '';

            for (let fi = 0; fi < totalFrames; fi++) {
                const frame = frames[fi];
                const state = frame.state || {};
                const evidence = frame.evidence || {};
                const teaching = frame.teaching || {};
                const targets = evidence.targets || [];
                const phase = evidence.phase || currentPhase;

                /* Update persistent data from state */
                if (Array.isArray(state.text)) txtArr = [...state.text];
                if (Array.isArray(state.pattern)) patArr = [...state.pattern];
                if (state.answer !== undefined && state.answer !== null) ans = state.answer;
                currentPhase = phase;

                /* Parse targets */
                let highlightedTextIdx = -1;
                let highlightedPatternIdx = -1;
                let isWindowStart = false;
                let compareValue = null; // 'match' | 'mismatch' | null

                for (const target of targets) {
                    const m = target.match(/^(\w+)(?:\[(\d+)\])?$/);
                    if (!m) continue;
                    const [, name, idxStr] = m;
                    const idx = idxStr !== undefined ? parseInt(idxStr, 10) : -1;

                    if (name === 'text' && idx >= 0) {
                        highlightedTextIdx = idx;
                    } else if (name === 'pattern' && idx >= 0) {
                        highlightedPatternIdx = idx;
                    }
                }

                /* Determine if this is a new window start */
                const role = evidence.role || '';
                const value = evidence.value;
                if (role === 'window_start' || (phase === 'main_loop' && role === 'mark' && highlightedTextIdx >= 0 &&
                        teaching.why && (
                            teaching.why.toLowerCase().includes('new window') ||
                            teaching.why.toLowerCase().includes('next start') ||
                            teaching.why.toLowerCase().includes('try the next')
                        ))) {
                    isWindowStart = true;
                }
                /* Also detect window start when highlightedTextIdx differs from expected next comparison */
                if (!isWindowStart && highlightedTextIdx >= 0 && phase === 'main_loop') {
                    if (ws < 0) {
                        isWindowStart = true;
                    } else if (comps.length > 0) {
                        const lastComp = comps[comps.length - 1];
                        if (lastComp.match === false) {
                            /* Previous window ended in mismatch; a new highlighted text index starts a new window */
                            if (highlightedTextIdx !== lastComp.textIdx) {
                                isWindowStart = true;
                            }
                        }
                    }
                }

                if (isWindowStart) {
                    ws = highlightedTextIdx;
                    comps = [];
                }

                /* Resolve pattern index for comparison */
                if (highlightedTextIdx >= 0 && ws >= 0 && !isWindowStart) {
                    const inferredPatIdx = highlightedTextIdx - ws;
                    if (inferredPatIdx >= 0 && inferredPatIdx < patArr.length) {
                        highlightedPatternIdx = inferredPatIdx;
                    }
                }

                /* Determine match/mismatch for the comparison */
                compareValue = null;
                if (highlightedTextIdx >= 0 && highlightedPatternIdx >= 0 &&
                    highlightedTextIdx < txtArr.length && highlightedPatternIdx < patArr.length &&
                    role === 'compare') {
                    compareValue = (txtArr[highlightedTextIdx] === patArr[highlightedPatternIdx]) ? 'match' :
                        'mismatch';
                }
                /* Also read from evidence.value if present */
                if (value === 'match' || value === 'mismatch') {
                    compareValue = value;
                }
                /* Derive match/mismatch from actual characters for visualization */
                let derivedMatch = null;
                if (highlightedTextIdx >= 0 && highlightedPatternIdx >= 0 &&
                    highlightedTextIdx < txtArr.length && highlightedPatternIdx < patArr.length) {
                    derivedMatch = txtArr[highlightedTextIdx] === patArr[highlightedPatternIdx];
                }

                /* Record comparison */
                if (highlightedTextIdx >= 0 && highlightedPatternIdx >= 0 && !isWindowStart &&
                    role === 'compare') {
                    const existsIdx = comps.findIndex(c => c.patternIdx === highlightedPatternIdx);
                    const compEntry = {
                        textIdx: highlightedTextIdx,
                        patternIdx: highlightedPatternIdx,
                        match: derivedMatch === true
                    };
                    if (existsIdx >= 0) {
                        comps[existsIdx] = compEntry;
                    } else {
                        comps.push(compEntry);
                    }
                }

                /* Build visual state */
                const vs = {
                    textArr: [...txtArr],
                    patternArr: [...patArr],
                    windowStart: ws,
                    comparisons: comps.map(c => ({ ...c })),
                    highlightedTextIdx,
                    highlightedPatternIdx,
                    isWindowStart,
                    compareValue,
                    derivedMatch,
                    answer: ans,
                    phase,
                    teachingWhat: teaching.what || frame.description || '',
                    teachingWhy: teaching.why || '',
                    teachingHint: teaching.hint || '',
                    title: frame.title || '',
                    step: frame.step !== undefined ? frame.step : fi,
                    role,
                };
                visualTimeline.push(vs);
            }

            /* ── Render a specific frame ── */
            function renderFrame(index) {
                if (index < 0 || index >= totalFrames) return;
                currentFrameIndex = index;

                const vs = visualTimeline[index];
                if (!vs) return;

                const txt = vs.textArr;
                const pat = vs.patternArr;
                const wStart = vs.windowStart;
                const compsMap = {};
                vs.comparisons.forEach(c => { compsMap[c.textIdx] = c.match; });

                const hText = vs.highlightedTextIdx;
                const hPat = vs.highlightedPatternIdx;

                /* Build text row */
                textRow.innerHTML = '';
                for (let i = 0; i < txt.length; i++) {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'char-cell-wrapper';
                    wrapper.setAttribute('data-derived-visual-only', 'true');

                    const idxLabel = document.createElement('span');
                    idxLabel.className = 'char-index';
                    idxLabel.textContent = i;
                    wrapper.appendChild(idxLabel);

                    const cell = document.createElement('div');
                    cell.className = 'char-cell';
                    cell.textContent = txt[i];
                    cell.setAttribute('data-derived-visual-only', 'true');

                    /* Determine cell styling */
                    const inWindow = wStart >= 0 && i >= wStart && i < wStart + pat.length;
                    const isComparing = (i === hText) && (hText >= 0);
                    const matchStatus = compsMap[i];

                    if (isComparing) {
                        cell.classList.add('comparing');
                    } else if (matchStatus === true) {
                        cell.classList.add('match');
                    } else if (matchStatus === false) {
                        cell.classList.add('mismatch');
                    } else if (inWindow && vs.phase === 'main_loop') {
                        cell.classList.add('in-window');
                    }

                    wrapper.appendChild(cell);
                    textRow.appendChild(wrapper);
                }

                /* Build pattern row */
                patternRow.innerHTML = '';
                const patternOffset = wStart >= 0 ? wStart : 0;
                /* Add spacer cells to align pattern under the window */
                for (let s = 0; s < patternOffset; s++) {
                    const spacer = document.createElement('div');
                    spacer.className = 'char-cell-wrapper';
                    spacer.style.visibility = 'hidden';
                    spacer.setAttribute('data-derived-visual-only', 'true');
                    const idxLabel = document.createElement('span');
                    idxLabel.className = 'char-index';
                    idxLabel.textContent = '·';
                    spacer.appendChild(idxLabel);
                    const cell = document.createElement('div');
                    cell.className = 'char-cell';
                    cell.style.background = 'transparent';
                    cell.style.border = '2px solid transparent';
                    cell.textContent = '';
                    spacer.appendChild(cell);
                    patternRow.appendChild(spacer);
                }

                for (let j = 0; j < pat.length; j++) {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'char-cell-wrapper';
                    wrapper.setAttribute('data-derived-visual-only', 'true');

                    const idxLabel = document.createElement('span');
                    idxLabel.className = 'char-index';
                    idxLabel.textContent = j;
                    wrapper.appendChild(idxLabel);

                    const cell = document.createElement('div');
                    cell.className = 'char-cell pattern-cell';
                    cell.textContent = pat[j];
                    cell.setAttribute('data-derived-visual-only', 'true');

                    const textIdx = wStart >= 0 ? wStart + j : -1;
                    const isPatComparing = (j === hPat) && (hPat >= 0);
                    const matchStatus = (textIdx >= 0) ? compsMap[textIdx] : undefined;

                    if (isPatComparing) {
                        cell.classList.add('comparing');
                    } else if (matchStatus === true) {
                        cell.classList.add('match');
                    } else if (matchStatus === false) {
                        cell.classList.add('mismatch');
                    }

                    wrapper.appendChild(cell);
                    patternRow.appendChild(wrapper);
                }

                /* Window marker */
                if (wStart >= 0 && vs.phase === 'main_loop') {
                    windowMarker.innerHTML =
                        '<span class="arrow">▼</span> Window starts at text index <strong>' + wStart +
                        '</strong> — comparing text[' + wStart + '..' + (wStart + pat.length - 1) + '] with pattern';
                    windowMarker.style.display = 'flex';
                } else if (vs.phase === 'return_result' || vs.phase === 'initialization') {
                    windowMarker.style.display = 'none';
                } else {
                    windowMarker.style.display = 'none';
                }

                /* Explanation */
                let whatHtml = vs.teachingWhat || vs.title || '';
                let whyHtml = vs.teachingWhy || '';
                let hintHtml = vs.teachingHint || '';

                if (vs.phase === 'return_result' && vs.answer !== null) {
                    if (!whatHtml) whatHtml = 'Algorithm complete — answer is ' + vs.answer;
                    resultDisplay.classList.remove('dim');
                } else if (vs.phase === 'initialization') {
                    resultDisplay.classList.add('dim');
                } else {
                    resultDisplay.classList.add('dim');
                }

                explanationEl.innerHTML =
                    '<span class="what">' + escapeHtml(whatHtml) + '</span>' +
                    (whyHtml ? '<span class="why">' + escapeHtml(whyHtml) + '</span>' : '') +
                    (hintHtml ? '<span class="hint">💡 ' + escapeHtml(hintHtml) + '</span>' : '');

                /* Update counter */
                counterEl.textContent = 'Step ' + (vs.step + 1) + ' / ' + totalFrames;

                /* Update range */
                rangeEl.value = index;
                rangeEl.max = totalFrames - 1;

                /* Update buttons */
                prevBtn.disabled = (index <= 0);
                nextBtn.disabled = (index >= totalFrames - 1);

                /* Update result display highlight on final frame */
                if (index === totalFrames - 1 && vs.answer !== null) {
                    resultDisplay.classList.remove('dim');
                }
            }

            function escapeHtml(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            /* ── Navigation ── */
            function goToFrame(index) {
                const clamped = Math.max(0, Math.min(totalFrames - 1, index));
                renderFrame(clamped);
            }

            function stepPrev() {
                if (currentFrameIndex > 0) {
                    goToFrame(currentFrameIndex - 1);
                }
            }

            function stepNext() {
                if (currentFrameIndex < totalFrames - 1) {
                    goToFrame(currentFrameIndex + 1);
                }
            }

            function togglePlay() {
                if (isPlaying) {
                    stopPlay();
                } else {
                    startPlay();
                }
            }

            function startPlay() {
                if (isPlaying) return;
                isPlaying = true;
                playPauseBtn.textContent = '⏸ Pause';
                playPauseBtn.classList.add('primary');
                scheduleNext();
            }

            function stopPlay() {
                isPlaying = false;
                playPauseBtn.textContent = '▶ Play';
                playPauseBtn.classList.remove('primary');
                if (playInterval) {
                    clearTimeout(playInterval);
                    playInterval = null;
                }
            }

            function scheduleNext() {
                if (!isPlaying) return;
                playInterval = setTimeout(() => {
                    if (currentFrameIndex < totalFrames - 1) {
                        goToFrame(currentFrameIndex + 1);
                        scheduleNext();
                    } else {
                        stopPlay();
                    }
                }, playSpeed);
            }

            /* ── Event listeners ── */
            prevBtn.addEventListener('click', () => {
                stopPlay();
                stepPrev();
            });
            nextBtn.addEventListener('click', () => {
                stopPlay();
                stepNext();
            });
            playPauseBtn.addEventListener('click', togglePlay);
            rangeEl.addEventListener('input', () => {
                stopPlay();
                goToFrame(parseInt(rangeEl.value, 10));
            });
            speedSelect.addEventListener('change', () => {
                playSpeed = parseInt(speedSelect.value, 10);
                if (isPlaying) {
                    stopPlay();
                    startPlay();
                }
            });

            /* Keyboard navigation */
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    stopPlay();
                    stepPrev();
                } else if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    stopPlay();
                    stepNext();
                } else if (e.key === ' ') {
                    e.preventDefault();
                    togglePlay();
                } else if (e.key === 'Home') {
                    e.preventDefault();
                    stopPlay();
                    goToFrame(0);
                } else if (e.key === 'End') {
                    e.preventDefault();
                    stopPlay();
                    goToFrame(totalFrames - 1);
                }
            });

            /* ── Initialize ── */
            rangeEl.max = totalFrames - 1;
            rangeEl.value = 0;
            renderFrame(0);

            /* Expose for potential external use */
            window.algolabRenderer = {
                renderFrame,
                goToFrame,
                stepPrev,
                stepNext,
                togglePlay,
                getCurrentIndex: () => currentFrameIndex,
                getTotalFrames: () => totalFrames,
            };

            console.log('Naive String Matching visualization ready. ' + totalFrames +
                ' frames loaded. Verified result: ' + verifiedResult +
                '. Use arrow keys, space, or buttons to navigate.');
        })();
    </script>
</body>
