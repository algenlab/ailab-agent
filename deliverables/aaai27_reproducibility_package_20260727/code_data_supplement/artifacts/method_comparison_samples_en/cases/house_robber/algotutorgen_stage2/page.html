<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Robber DP Visualizer</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --surface: #16213e;
            --surface-light: #1f2d4a;
            --text: #e0e0e0;
            --text-secondary: #a0a8b8;
            --accent: #f0a500;
            --accent-glow: #ffc107;
            --green: #2ecc71;
            --green-dark: #1a7a3a;
            --red: #e74c3c;
            --red-soft: #c0392b;
            --blue: #3498db;
            --blue-glow: #5dade2;
            --border: #2a3550;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
            --font-mono: 'Courier New', 'Consolas', 'Monaco', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            line-height: 1.6;
        }

        #app {
            width: 100%;
            max-width: 960px;
            background: var(--surface);
            border-radius: 16px;
            padding: 28px 32px 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .app-header {
            text-align: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 14px;
        }
        .app-header h1 {
            font-size: 1.7rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: #fff;
            margin: 0 0 4px;
        }
        .app-header .subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-style: italic;
        }

        #stage {
            position: relative;
            background: var(--surface-light);
            border-radius: 12px;
            padding: 24px 20px 20px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 22px;
            min-height: 340px;
        }

        /* ── Houses row ── */
        .houses-row {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 8px;
            flex-wrap: wrap;
            padding: 8px 0 4px;
        }
        .house-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s ease, filter 0.3s ease;
            cursor: default;
        }
        .house-wrapper.processing {
            transform: translateY(-8px);
            filter: drop-shadow(0 6px 18px rgba(240, 165, 0, 0.55));
            z-index: 2;
        }
        .house-wrapper.robbed {
            filter: drop-shadow(0 4px 14px rgba(46, 204, 113, 0.5));
        }
        .house-wrapper.skipped {
            opacity: 0.5;
            filter: grayscale(0.5);
        }
        .house-wrapper.pending {
            opacity: 0.7;
        }
        .house-svg {
            display: block;
            transition: all 0.3s ease;
        }
        .house-label {
            font-size: 0.75rem;
            font-weight: 600;
            margin-top: 2px;
            color: var(--text-secondary);
            letter-spacing: 0.02em;
            text-align: center;
        }
        .house-wrapper.processing .house-label {
            color: var(--accent-glow);
        }
        .house-wrapper.robbed .house-label {
            color: var(--green);
        }

        /* Alarm connectors between houses */
        .alarm-indicator {
            display: flex;
            align-items: flex-end;
            padding-bottom: 42px;
            font-size: 0.7rem;
            color: #e74c3c88;
            letter-spacing: 0.05em;
            user-select: none;
            transition: color 0.3s;
        }
        .alarm-indicator.active-alarm {
            color: #e74c3c;
            animation: alarmPulse 0.9s ease-in-out infinite;
        }
        @keyframes alarmPulse {
            0%,
            100% {
                opacity: 0.45;
            }
            50% {
                opacity: 1;
            }
        }
        .alarm-line {
            width: 20px;
            height: 2px;
            background: currentColor;
            border-radius: 1px;
            margin: 0 1px;
        }

        /* ── DP Array ── */
        .dp-section {
            background: #0d1528;
            border-radius: 10px;
            padding: 16px 14px;
            border: 1px solid var(--border);
        }
        .dp-section .dp-title {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }
        .dp-cells {
            display: flex;
            gap: 6px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .dp-cell {
            background: #1a2740;
            border: 2px solid #2a3550;
            border-radius: 8px;
            min-width: 60px;
            padding: 10px 6px;
            text-align: center;
            transition: all 0.35s ease;
            position: relative;
        }
        .dp-cell .dp-index {
            font-size: 0.65rem;
            color: #6a7590;
            display: block;
            letter-spacing: 0.03em;
        }
        .dp-cell .dp-value {
            font-size: 1.3rem;
            font-weight: 700;
            font-family: var(--font-mono);
            color: #c8d0e0;
            display: block;
            margin-top: 2px;
        }
        .dp-cell.highlight {
            border-color: var(--accent);
            background: #1f2d18;
            box-shadow: 0 0 16px rgba(240, 165, 0, 0.35);
            animation: cellPop 0.4s ease-out;
        }
        @keyframes cellPop {
            0% {
                transform: scale(1.08);
            }
            100% {
                transform: scale(1);
            }
        }
        .dp-cell.highlight .dp-value {
            color: var(--accent-glow);
        }
        .dp-cell.final-answer {
            border-color: var(--green);
            background: #132a1c;
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.4);
        }
        .dp-cell.final-answer .dp-value {
            color: var(--green);
        }
        .dp-cell.computed {
            border-color: #3a5070;
            background: #1c2a3d;
        }
        .dp-cell.computed .dp-value {
            color: #bcc8e0;
        }
        .dp-cell.empty {
            border-color: #1f2b3d;
            background: #111a28;
        }
        .dp-cell.empty .dp-value {
            color: #4a5568;
        }
        .dp-cell.base {
            border-color: #2a3a50;
            background: #141e2d;
            border-style: dashed;
        }
        .dp-cell.base .dp-value {
            color: #5a6a80;
        }

        /* ── Operation info ── */
        .operation-info {
            background: #0f1929;
            border-left: 4px solid var(--accent);
            border-radius: 0 8px 8px 0;
            padding: 10px 16px;
            font-size: 0.85rem;
            color: #d0d8e8;
            min-height: 36px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: border-color 0.3s;
        }
        .operation-info .op-badge {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 3px 10px;
            border-radius: 20px;
            background: #2a3550;
            color: #a0b0c8;
            white-space: nowrap;
        }
        .operation-info .op-desc {
            flex: 1;
        }

        /* ── Controls ── */
        #controls {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        #controls button {
            background: #253550;
            color: #d0d8e8;
            border: 1px solid #3a4a65;
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.02em;
            user-select: none;
            white-space: nowrap;
        }
        #controls button:hover {
            background: #304060;
            border-color: #5a7a9a;
            color: #fff;
        }
        #controls button:active {
            transform: scale(0.96);
            background: #1c2c40;
        }
        #controls button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            pointer-events: none;
        }
        #range {
            flex: 1;
            min-width: 100px;
            max-width: 300px;
            height: 8px;
            -webkit-appearance: none;
            appearance: none;
            background: #253550;
            border-radius: 4px;
            outline: none;
            cursor: pointer;
        }
        #range::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--accent);
            border: 2px solid #fff;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(240, 165, 0, 0.5);
        }
        #counter {
            font-family: var(--font-mono);
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
            min-width: 90px;
            text-align: center;
            white-space: nowrap;
        }

        /* ── Explanation ── */
        #explanation {
            background: #0f1929;
            border-radius: 10px;
            padding: 14px 18px;
            font-size: 0.88rem;
            color: #c8d4e4;
            border: 1px solid var(--border);
            min-height: 48px;
            line-height: 1.5;
            transition: all 0.3s;
        }
        #explanation .exp-what {
            font-weight: 600;
            color: #e8e8f0;
        }
        #explanation .exp-why {
            color: #8899b8;
            font-size: 0.8rem;
            margin-top: 2px;
            font-style: italic;
        }

        /* ── Result badge ── */
        .result-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #132a1c;
            border: 2px solid var(--green);
            border-radius: 10px;
            padding: 12px 20px;
            font-weight: 700;
            font-size: 1rem;
            color: var(--green);
            justify-content: center;
            letter-spacing: 0.02em;
        }
        .result-badge .result-icon {
            font-size: 1.3rem;
        }
        .result-badge .result-value {
            font-family: var(--font-mono);
            font-size: 1.6rem;
            color: #fff;
            background: #0d2a17;
            padding: 2px 14px;
            border-radius: 6px;
            letter-spacing: 0.04em;
        }
        .result-badge .verified-tag {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #6abf8a;
            border: 1px solid #3a7a50;
            border-radius: 4px;
            padding: 2px 8px;
        }

        /* ── Responsive ── */
        @media (max-width: 700px) {
            #app {
                padding: 16px 12px;
                gap: 14px;
            }
            .houses-row {
                gap: 4px;
            }
            .dp-cell {
                min-width: 44px;
                padding: 8px 4px;
            }
            .dp-cell .dp-value {
                font-size: 1rem;
            }
            #controls button {
                padding: 8px 14px;
                font-size: 0.8rem;
            }
            #range {
                max-width: 160px;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="app-header">
            <h1>House Robber &mdash; DP Array Visualizer</h1>
            <p class="subtitle">Maximize cash without triggering adjacent alarms</p>
        </div>

        <div id="stage">
            <div class="houses-row" id="housesRow" aria-label="Houses along the street with cash amounts">
            </div>
            <div class="dp-section">
                <div class="dp-title">DP Array (max cash considering first k houses)</div>
                <div class="dp-cells" id="dpCells" aria-label="Dynamic programming array cells">
                </div>
            </div>
            <div class="operation-info" id="operationInfo" aria-live="polite">
                <span class="op-badge" id="opBadge">init</span>
                <span class="op-desc" id="opDesc">Initializing&hellip;</span>
            </div>
        </div>

        <div id="controls">
            <button id="prev" title="Previous step">&larr; Prev</button>
            <input type="range" id="range" title="Step slider" min="0" max="0" value="0" step="1">
            <button id="next" title="Next step">Next &rarr;</button>
            <span id="counter">Step 0/0</span>
        </div>

        <div id="explanation" aria-live="polite">
            <span class="exp-what"></span>
            <span class="exp-why"></span>
        </div>

        <div class="result-badge" id="resultBadge" aria-label="Verified result">
            <span class="result-icon">&#9989;</span>
            <span>Verified Result:</span>
            <span class="result-value" id="resultValue">--</span>
            <span class="verified-tag">verified</span>
        </div>
    </div>

<script>
        (function() {
            /* ── Read injected artifact ── */
            const artifactEl = document.getElementById('algolab-artifact');
            let artifact;
            try {
                artifact = JSON.parse(artifactEl.textContent.trim());
            } catch (e) {
                console.error('Failed to parse algolab-artifact JSON:', e);
                document.getElementById('stage').innerHTML =
                    '<p style="color:#e74c3c;text-align:center;padding:40px;">Error: Could not read artifact data.</p>';
                return;
            }

            /* ── Extract core data ── */
            const frames = artifact.frames || [];
            const verifiedResult = artifact.result;
            const inputData = artifact.input_data || artifact.input || {};
            const nums = (inputData.nums && inputData.nums.length > 0) ?
                inputData.nums :
                (frames.length > 0 && frames[0].state && frames[0].state.nums ? frames[0].state.nums : []);
            const n = nums.length;

            /* ── If no frames, construct them from the algorithm (fallback) ── */
            let allFrames = frames;
            if (allFrames.length === 0 && n > 0) {
                /* Build frames programmatically as fallback; these are data-derived-visual-only */
                allFrames = buildFallbackFrames(nums, verifiedResult);
                console.log('Built fallback frames:', allFrames.length, 'steps');
            }

            const totalFrames = allFrames.length;
            let currentIndex = 0;

            /* ── DOM refs ── */
            const housesRow = document.getElementById('housesRow');
            const dpCells = document.getElementById('dpCells');
            const opBadge = document.getElementById('opBadge');
            const opDesc = document.getElementById('opDesc');
            const rangeInput = document.getElementById('range');
            const counterSpan = document.getElementById('counter');
            const prevBtn = document.getElementById('prev');
            const nextBtn = document.getElementById('next');
            const explanationEl = document.getElementById('explanation');
            const resultValueEl = document.getElementById('resultValue');
            const expWhat = explanationEl.querySelector('.exp-what');
            const expWhy = explanationEl.querySelector('.exp-why');

            /* ── Set verified result ── */
            resultValueEl.textContent = (verifiedResult !== undefined && verifiedResult !== null) ?
                String(verifiedResult) :
                '--';

            /* ── Set range max ── */
            rangeInput.max = Math.max(0, totalFrames - 1);
            rangeInput.value = 0;

            /* ── Build static house SVGs ── */
            const houseElements = [];
            housesRow.innerHTML = '';
            for (let i = 0; i < n; i++) {
                /* Alarm indicator between houses (not before the first) */
                if (i > 0) {
                    const alarmWrap = document.createElement('span');
                    alarmWrap.className = 'alarm-indicator';
                    alarmWrap.setAttribute('aria-hidden', 'true');
                    alarmWrap.innerHTML =
                        '<span class="alarm-line"></span><span style="font-size:0.65rem;margin:0 2px;">&#9888;</span><span class="alarm-line"></span>';
                    alarmWrap.setAttribute('data-derived-visual-only', 'true');
                    housesRow.appendChild(alarmWrap);
                }

                const wrapper = document.createElement('div');
                wrapper.className = 'house-wrapper pending';
                wrapper.setAttribute('data-house-index', i);

                const cash = nums[i];
                const svgNS = 'http://www.w3.org/2000/svg';
                const svg = document.createElementNS(svgNS, 'svg');
                svg.setAttribute('viewBox', '0 0 100 125');
                svg.setAttribute('width', '78');
                svg.setAttribute('height', '98');
                svg.classList.add('house-svg');

                /* Roof */
                const roof = document.createElementNS(svgNS, 'polygon');
                roof.setAttribute('points', '8,52 50,6 92,52');
                roof.setAttribute('fill', '#8b3a3a');
                roof.setAttribute('stroke', '#5a2020');
                roof.setAttribute('stroke-width', '2');
                roof.setAttribute('data-derived-visual-only', 'true');
                svg.appendChild(roof);

                /* Body */
                const body = document.createElementNS(svgNS, 'rect');
                body.setAttribute('x', '14');
                body.setAttribute('y', '52');
                body.setAttribute('width', '72');
                body.setAttribute('height', '58');
                body.setAttribute('fill', '#d4b896');
                body.setAttribute('stroke', '#8b6b4a');
                body.setAttribute('stroke-width', '2');
                body.setAttribute('rx', '3');
                body.setAttribute('data-derived-visual-only', 'true');
                svg.appendChild(body);

                /* Door */
                const door = document.createElementNS(svgNS, 'rect');
                door.setAttribute('x', '36');
                door.setAttribute('y', '78');
                door.setAttribute('width', '28');
                door.setAttribute('height', '32');
                door.setAttribute('fill', '#6b3a20');
                door.setAttribute('rx', '2');
                door.setAttribute('data-derived-visual-only', 'true');
                svg.appendChild(door);

                /* Window left */
                const winL = document.createElementNS(svgNS, 'rect');
                winL.setAttribute('x', '20');
                winL.setAttribute('y', '60');
                winL.setAttribute('width', '14');
                winL.setAttribute('height', '13');
                winL.setAttribute('fill', '#a8d8ea');
                winL.setAttribute('stroke', '#4a6a7a');
                winL.setAttribute('stroke-width', '1');
                winL.setAttribute('rx', '1');
                winL.setAttribute('data-derived-visual-only', 'true');
                svg.appendChild(winL);

                /* Window right */
                const winR = document.createElementNS(svgNS, 'rect');
                winR.setAttribute('x', '66');
                winR.setAttribute('y', '60');
                winR.setAttribute('width', '14');
                winR.setAttribute('height', '13');
                winR.setAttribute('fill', '#a8d8ea');
                winR.setAttribute('stroke', '#4a6a7a');
                winR.setAttribute('stroke-width', '1');
                winR.setAttribute('rx', '1');
                winR.setAttribute('data-derived-visual-only', 'true');
                svg.appendChild(winR);

                /* Cash badge circle */
                const badge = document.createElementNS(svgNS, 'circle');
                badge.setAttribute('cx', '50');
                badge.setAttribute('cy', '18');
                badge.setAttribute('r', '16');
                badge.setAttribute('fill', '#fff8e1');
                badge.setAttribute('stroke', '#c8960c');
                badge.setAttribute('stroke-width', '2.5');
                badge.setAttribute('data-derived-visual-only', 'true');
                svg.appendChild(badge);

                /* Cash text */
                const cashText = document.createElementNS(svgNS, 'text');
                cashText.setAttribute('x', '50');
                cashText.setAttribute('y', '23');
                cashText.setAttribute('text-anchor', 'middle');
                cashText.setAttribute('font-size', '14');
                cashText.setAttribute('font-weight', '700');
                cashText.setAttribute('fill', '#5c3d0a');
                cashText.setAttribute('font-family', 'var(--font-mono)');
                cashText.setAttribute('data-derived-visual-only', 'true');
                cashText.textContent = '$' + cash;
                svg.appendChild(cashText);

                wrapper.appendChild(svg);

                const label = document.createElement('span');
                label.className = 'house-label';
                label.textContent = 'House ' + i;
                wrapper.appendChild(label);

                housesRow.appendChild(wrapper);
                houseElements.push({
                    wrapper,
                    roof,
                    body,
                    badge,
                    cashText,
                    door,
                    winL,
                    winR,
                    alarmPredecessor: (i > 0) ? housesRow.querySelectorAll('.alarm-indicator')[i - 1] : null,
                    label,
                });
            }

            /* ── Build DP cells ── */
            const dpCellElements = [];
            dpCells.innerHTML = '';
            for (let i = 0; i <= n; i++) {
                const cell = document.createElement('div');
                cell.className = 'dp-cell empty';
                cell.setAttribute('data-dp-index', i);
                const idxSpan = document.createElement('span');
                idxSpan.className = 'dp-index';
                idxSpan.textContent = 'dp[' + i + ']';
                const valSpan = document.createElement('span');
                valSpan.className = 'dp-value';
                valSpan.textContent = '0';
                cell.appendChild(idxSpan);
                cell.appendChild(valSpan);
                dpCells.appendChild(cell);
                dpCellElements.push({ cell, valSpan, idxSpan });
            }
            /* dp[0] is base case */
            if (dpCellElements.length > 0) {
                dpCellElements[0].cell.classList.add('base');
                dpCellElements[0].cell.classList.remove('empty');
            }

            /* ── Derive robbed houses from a dp array (backtracking) ── */
            function deriveRobbedHouses(dpArr) {
                const robbed = new Set();
                if (!dpArr || dpArr.length < 2) return robbed;
                let i = dpArr.length - 1;
                const numsRef = nums;
                while (i >= 2) {
                    const skipVal = dpArr[i - 1];
                    const robVal = (dpArr[i - 2] || 0) + (numsRef[i - 1] || 0);
                    if (dpArr[i] === robVal && robVal > skipVal) {
                        robbed.add(i - 1);
                        i -= 2;
                    } else if (dpArr[i] === skipVal && i >= 2) {
                        i -= 1;
                    } else {
                        /* ambiguous or equal; prefer shorter path */
                        if (dpArr[i] === robVal) {
                            robbed.add(i - 1);
                            i -= 2;
                        } else {
                            i -= 1;
                        }
                    }
                }
                if (i === 1 && dpArr[1] > 0 && numsRef.length > 0) {
                    robbed.add(0);
                }
                return robbed;
            }

            /* ── Derive which house is being focused in "explain" frames ── */
            function deriveFocusHouse(frame) {
                const desc = (frame.description || '').toLowerCase();
                const match = desc.match(/house\s*(\d+)/i);
                if (match) return parseInt(match[1], 10);
                /* fallback: check evidence */
                if (frame.evidence && frame.evidence.reason) {
                    const m2 = frame.evidence.reason.match(/house\s*(\d+)/i);
                    if (m2) return parseInt(m2[1], 10);
                }
                return -1;
            }

            /* ── Render a single frame ── */
            let prevDp = null;
            function renderFrame(index) {
                if (index < 0 || index >= totalFrames) return;
                currentIndex = index;
                const frame = allFrames[index];
                const state = frame.state || {};
                const dpArr = state.dp || [];
                const numsArr = state.nums || nums;
                const hasAnswer = (state.answer !== undefined && state.answer !== null);
                const operation = frame.operation || 'step';
                const title = frame.title || '';
                const description = frame.description || '';
                const teaching = frame.teaching || {};
                const evidence = frame.evidence || {};

                /* Determine which DP cell changed */
                let changedDpIndex = -1;
                if (prevDp && dpArr.length === prevDp.length) {
                    for (let j = 0; j < dpArr.length; j++) {
                        if (dpArr[j] !== prevDp[j]) {
                            changedDpIndex = j;
                            break;
                        }
                    }
                } else if (prevDp === null && dpArr.length > 0) {
                    /* First render: detect which cells are non-zero beyond dp[0] */
                    for (let j = 1; j < dpArr.length; j++) {
                        if (dpArr[j] !== 0) {
                            changedDpIndex = j;
                            break;
                        }
                    }
                }

                /* Derive robbed houses */
                const robbedHouses = deriveRobbedHouses(dpArr);
                const focusHouse = (operation === 'explain') ? deriveFocusHouse(frame) : (
                    changedDpIndex >= 1 ? changedDpIndex - 1 : -1
                );

                /* Update house visuals */
                for (let i = 0; i < n; i++) {
                    const el = houseElements[i];
                    if (!el) continue;
                    const wrapper = el.wrapper;
                    /* Reset classes */
                    wrapper.classList.remove('processing', 'robbed', 'skipped', 'pending');
                    if (robbedHouses.has(i)) {
                        wrapper.classList.add('robbed');
                        el.body.setAttribute('fill', '#c8e6c9');
                        el.roof.setAttribute('fill', '#388e3c');
                        el.badge.setAttribute('fill', '#e8f5e9');
                        el.badge.setAttribute('stroke', '#2e7d32');
                        el.cashText.setAttribute('fill', '#1b5e20');
                    } else if (i === focusHouse && operation === 'explain') {
                        wrapper.classList.add('processing');
                        el.body.setAttribute('fill', '#fff3cd');
                        el.roof.setAttribute('fill', '#d4a017');
                        el.badge.setAttribute('fill', '#fffde7');
                        el.badge.setAttribute('stroke', '#f0a500');
                        el.cashText.setAttribute('fill', '#7a5500');
                    } else if (changedDpIndex >= 1 && i === changedDpIndex - 1 && operation !== 'explain') {
                        wrapper.classList.add('processing');
                        el.body.setAttribute('fill', '#fff3cd');
                        el.roof.setAttribute('fill', '#d4a017');
                        el.badge.setAttribute('fill', '#fffde7');
                        el.badge.setAttribute('stroke', '#f0a500');
                        el.cashText.setAttribute('fill', '#7a5500');
                    } else if (i < (changedDpIndex >= 1 ? changedDpIndex : 0) && dpArr.length > i + 1 && dpArr[i + 1] >
                        0) {
                        /* Already processed */
                        wrapper.classList.add('pending');
                        el.body.setAttribute('fill', '#d4b896');
                        el.roof.setAttribute('fill', '#8b3a3a');
                        el.badge.setAttribute('fill', '#fff8e1');
                        el.badge.setAttribute('stroke', '#c8960c');
                        el.cashText.setAttribute('fill', '#5c3d0a');
                    } else {
                        wrapper.classList.add('pending');
                        el.body.setAttribute('fill', '#d4b896');
                        el.roof.setAttribute('fill', '#8b3a3a');
                        el.badge.setAttribute('fill', '#fff8e1');
                        el.badge.setAttribute('stroke', '#c8960c');
                        el.cashText.setAttribute('fill', '#5c3d0a');
                    }
                    /* Update cash text in case nums changed */
                    if (numsArr[i] !== undefined) {
                        el.cashText.textContent = '$' + numsArr[i];
                    }
                }

                /* Update alarm indicators between robbed houses */
                const alarmIndicators = housesRow.querySelectorAll('.alarm-indicator');
                alarmIndicators.forEach((alarmEl, ai) => {
                    const leftHouse = ai;
                    const rightHouse = ai + 1;
                    alarmEl.classList.remove('active-alarm');
                    if (robbedHouses.has(leftHouse) && robbedHouses.has(rightHouse)) {
                        alarmEl.classList.add('active-alarm');
                    }
                });

                /* Update DP cells */
                for (let j = 0; j <= n; j++) {
                    const cellEl = dpCellElements[j];
                    if (!cellEl) continue;
                    const val = (dpArr[j] !== undefined) ? dpArr[j] : 0;
                    cellEl.valSpan.textContent = String(val);
                    /* Reset classes */
                    cellEl.cell.classList.remove('highlight', 'final-answer', 'computed', 'empty', 'base');
                    if (j === 0) {
                        cellEl.cell.classList.add('base');
                    } else if (j === changedDpIndex && hasAnswer && j === n) {
                        cellEl.cell.classList.add('final-answer');
                    } else if (j === changedDpIndex) {
                        cellEl.cell.classList.add('highlight');
                    } else if (val !== 0 || (dpArr[j] !== undefined && dpArr[j] === 0 && j <= (changedDpIndex >= 1 ?
                            changedDpIndex : 0))) {
                        cellEl.cell.classList.add('computed');
                    } else if (val === 0 && j > (changedDpIndex >= 1 ? changedDpIndex : 0)) {
                        cellEl.cell.classList.add('empty');
                    } else {
                        cellEl.cell.classList.add('computed');
                    }
                }
                /* Special: if answer is marked, highlight dp[n] */
                if (hasAnswer && n < dpCellElements.length) {
                    dpCellElements[n].cell.classList.add('final-answer');
                    dpCellElements[n].cell.classList.remove('highlight', 'computed', 'empty');
                }

                /* Update operation info */
                const opLabel = (operation === 'create') ? 'init' :
                    (operation === 'explain') ? 'think' :
                    (operation === 'mark') ? 'result' : 'compute';
                opBadge.textContent = opLabel;
                opDesc.textContent = description || title || 'Processing...';

                /* Update explanation */
                expWhat.textContent = teaching.what || description || '';
                expWhy.textContent = teaching.why || '';

                /* Update controls */
                counterSpan.textContent = 'Step ' + (index + 1) + ' / ' + totalFrames;
                rangeInput.value = index;
                prevBtn.disabled = (index <= 0);
                nextBtn.disabled = (index >= totalFrames - 1);

                /* Store prev DP for next comparison */
                prevDp = [...dpArr];
            }

            /* ── Control handlers ── */
            function goToFrame(index) {
                const clamped = Math.max(0, Math.min(totalFrames - 1, index));
                if (clamped !== currentIndex || prevDp === null) {
                    if (prevDp === null && clamped === currentIndex) {
                        /* Force initial render */
                        prevDp = null;
                    }
                    renderFrame(clamped);
                }
            }

            prevBtn.addEventListener('click', () => {
                if (currentIndex > 0) goToFrame(currentIndex - 1);
            });
            nextBtn.addEventListener('click', () => {
                if (currentIndex < totalFrames - 1) goToFrame(currentIndex + 1);
            });
            rangeInput.addEventListener('input', () => {
                goToFrame(parseInt(rangeInput.value, 10));
            });

            /* Keyboard navigation */
            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT' && e.target.type === 'range') return;
                if (e.key === 'ArrowLeft' || e.key === 'a') {
                    e.preventDefault();
                    if (currentIndex > 0) goToFrame(currentIndex - 1);
                } else if (e.key === 'ArrowRight' || e.key === 'd') {
                    e.preventDefault();
                    if (currentIndex < totalFrames - 1) goToFrame(currentIndex + 1);
                } else if (e.key === 'Home') {
                    e.preventDefault();
                    goToFrame(0);
                } else if (e.key === 'End') {
                    e.preventDefault();
                    goToFrame(totalFrames - 1);
                }
            });

            /* ── Initial render ── */
            if (totalFrames > 0) {
                prevDp = null;
                renderFrame(0);
            } else {
                counterSpan.textContent = 'No frames available';
                opDesc.textContent = 'Waiting for artifact data...';
                expWhat.textContent = '';
                expWhy.textContent = '';
            }

            /* ── Fallback frame builder (data-derived-visual-only) ── */
            function buildFallbackFrames(numsArr, resultVal) {
                const built = [];
                const m = numsArr.length;
                /* Frame 0: create nums */
                built.push({
                    step: 0,
                    title: 'Initialize nums',
                    operation: 'create',
                    description: 'Create array nums with house cash amounts',
                    code_line: 2,
                    state: { nums: [...numsArr] },
                    evidence: { targets: ['nums'], phase: 'initialization', reason: 'Create nums array',
                        visual_patterns: [] },
                    teaching: { what: 'Load the house cash amounts: [' + numsArr.join(', ') + ']',
                        why: 'These are the cash values for each house along the street.', hint: 'Observe the input data.' },
                    interaction: {},
                });
                /* Frame 1: create dp */
                const dpInit = new Array(m + 1).fill(0);
                built.push({
                    step: 1,
                    title: 'Initialize dp array',
                    operation: 'create',
                    description: 'Create dp array of size ' + (m + 1) + ' with zeros',
                    code_line: 6,
                    state: { nums: [...numsArr], dp: [...dpInit] },
                    evidence: { targets: ['dp'], phase: 'initialization', reason: 'Create dp array',
                    visual_patterns: [] },
                    teaching: { what: 'Create dp array of length n+1=' + (m + 1) + ' filled with 0.',
                        why: 'dp[k] will store the max cash from the first k houses.', hint: 'dp[0]=0 is the base case.' },
                    interaction: {},
                });

                /* Build DP computation frames */
                const dpRunning = [...dpInit];
                let stepCounter = 2;
                /* dp[1] = nums[0] */
                dpRunning[1] = numsArr[0];
                built.push({
                    step: stepCounter++,
                    title: 'Set dp[1]',
                    operation: 'compute',
                    description: 'dp[1] = nums[0] = ' + numsArr[0],
                    code_line: 8,
                    state: { nums: [...numsArr], dp: [...dpRunning] },
                    evidence: { targets: ['dp[1]'], phase: 'computation', reason: 'Base: rob first house',
                        visual_patterns: [] },
                    teaching: { what: 'dp[1] = nums[0] = ' + numsArr[0],
                        why: 'With only the first house available, the best choice is to rob it.',
                    hint: 'First house sets the initial value.' },
                    interaction: {},
                });

                /* For i from 2 to n */
                for (let i = 2; i <= m; i++) {
                    const skipVal = dpRunning[i - 1];
                    const robVal = dpRunning[i - 2] + numsArr[i - 1];
                    const best = Math.max(skipVal, robVal);

                    /* Explain frame */
                    const actionText = (robVal >= skipVal) ?
                        'Rob house ' + (i - 1) + ' (+$' + numsArr[i - 1] + '), skip previous' :
                        'Skip house ' + (i - 1) + ', keep previous best';
                    built.push({
                        step: stepCounter++,
                        title: 'Consider house ' + (i - 1),
                        operation: 'explain',
                        description: actionText,
                        code_line: 9,
                        state: { nums: [...numsArr], dp: [...dpRunning] },
                        evidence: { targets: [], phase: 'explanation', reason: actionText,
                        visual_patterns: [] },
                        teaching: {
                            what: 'Considering house ' + (i - 1) + ' with cash $' + numsArr[i - 1] +
                                '.',
                            why: 'Two options: skip it (take dp[' + (i - 1) + ']=' + skipVal +
                                ') or rob it (take dp[' + (i - 2) + ']+' + numsArr[i - 1] + '=' +
                                robVal + ').',
                            hint: 'Compare skip vs. rob.',
                        },
                        interaction: {},
                    });

                    /* Compute frame */
                    dpRunning[i] = best;
                    built.push({
                        step: stepCounter++,
                        title: 'Compute dp[' + i + ']',
                        operation: 'compute',
                        description: 'dp[' + i + '] = max(' + skipVal + ', ' + robVal + ') = ' + best,
                        code_line: 9,
                        state: { nums: [...numsArr], dp: [...dpRunning] },
                        evidence: { targets: ['dp[' + i + ']'], phase: 'computation',
                            reason: 'Update dp[' + i + ']', visual_patterns: [] },
                        teaching: {
                            what: 'dp[' + i + '] = max(' + skipVal + ', ' + robVal + ') = ' +
                                best,
                            why: (robVal >= skipVal ? 'Robbing house ' + (i - 1) +
                                ' yields more cash.' : 'Skipping house ' + (i - 1) +
                                ' is better.'),
                            hint: 'Best choice recorded.',
                        },
                        interaction: {},
                    });
                }

                /* Final mark frame */
                const finalAnswer = dpRunning[m];
                built.push({
                    step: stepCounter++,
                    title: 'Mark answer',
                    operation: 'mark',
                    description: 'Return final answer dp[' + m + '] = ' + finalAnswer,
                    code_line: 9,
                    state: { nums: [...numsArr], dp: [...dpRunning], answer: finalAnswer },
                    evidence: { targets: ['answer'], phase: 'result', reason: 'Return final answer',
                        value: finalAnswer, visual_patterns: [] },
                    teaching: {
                        what: 'Final answer: dp[' + m + '] = ' + finalAnswer,
                        why: 'After considering all ' + m +
                            ' houses, dp[' + m + '] holds the maximum possible cash.',
                        hint: 'Verified result: ' + (resultVal !== undefined ? resultVal : finalAnswer),
                    },
                    interaction: {},
                });

                return built;
            }

            console.log('House Robber Visualizer ready. Frames:', totalFrames, '| Verified result:', verifiedResult,
                '| Input:', nums);
        })();
    </script>
