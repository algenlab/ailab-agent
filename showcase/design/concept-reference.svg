<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2400" viewBox="0 0 1600 2400" role="img" aria-labelledby="title desc">
  <title id="title">AlgoTutorGen Contract Observatory approved concept extraction</title>
  <desc id="desc">Five-section dark editorial website concept with cyan contract paths, orange evidence marks, a purple teaching branch, a real artifact stage, and a publication-style closing section.</desc>
  <defs>
    <linearGradient id="cyanFade" x1="0" x2="1">
      <stop offset="0" stop-color="#34e8d3" stop-opacity="0.08"/>
      <stop offset="0.55" stop-color="#34e8d3" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7eeadf" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#dce9f4"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grain" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="2" r="0.55" fill="#d8ecff" opacity="0.055"/>
      <circle cx="6" cy="5" r="0.4" fill="#d8ecff" opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1600" height="2400" fill="#07101f"/>
  <rect width="1600" height="2400" fill="url(#grain)"/>

  <g font-family="Inter, Noto Sans SC, PingFang SC, sans-serif" fill="#f2f7fb">
    <g id="hero">
      <text x="76" y="76" font-size="22" font-weight="700" letter-spacing="1.2">ATG  AlgoTutorGen</text>
      <text x="1190" y="76" font-size="16" fill="#91a1b6">METHOD   RESULTS   ARTIFACTS   PAPER</text>
      <line x1="76" y1="104" x2="1524" y2="104" stroke="#9fb5ca" stroke-opacity="0.17"/>

      <text x="76" y="215" font-size="77" font-weight="760">从可执行语义到</text>
      <text x="76" y="302" font-size="77" font-weight="760">可验证的交互式算法导师</text>
      <text x="80" y="355" font-family="IBM Plex Mono, monospace" font-size="19" fill="#91a1b6">Contract-guided synthesis from executable specs to trustworthy browser artifacts.</text>
      <rect x="80" y="397" width="170" height="52" rx="5" fill="#34e8d3"/>
      <text x="165" y="430" font-size="16" font-weight="700" text-anchor="middle" fill="#07101f">查看实验结果</text>
      <rect x="266" y="397" width="170" height="52" rx="5" fill="none" stroke="#9fb5ca" stroke-opacity="0.4"/>
      <text x="351" y="430" font-size="16" font-weight="650" text-anchor="middle">打开真实产物</text>

      <path d="M900 188 C1030 92 1230 120 1386 250 C1460 312 1468 418 1382 463 C1268 523 1108 459 1058 361 C1014 274 1080 214 1195 207" fill="none" stroke="url(#cyanFade)" stroke-width="3"/>
      <g filter="url(#softGlow)" fill="#34e8d3">
        <circle cx="900" cy="188" r="7"/><circle cx="1085" cy="196" r="7"/><circle cx="1244" cy="224" r="7"/><circle cx="1392" cy="327" r="7"/>
      </g>
      <g font-family="IBM Plex Mono, monospace" font-size="15" fill="#aebed0">
        <text x="867" y="164">SPEC</text><text x="1018" y="170">SEMANTIC TRACE</text><text x="1200" y="198">SCENEGRAPH</text><text x="1361" y="300">RUNTIME</text>
      </g>
      <text x="1040" y="365" font-size="79" font-weight="760">198 / 200</text>
      <text x="1050" y="402" font-family="IBM Plex Mono, monospace" font-size="18" fill="#34e8d3">MACHINE OK · 99.0%</text>
      <line x1="80" y1="513" x2="1520" y2="513" stroke="#9fb5ca" stroke-opacity="0.18"/>
      <g font-family="IBM Plex Mono, monospace" font-size="17" fill="#91a1b6">
        <text x="82" y="550"><tspan fill="#f2f7fb" font-size="29">200</tspan>  TASKS</text>
        <text x="405" y="550"><tspan fill="#f2f7fb" font-size="29">23</tspan>  ALGORITHM FAMILIES</text>
        <text x="860" y="550"><tspan fill="#f2f7fb" font-size="29">646</tspan>  INPUTS</text>
      </g>
    </g>

    <g id="results" transform="translate(0 605)">
      <rect x="0" y="0" width="1600" height="520" fill="#0a1424"/>
      <text x="76" y="98" font-size="48" font-weight="740">同一浏览器合同下，谁真正完成了任务？</text>
      <text x="78" y="138" font-family="IBM Plex Mono, monospace" font-size="17" fill="#91a1b6">MACHINE OK = LOAD ∧ ANSWER ∧ INTERACTION ∧ FEEDBACK ∧ SUPPORT ∧ NONINTERFERENCE</text>
      <g font-family="IBM Plex Mono, monospace" font-size="16">
        <text x="78" y="206" fill="#34e8d3">MACHINE OK</text><text x="225" y="206" fill="#91a1b6">LOAD</text><text x="295" y="206" fill="#91a1b6">ANSWER</text><text x="385" y="206" fill="#91a1b6">INTERACTION</text>
      </g>
      <line x1="78" y1="220" x2="194" y2="220" stroke="#34e8d3" stroke-width="2"/>
      <g font-size="18" font-weight="650">
        <text x="78" y="272">AlgoTutorGen</text><text x="78" y="324">BrowserRepair</text><text x="78" y="376">Direct HTML</text><text x="78" y="428">WebGen-Agent</text><text x="78" y="480">HTMLCure strict</text>
      </g>
      <g stroke="#9fb5ca" stroke-opacity="0.18" stroke-width="14" stroke-linecap="round">
        <line x1="310" y1="266" x2="1330" y2="266"/><line x1="310" y1="318" x2="1330" y2="318"/><line x1="310" y1="370" x2="1330" y2="370"/><line x1="310" y1="422" x2="1330" y2="422"/><line x1="310" y1="474" x2="1330" y2="474"/>
      </g>
      <g fill="none" stroke-linecap="round" stroke-width="14">
        <line x1="310" y1="266" x2="1320" y2="266" stroke="#34e8d3"/>
        <line x1="310" y1="318" x2="851" y2="318" stroke="#ff9a62"/><line x1="310" y1="370" x2="810" y2="370" stroke="#ff9a62"/><line x1="310" y1="422" x2="540" y2="422" stroke="#ff9a62" opacity="0.72"/><line x1="310" y1="474" x2="514" y2="474" stroke="#ff9a62" opacity="0.55"/>
      </g>
      <g font-family="IBM Plex Mono, monospace" font-size="17" text-anchor="end">
        <text x="1518" y="272" fill="#34e8d3">198 / 200 · 99.0%</text><text x="1518" y="324">106 / 200 · 53.0%</text><text x="1518" y="376">98 / 200 · 49.0%</text><text x="1518" y="428">45 / 200 · 22.5%</text><text x="1518" y="480">40 / 200 · 20.0%</text>
      </g>
    </g>

    <g id="method" transform="translate(0 1170)">
      <text x="76" y="86" font-size="48" font-weight="740">可验证性不是一句承诺，而是一条可执行链</text>
      <g transform="translate(80 150)">
        <path d="M55 90 H1320" stroke="#34e8d3" stroke-width="2" fill="none"/>
        <path d="M270 212 H1020" stroke="#a78bfa" stroke-width="2" stroke-dasharray="8 8" fill="none"/>
        <path d="M1230 35 C1230 -22 260 -22 260 35" stroke="#ff9a62" stroke-width="2" fill="none"/>
        <g fill="#0b1728" stroke="#34e8d3" stroke-width="2">
          <rect x="0" y="45" width="170" height="90" rx="8"/><rect x="220" y="45" width="170" height="90" rx="8"/><rect x="440" y="45" width="170" height="90" rx="8"/><rect x="660" y="45" width="170" height="90" rx="8"/><rect x="880" y="45" width="170" height="90" rx="8"/><rect x="1100" y="45" width="220" height="90" rx="8"/>
        </g>
        <g font-family="IBM Plex Mono, monospace" font-size="15" text-anchor="middle">
          <text x="85" y="84">PROBLEM + INPUT</text><text x="305" y="84">EXECUTABLE SPEC</text><text x="525" y="84">SEMANTIC TRACE</text><text x="745" y="84">VALIDATION</text><text x="965" y="84">SCENEGRAPH</text><text x="1210" y="84">FIXED WEB RUNTIME</text>
        </g>
        <g fill="#07101f" stroke="#34e8d3" stroke-width="2" transform="rotate(45)">
          <rect x="224" y="-106" width="20" height="20"/><rect x="380" y="-262" width="20" height="20"/><rect x="535" y="-417" width="20" height="20"/><rect x="691" y="-573" width="20" height="20"/><rect x="846" y="-728" width="20" height="20"/>
        </g>
        <rect x="350" y="178" width="220" height="68" rx="7" fill="none" stroke="#a78bfa"/>
        <rect x="700" y="178" width="220" height="68" rx="7" fill="none" stroke="#a78bfa"/>
        <text x="460" y="218" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="15" fill="#c4b5fd">READ-ONLY FACTS</text>
        <text x="810" y="218" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="15" fill="#c4b5fd">TEACHING OVERLAY</text>
      </g>
      <line x1="80" y1="440" x2="1520" y2="440" stroke="#9fb5ca" stroke-opacity="0.18"/>
      <g transform="translate(80 480)">
        <text x="0" y="48" font-family="IBM Plex Mono, monospace" font-size="43" font-weight="700">55,108 / 55,108</text>
        <text x="0" y="80" font-size="17" fill="#91a1b6">cross-representation frames preserved</text>
        <line x1="455" y1="0" x2="455" y2="96" stroke="#9fb5ca" stroke-opacity="0.18"/>
        <text x="500" y="48" font-family="IBM Plex Mono, monospace" font-size="43" font-weight="700">2,198 / 2,198</text>
        <text x="500" y="80" font-size="17" fill="#91a1b6">defined semantic violations rejected</text>
        <line x1="905" y1="0" x2="905" y2="96" stroke="#9fb5ca" stroke-opacity="0.18"/>
        <text x="950" y="48" font-family="IBM Plex Mono, monospace" font-size="39" font-weight="700">1,561,298 actions</text>
        <text x="950" y="80" font-size="17" fill="#91a1b6">0 observed state-pollution counterexamples</text>
      </g>
    </g>

    <g id="artifacts" transform="translate(0 1785)">
      <rect width="1600" height="440" fill="#0a1424"/>
      <text x="76" y="86" font-size="48" font-weight="740">不是截图，是可以打开、播放、作答的 HTML</text>
      <rect x="76" y="132" width="1030" height="244" rx="12" fill="url(#screen)"/>
      <rect x="76" y="132" width="1030" height="28" rx="12" fill="#d2dfeb"/>
      <circle cx="98" cy="146" r="5" fill="#ff9a62"/><circle cx="116" cy="146" r="5" fill="#f7c55a"/><circle cx="134" cy="146" r="5" fill="#34e8d3"/>
      <g fill="none" stroke="#4371af" stroke-opacity="0.6">
        <rect x="102" y="184" width="180" height="160" rx="7"/><rect x="307" y="184" width="495" height="160" rx="7"/><rect x="827" y="184" width="250" height="160" rx="7"/>
        <line x1="350" y1="305" x2="755" y2="305"/><rect x="392" y="220" width="46" height="40" rx="5"/><rect x="448" y="220" width="46" height="40" rx="5"/><rect x="504" y="220" width="46" height="40" rx="5"/><rect x="560" y="220" width="46" height="40" rx="5"/><rect x="616" y="220" width="46" height="40" rx="5"/>
      </g>
      <text x="1160" y="168" font-family="IBM Plex Mono, monospace" font-size="15" fill="#34e8d3">01 / 04</text>
      <text x="1160" y="214" font-size="31" font-weight="720">二分查找</text>
      <text x="1160" y="248" font-family="IBM Plex Mono, monospace" font-size="15" fill="#91a1b6">SEARCH · 13 FRAMES</text>
      <text x="1160" y="292" font-family="IBM Plex Mono, monospace" font-size="15">MACHINE OK  <tspan fill="#34e8d3">PASS</tspan></text>
      <text x="1160" y="326" font-family="IBM Plex Mono, monospace" font-size="15">RUNTIME     SELF-CONTAINED</text>
      <rect x="1160" y="350" width="220" height="48" rx="5" fill="none" stroke="#ff9a62"/>
      <text x="1270" y="380" font-size="15" text-anchor="middle">打开真实产物 ↗</text>
      <g font-family="IBM Plex Mono, monospace" font-size="13" fill="#91a1b6">
        <text x="80" y="416" fill="#34e8d3">二分查找</text><text x="285" y="416">DIJKSTRA 最短路</text><text x="540" y="416">不同路径</text><text x="720" y="416">TRIE 前缀匹配</text>
      </g>
    </g>

    <g id="paper" transform="translate(0 2250)">
      <text x="76" y="54" font-size="31" font-weight="720">AlgoTutorGen: Contract-Guided Compositional Synthesis of Verifiable Interactive Algorithm Tutors</text>
      <text x="78" y="92" font-size="17" fill="#91a1b6">更多模型调用 · 长轨迹仍会膨胀 · 不声称真人学习效果</text>
      <line x1="76" y1="124" x2="1520" y2="124" stroke="#9fb5ca" stroke-opacity="0.18"/>
    </g>
  </g>
</svg>
