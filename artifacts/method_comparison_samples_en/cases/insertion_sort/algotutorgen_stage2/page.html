<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insertion Sort &mdash; Music Player Song Sorter</title>
    <style>
        :root {
            --bg: #fafafa;
            --card-bg: #ffffff;
            --text: #1a1a2e;
            --text-secondary: #555;
            --sorted-bg: #e8f5e9;
            --sorted-border: #4caf50;
            --sorted-text: #2e7d32;
            --unsorted-bg: #f5f5f5;
            --unsorted-border: #ddd;
            --unsorted-text: #777;
            --key-bg: #fff8e1;
            --key-border: #ff9800;
            --key-text: #e65100;
            --shift-bg: #e3f2fd;
            --shift-border: #2196f3;
            --shift-text: #0d47a1;
            --insert-target-bg: #fff3e0;
            --insert-target-border: #ff9800;
            --highlight-glow: #ffc107;
            --result-bg: #e8f5e9;
            --result-border: #2e7d32;
            --control-bg: #fff;
            --stage-bg: #fff;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 4px 20px rgba(0, 0, 0, 0.12);
            --radius: 12px;
            --radius-sm: 8px;
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --transition: 0.25s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font);
            background: linear-gradient(135deg, #f0f4f8 0%, #e8ecf1 50%, #f5f5f5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            color: var(--text);
        }

        #app {
            width: 100%;
            max-width: 820px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            padding: 10px;
        }

        /* Header */
        .header {
            background: var(--stage-bg);
            border-radius: var(--radius);
            padding: 18px 24px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.35rem;
            font-weight: 700;
            color: #1a1a2e;
        }
        .header-icon {
            font-size: 1.6rem;
        }
        .result-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--result-bg);
            border: 2px solid var(--result-border);
            border-radius: 24px;
            padding: 8px 16px;
            font-weight: 600;
            font-size: 0.95rem;
            color: #1b5e20;
            white-space: nowrap;
        }
        .result-badge .check {
            font-size: 1.2rem;
        }
        .result-badge .label {
            font-weight: 500;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #388e3c;
        }

        /* Stage */
        #stage {
            background: var(--stage-bg);
            border-radius: var(--radius);
            padding: 28px 20px 20px;
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            position: relative;
            min-height: 200px;
        }
        .stage-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #999;
            margin-bottom: -8px;
        }
        .card-row {
            display: flex;
            gap: 14px;
            align-items: flex-end;
            justify-content: center;
            flex-wrap: wrap;
            padding: 8px 0;
        }
        .card-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            position: relative;
            transition: transform var(--transition);
        }
        .card {
            width: 72px;
            min-height: 100px;
            border-radius: var(--radius-sm);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding: 10px 6px;
            cursor: default;
            transition: background var(--transition), border-color var(--transition), box-shadow var(--transition),
                transform var(--transition);
            border: 2.5px solid transparent;
            position: relative;
            box-shadow: var(--shadow);
        }
        .card .score-bar {
            width: 32px;
            border-radius: 6px 6px 2px 2px;
            transition: height var(--transition), background var(--transition);
            margin-bottom: 6px;
        }
        .card .score-value {
            font-weight: 700;
            font-size: 1.3rem;
            line-height: 1;
            transition: color var(--transition);
        }
        .card .track-label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-top: 2px;
            color: #999;
            transition: color var(--transition);
        }
        /* Card states */
        .card.sorted {
            background: var(--sorted-bg);
            border-color: var(--sorted-border);
        }
        .card.sorted .score-value {
            color: var(--sorted-text);
        }
        .card.sorted .score-bar {
            background: linear-gradient(180deg, #66bb6a 0%, #388e3c 100%);
        }
        .card.unsorted {
            background: var(--unsorted-bg);
            border-color: var(--unsorted-border);
        }
        .card.unsorted .score-value {
            color: var(--unsorted-text);
        }
        .card.unsorted .score-bar {
            background: linear-gradient(180deg, #ccc 0%, #999 100%);
        }
        .card.shifted {
            background: var(--shift-bg);
            border-color: var(--shift-border);
            animation: pulse-shift 0.6s ease;
        }
        .card.shifted .score-value {
            color: var(--shift-text);
        }
        .card.shifted .score-bar {
            background: linear-gradient(180deg, #64b5f6 0%, #1565c0 100%);
        }
        .card.insert-target {
            background: var(--insert-target-bg);
            border-color: var(--insert-target-border);
            border-style: dashed;
            animation: pulse-target 0.8s ease infinite;
        }
        .card.insert-target .score-value {
            color: var(--key-text);
        }
        .card.insert-target .score-bar {
            background: linear-gradient(180deg, #ffb74d 0%, #e65100 100%);
        }
        .card.key-highlight {
            box-shadow: 0 0 0 4px var(--highlight-glow), 0 4px 16px rgba(255, 152, 0, 0.35);
            z-index: 2;
            transform: translateY(-4px);
            border-color: var(--key-border) !important;
            background: #fffde7 !important;
        }
        .card.key-highlight .score-value {
            color: #e65100 !important;
            font-weight: 800;
        }
        .card.marked-glow {
            box-shadow: 0 0 0 5px rgba(255, 193, 7, 0.5), 0 6px 22px rgba(255, 152, 0, 0.4);
            z-index: 3;
            animation: glow-pulse 0.7s ease 2;
        }

        @keyframes pulse-shift {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.04);
            }
        }
        @keyframes pulse-target {
            0%,
            100% {
                border-opacity: 0.6;
            }
            50% {
                border-opacity: 1;
            }
        }
        @keyframes glow-pulse {
            0%,
            100% {
                box-shadow: 0 0 0 5px rgba(255, 193, 7, 0.5), 0 6px 22px rgba(255, 152, 0, 0.4);
            }
            50% {
                box-shadow: 0 0 0 12px rgba(255, 193, 7, 0.15), 0 8px 28px rgba(255, 152, 0, 0.55);
            }
        }

        /* Indicator badges */
        .indicator-row {
            display: flex;
            gap: 14px;
            justify-content: center;
            align-items: flex-start;
            min-height: 28px;
        }
        .indicator-slot {
            width: 72px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #888;
            position: relative;
        }
        .indicator-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.4px;
            text-transform: uppercase;
        }
        .badge-i {
            background: #fff3e0;
            color: #e65100;
            border: 1.5px solid #ff9800;
        }
        .badge-j {
            background: #e3f2fd;
            color: #0d47a1;
            border: 1.5px solid #2196f3;
        }
        .badge-insert {
            background: #fce4ec;
            color: #880e4f;
            border: 1.5px dashed #e91e63;
            font-style: italic;
        }

        /* Key display */
        .key-display {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #fffde7;
            border: 2px solid #ffc107;
            border-radius: 20px;
            padding: 8px 18px;
            font-weight: 700;
            font-size: 0.95rem;
            color: #e65100;
            box-shadow: 0 2px 6px rgba(255, 152, 0, 0.2);
            transition: all var(--transition);
        }
        .key-display .key-icon {
            font-size: 1.3rem;
        }
        .key-display .key-val {
            font-size: 1.4rem;
            font-weight: 800;
            min-width: 28px;
            text-align: center;
        }

        /* Pseudocode */
        .pseudocode {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 8px 0;
        }
        .pseudo-line {
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #888;
            background: #f9f9f9;
            border: 1.5px solid #e0e0e0;
            transition: all var(--transition);
            white-space: nowrap;
        }
        .pseudo-line.active {
            color: #1a1a2e;
            background: #fffde7;
            border-color: #ffc107;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(255, 152, 0, 0.18);
        }
        .pseudo-line.done {
            color: #2e7d32;
            background: #e8f5e9;
            border-color: #4caf50;
        }

        /* Explanation */
        #explanation {
            background: #fff;
            border-radius: var(--radius);
            padding: 16px 20px;
            box-shadow: var(--shadow);
            min-height: 50px;
            font-size: 0.9rem;
            line-height: 1.5;
            color: #444;
            border-left: 4px solid #ffc107;
            transition: all var(--transition);
        }
        #explanation .what {
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 4px;
        }
        #explanation .why {
            color: #666;
            font-style: italic;
        }
        #explanation .hint-label {
            display: inline-block;
            margin-top: 6px;
            padding: 3px 10px;
            background: #fff8e1;
            border-radius: 10px;
            font-size: 0.78rem;
            color: #e65100;
            font-weight: 500;
        }

        /* Controls */
        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #fff;
            border-radius: var(--radius);
            padding: 14px 20px;
            box-shadow: var(--shadow);
            flex-wrap: wrap;
            justify-content: center;
        }
        .controls button {
            padding: 10px 20px;
            border-radius: 24px;
            border: 2px solid #ddd;
            background: #fff;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all var(--transition);
            color: #444;
            font-family: var(--font);
            white-space: nowrap;
        }
        .controls button:hover {
            background: #f5f5f5;
            border-color: #bbb;
        }
        .controls button:active {
            transform: scale(0.96);
            background: #eee;
        }
        .controls button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }
        .controls button.primary {
            background: #ff9800;
            color: #fff;
            border-color: #ff9800;
            font-weight: 700;
        }
        .controls button.primary:hover {
            background: #f57c00;
            border-color: #f57c00;
        }
        #range {
            flex: 1;
            min-width: 120px;
            max-width: 300px;
            height: 6px;
            accent-color: #ff9800;
            cursor: pointer;
        }
        #counter {
            font-weight: 700;
            font-size: 0.9rem;
            color: #555;
            min-width: 70px;
            text-align: center;
            white-space: nowrap;
        }
        .phase-tag {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            padding: 4px 10px;
            border-radius: 12px;
            background: #f5f5f5;
            color: #777;
            font-weight: 600;
            white-space: nowrap;
        }
        .phase-tag.init {
            background: #e8eaf6;
            color: #283593;
        }
        .phase-tag.main {
            background: #fff3e0;
            color: #e65100;
        }
        .phase-tag.return {
            background: #e8f5e9;
            color: #1b5e20;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .card {
                width: 56px;
                min-height: 80px;
                padding: 8px 4px;
            }
            .card .score-bar {
                width: 24px;
            }
            .card .score-value {
                font-size: 1rem;
            }
            .card-row {
                gap: 8px;
            }
            .indicator-row {
                gap: 8px;
            }
            .indicator-slot {
                width: 56px;
            }
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            .pseudocode {
                gap: 8px;
            }
            .pseudo-line {
                font-size: 0.7rem;
                padding: 6px 10px;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Header -->
        <div class="header">
            <div class="header-title">
                <span class="header-icon">🎵</span>
                <span>Music Player &mdash; Song Sorter</span>
            </div>
            <div class="result-badge" id="result-badge" aria-label="Verified answer">
                <span class="check">✅</span>
                <span class="label">Verified Answer</span>
                <span id="result-value">—</span>
            </div>
        </div>

        <!-- Stage -->
        <div id="stage" aria-label="Sorting visualization stage">
            <span class="stage-label">Playlist (Scores)</span>
            <div class="key-display" id="key-display" aria-label="Current key value">
                <span class="key-icon">🔑</span>
                <span>Key:</span>
                <span class="key-val" id="key-val">—</span>
            </div>
            <div class="card-row" id="card-row" aria-label="Song score cards">
                <!-- Dynamically populated -->
            </div>
            <div class="indicator-row" id="indicator-row" aria-label="Index indicators">
                <!-- Dynamically populated -->
            </div>
            <!-- Pseudocode -->
            <div class="pseudocode" id="pseudocode" aria-label="Algorithm steps">
                <span class="pseudo-line" data-line="0">1. Start from second element (i=1)</span>
                <span class="pseudo-line" data-line="1">2. Store current as key</span>
                <span class="pseudo-line" data-line="2">3. Shift greater elements right</span>
                <span class="pseudo-line" data-line="3">4. Insert key at correct position</span>
            </div>
        </div>

        <!-- Explanation -->
        <div id="explanation" aria-live="polite" aria-label="Step explanation">
            <span class="what">Loading visualization...</span>
        </div>

        <!-- Controls -->
        <div class="controls" aria-label="Animation controls">
            <button id="prev" aria-label="Previous step">◀ Previous</button>
            <button id="auto-play" class="primary" aria-label="Auto-play animation">▶ Play</button>
            <input type="range" id="range" min="0" max="0" value="0" aria-label="Frame slider" title="Drag to navigate frames">
            <button id="next" aria-label="Next step">Next ▶</button>
            <span id="counter" aria-label="Frame counter">Step 0/0</span>
            <span class="phase-tag" id="phase-tag" aria-label="Current phase">—</span>
        </div>
    </div>

<script>
        (function() {
            // ──────────────────────────────────────
            // Read the injected artifact
            // ──────────────────────────────────────
            const artifactScript = document.getElementById('algolab-artifact');
            let artifact;
            try {
                artifact = JSON.parse(artifactScript.textContent);
            } catch (e) {
                console.error('Failed to parse algolab-artifact:', e);
                artifact = { frames: [], result: [], input_data: { nums: [] } };
            }

            const frames = artifact.frames || [];
            const verifiedResult = artifact.result || [];
            const inputData = artifact.input_data || artifact.input || { nums: [] };
            const totalFrames = frames.length;

            // ──────────────────────────────────────
            // DOM references
            // ──────────────────────────────────────
            const stageEl = document.getElementById('stage');
            const cardRowEl = document.getElementById('card-row');
            const indicatorRowEl = document.getElementById('indicator-row');
            const keyValEl = document.getElementById('key-val');
            const keyDisplayEl = document.getElementById('key-display');
            const explanationEl = document.getElementById('explanation');
            const counterEl = document.getElementById('counter');
            const rangeEl = document.getElementById('range');
            const prevBtn = document.getElementById('prev');
            const nextBtn = document.getElementById('next');
            const autoPlayBtn = document.getElementById('auto-play');
            const phaseTagEl = document.getElementById('phase-tag');
            const resultValueEl = document.getElementById('result-value');
            const pseudoLines = document.querySelectorAll('.pseudo-line');

            // ──────────────────────────────────────
            // State
            // ──────────────────────────────────────
            let currentIndex = 0;
            let autoPlayInterval = null;
            let isAutoPlaying = false;

            // ──────────────────────────────────────
            // Initialize
            // ──────────────────────────────────────
            function init() {
                if (totalFrames === 0) {
                    cardRowEl.innerHTML =
                        '<p style="color:#999;padding:20px;">No frames available. Please check the artifact data.</p>';
                    explanationEl.innerHTML = '<span class="what">No visualization data found.</span>';
                    return;
                }
                rangeEl.max = totalFrames - 1;
                rangeEl.value = 0;
                currentIndex = 0;
                // Display verified result
                if (verifiedResult && verifiedResult.length > 0) {
                    resultValueEl.textContent = '[' + verifiedResult.join(', ') + ']';
                } else {
                    resultValueEl.textContent = '—';
                }
                renderFrame(currentIndex);
                updateControls();
            }

            // ──────────────────────────────────────
            // Render a specific frame
            // ──────────────────────────────────────
            function renderFrame(index) {
                if (index < 0 || index >= totalFrames) return;
                currentIndex = index;
                const frame = frames[index];
                const state = frame.state || {};
                const nums = state.nums || [];
                const key = state.key !== undefined ? state.key : null;
                const i = state.i !== undefined ? state.i : -1;
                const j = state.j !== undefined ? state.j : -1;
                const answer = state.answer || null;
                const evidence = frame.evidence || {};
                const phase = evidence.phase || (frame.teaching && frame.teaching.phase) || '';
                const targets = evidence.targets || [];
                const operation = frame.operation || '';
                const teaching = frame.teaching || {};

                // Update key display
                if (key !== null && key !== undefined) {
                    keyValEl.textContent = key;
                    keyDisplayEl.style.opacity = '1';
                    keyDisplayEl.style.pointerEvents = 'auto';
                } else {
                    keyValEl.textContent = '—';
                    keyDisplayEl.style.opacity = '0.5';
                }

                // Determine card states
                // sorted region: indices < i that are stable (not currently being shifted into)
                // For simplicity: indices < i are "sorted" unless they are the insertion target
                const insertionTarget = (j >= -1) ? j + 1 : -1;

                // Build cards
                cardRowEl.innerHTML = '';
                indicatorRowEl.innerHTML = '';

                const maxScore = Math.max(...nums, 1);
                const barMaxHeight = 68;

                nums.forEach((score, idx) => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'card-wrapper';
                    wrapper.setAttribute('data-derived-visual-only', 'true');

                    const card = document.createElement('div');
                    card.className = 'card';

                    // Determine card state
                    let cardState = 'unsorted';
                    if (idx < i && phase !== 'Initialization') {
                        cardState = 'sorted';
                    }
                    // Check if this index is the insertion target
                    if (idx === insertionTarget && operation === 'insert' && phase === 'Main Loop') {
                        cardState = 'insert-target';
                    }
                    if (idx === insertionTarget && phase === 'Main Loop' && (operation === 'shift' || operation ===
                            'compare') && j >= -1) {
                        cardState = 'insert-target';
                    }
                    // Shifted elements
                    if (targets.includes('nums[' + idx + ']') && operation === 'shift') {
                        cardState = 'shifted';
                    }
                    // Key highlight on the element being processed
                    if (idx === i && phase === 'Main Loop' && operation === 'assign' && targets.includes('key')) {
                        cardState = 'key-highlight';
                    }
                    // Marked glow for inserted elements
                    if (targets.includes('nums[' + idx + ']') && operation === 'insert') {
                        card.classList.add('marked-glow');
                    }
                    // For the final answer mark
                    if (targets.includes('answer') && phase === 'Return Result') {
                        cardState = 'sorted';
                    }

                    card.classList.add(cardState);

                    // Score
