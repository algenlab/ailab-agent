<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convex Hull — Andrew's Monotone Chain</title>
    <style>
        :root {
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #1a1a2e;
            --muted: #555;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --border: #e2e8f0;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            --radius: 12px;
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --mono: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
            --point-color: #4A90D9;
            --point-stroke: #2c5f8a;
            --current-color: #f59e0b;
            --current-stroke: #b45309;
            --lower-color: #10b981;
            --lower-fill: rgba(16, 185, 129, 0.12);
            --upper-color: #f97316;
            --upper-fill: rgba(249, 115, 22, 0.12);
            --hull-color: #ef4444;
            --hull-fill: rgba(239, 68, 68, 0.15);
            --popped-color: #94a3b8;
            --grid-color: #e8ecf1;
            --axis-color: #cbd5e1;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        #app {
            width: 100%;
            max-width: 820px;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            padding: 24px 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        h1 {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: var(--text);
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        h1 .icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border-radius: 8px;
            background: #eef2ff;
            font-size: 1.2rem;
        }
        .stage-wrap {
            position: relative;
            background: #fafbfc;
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            aspect-ratio: 1 / 1;
            max-height: 520px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #stage {
            width: 100%;
            height: 100%;
            display: block;
        }
        .controls-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            font-family: var(--font);
            font-size: 0.9rem;
            font-weight: 600;
            padding: 8px 18px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #fff;
            color: var(--text);
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
            min-width: 72px;
            text-align: center;
        }
        button:hover {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }
        button:active {
            background: #e2e8f0;
            transform: scale(0.97);
        }
        button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
        #range {
            flex: 1;
            min-width: 120px;
            max-width: 300px;
            accent-color: var(--accent);
            height: 6px;
            cursor: pointer;
        }
        #counter {
            font-family: var(--mono);
            font-size: 0.85rem;
            color: var(--muted);
            min-width: 70px;
            text-align: center;
            font-weight: 500;
        }
        .info-panels {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .panel {
            flex: 1;
            min-width: 200px;
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 14px;
            font-size: 0.88rem;
            line-height: 1.5;
        }
        .panel h3 {
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--muted);
            margin-bottom: 6px;
            font-weight: 600;
        }
        #explanation {
            font-size: 0.88rem;
            line-height: 1.55;
            color: #334155;
            background: #fefce8;
            border: 1px solid #fde68a;
            border-radius: 8px;
            padding: 10px 14px;
            min-height: 44px;
        }
        .result-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 8px;
            padding: 8px 14px;
            font-family: var(--mono);
            font-size: 0.85rem;
            color: #991b1b;
            font-weight: 600;
        }
        .legend-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 0.78rem;
            color: var(--muted);
            align-items: center;
        }
        .legend-dot {
            display: inline-block;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            margin-right: 4px;
            vertical-align: middle;
            border: 1.5px solid rgba(0, 0, 0, 0.2);
        }
        @media (max-width: 600px) {
            #app {
                padding: 12px;
                gap: 10px;
            }
            .info-panels {
                flex-direction: column;
            }
            button {
                padding: 6px 12px;
                font-size: 0.8rem;
                min-width: 56px;
            }
        }
    </style>

    <div id="app">
        <h1>
            <span class="icon">📐</span> Convex Hull — Andrew's Monotone Chain
        </h1>

        <div class="stage-wrap">
            <svg id="stage" viewBox="-0.8 -0.8 3.6 3.6" xmlns="http://www.w3.org/2000/svg"

        </div>

        <div class="legend-row" aria-label="Color legend">
            <span><span class="legend-dot" style="background:#4A90D9;"></span> Delivery point</span>
            <span><span class="legend-dot" style="background:#f59e0b;"></span> Current point</span>
            <span><span class="legend-dot" style="background:#10b981; border-radius:2px;"></span> Lower hull</span>

            <span><span class="legend-dot" style="background:#ef4444; border-radius:2px;"></span> Final hull</span>

        <div class="controls-row">
            <button id="prev" aria-label="Previous step">◀ Prev</button>
            <input type="range" id="range" min="0" max="0" value="0" step="1"

            <button id="next" aria-label="Next step">Next ▶</button>
            <span id="counter" aria-live="polite">0 / 0</span>
        </div>

        <div class="info-panels">
            <div class="panel" id="phase-panel">
                <h3>Current Phase</h3>
                <span id="phase-text">Initializing…</span>
            </div>
            <div class="panel" id="result-panel">
                <h3>Verified Result</h3>
                <span class="result-badge" id="result-display">—</span>
            </div>
        </div>

        <div id="explanation" aria-live="polite" role="status">

<script>
        (function() {
            /* ---------- read injected artifact ---------- */
            const artifactEl = document.getElementById('algolab-artifact');
            if (!artifactEl) {
                document.getElementById('explanation').textContent =
                    'Error: Missing artifact data. The page requires the algolab-artifact script tag.';
                return;
            }
            let artifact;
            try {
                artifact = JSON.parse(artifactEl.textContent);
            } catch (e) {
                document.getElementById('explanation').textContent = 'Error: Could not parse artifact JSON.';
                return;
            }

            const frames = artifact.frames || [];
            const verifiedResult = artifact.result || [];
            const inputData = (artifact.input_data || artifact.input || {}).points || [];
            const totalFrames = frames.length;

            if (totalFrames === 0) {
                document.getElementById('explanation').textContent =
                'Error: No animation frames found in artifact.';
                return;
            }

            /* ---------- DOM refs ---------- */
            const stageSvg = document.getElementById('stage');
            const counterEl = document.getElementById('counter');
            const prevBtn = document.getElementById('prev');
            const nextBtn = document.getElementById('next');
            const rangeEl = document.getElementById('range');
            const explanationEl = document.getElementById('explanation');
            const phaseTextEl = document.getElementById('phase-text');
            const resultDisplayEl = document.getElementById('result-display');

            /* ---------- state ---------- */
            let currentFrameIndex = 0;
            // Accumulated state across frames
            let accumState = {
                delivery_points: inputData.length > 0 ? inputData : null,
                lower: null,
                upper: null,
                answer: null,
            };

            /* ---------- controls setup ---------- */
            rangeEl.min = 0;
            rangeEl.max = totalFrames - 1;
            rangeEl.value = 0;
            rangeEl.step = 1;
            counterEl.textContent = `0 / ${totalFrames - 1}`;

            function goToFrame(idx) {
                if (idx < 0) idx = 0;
                if (idx >= totalFrames) idx = totalFrames - 1;
                currentFrameIndex = idx;
                rangeEl.value = idx;
                counterEl.textContent = `${idx} / ${totalFrames - 1}`;
                renderFrame(idx);
            }

            prevBtn.addEventListener('click', () => goToFrame(currentFrameIndex - 1));
            nextBtn.addEventListener('click', () => goToFrame(currentFrameIndex + 1));
            rangeEl.addEventListener('input', () => {
                const v = parseInt(rangeEl.value, 10);
                if (!isNaN(v)) goToFrame(v);
            });

            /* ---------- coordinate helpers ---------- */
            // SVG viewBox: "-0.8 -0.8 3.6 3.6"
            // We flip y-axis so that mathematical y points upward.
            // The flipped <g> uses transform="translate(0, maxY) scale(1, -1)"
            // where maxY = 2 (the maximum y-coordinate in the data).
            const MAX_Y = 2;
            // compute SVG y for text (unflipped layer)
            function svgTextY(dataY) {
                return MAX_Y - dataY;
            }

            /* ---------- SVG layers (created once) ---------- */
            // Clear and rebuild layers
            function clearSvg() {
                while (stageSvg.firstChild) {
                    stageSvg.removeChild(stageSvg.firstChild);
                }
            }

            function ensureSvgLayers() {
                clearSvg();
                // Grid layer (flipped)
                const gridG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                gridG.setAttribute('id', 'layer-grid');
                gridG.setAttribute('transform', `translate(0, ${MAX_Y}) scale(1, -1)`);
                stageSvg.appendChild(gridG);

                // Hull fill layer (flipped)
                const fillG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                fillG.setAttribute('id', 'layer-fill');
                fillG.setAttribute('transform', `translate(0, ${MAX_Y}) scale(1, -1)`);
                stageSvg.appendChild(fillG);

                // Edge layer (flipped) — lower, upper, final edges
                const edgeG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                edgeG.setAttribute('id', 'layer-edges');
                edgeG.setAttribute('transform', `translate(0, ${MAX_Y}) scale(1, -1)`);
                stageSvg.appendChild(edgeG);

                // Point layer (flipped)
                const pointG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                pointG.setAttribute('id', 'layer-points');
                pointG.setAttribute('transform', `translate(0, ${MAX_Y}) scale(1, -1)`);
                stageSvg.appendChild(pointG);

                // Text layer (NOT flipped — coordinates manually computed)
                const textG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                textG.setAttribute('id', 'layer-text');
                stageSvg.appendChild(textG);
            }
            ensureSvgLayers();

            function getLayer(id) {
                return stageSvg.querySelector('#' + id);
            }

            /* ---------- draw grid ---------- */
            function drawGrid() {
                const gridG = getLayer('layer-grid');
                if (!gridG) return;
                while (gridG.firstChild) gridG.removeChild(gridG.firstChild);

                const gridColor = '#e8ecf1';
                const axisColor = '#cbd5e1';
                for (let i = -1; i <= 3; i += 0.5) {
                    const isAxis = (Math.abs(i) < 0.001);
                    const color = isAxis ? axisColor : gridColor;
                    const sw = isAxis ? 0.025 : 0.012;
                    // vertical
                    const vLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    vLine.setAttribute('x1', i);
                    vLine.setAttribute('y1', -1);
                    vLine.setAttribute('x2', i);
                    vLine.setAttribute('y2', 3);
                    vLine.setAttribute('stroke', color);
                    vLine.setAttribute('stroke-width', sw);
                    gridG.appendChild(vLine);
                    // horizontal
                    const hLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    hLine.setAttribute('x1', -1);
                    hLine.setAttribute('y1', i);
                    hLine.setAttribute('x2', 3);
                    hLine.setAttribute('y2', i);
                    hLine.setAttribute('stroke', color);
                    hLine.setAttribute('stroke-width', sw);
                    gridG.appendChild(hLine);
                }
            }

            /* ---------- draw points ---------- */
            function drawPoints(points, currentPointIdx, poppedSet) {
                const pointG = getLayer('layer-points');
                const textG = getLayer('layer-text');
                if (!pointG || !textG) return;
                while (pointG.firstChild) pointG.removeChild(pointG.firstChild);
                // Clear only the text children that we manage (keep any static ones)
                const toRemove = [];
                for (const child of textG.children) {
                    if (child.getAttribute('data-derived-visual-only') === 'true') {
                        toRemove.push(child);
                    }
                }
                toRemove.forEach(c => textG.removeChild(c));

                if (!points || points.length === 0) return;

                points.forEach((pt, i) => {
                    const [px, py] = pt;
                    const isPopped = poppedSet && poppedSet.has(i);
                    const isCurrent = (i === currentPointIdx);

                    // Circle
                    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    circle.setAttribute('cx', px);
                    circle.setAttribute('cy', py);
                    circle.setAttribute('r', isCurrent ? 0.12 : 0.08);
                    circle.setAttribute('data-derived-visual-only', 'true');

                    if (isPopped) {
                        circle.setAttribute('fill', '#94a3b8');
                        circle.setAttribute('stroke', '#64748b');
                        circle.setAttribute('stroke-width', '0.03');
                        circle.setAttribute('opacity', '0.7');
                    } else if (isCurrent) {
                        circle.setAttribute('fill', '#f59e0b');
                        circle.setAttribute('stroke', '#b45309');
                        circle.setAttribute('stroke-width', '0.04');
                        circle.setAttribute('opacity', '1');
                        // glow ring
                        const glow = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                        glow.setAttribute('cx', px);
                        glow.setAttribute('cy', py);
                        glow.setAttribute('r', '0.18');
                        glow.setAttribute('fill', 'none');
                        glow.setAttribute('stroke', '#fbbf24');
                        glow.setAttribute('stroke-width', '0.05');
                        glow.setAttribute('opacity', '0.5');
                        glow.setAttribute('data-derived-visual-only', 'true');
                        pointG.appendChild(glow);
                    } else {
                        circle.setAttribute('fill', '#4A90D9');
                        circle.setAttribute('stroke', '#2c5f8a');
                        circle.setAttribute('stroke-width', '0.03');
                        circle.setAttribute('opacity', '0.9');
                    }
                    circle.setAttribute('data-derived-visual-only', 'true');
                    pointG.appendChild(circle);

                    // Label
                    const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    label.setAttribute('x', px + 0.15);
                    label.setAttribute('y', svgTextY(py) - 0.2);
                    label.setAttribute('font-size', '0.16');
                    label.setAttribute('fill', '#334155');
                    label.setAttribute('font-family', 'var(--mono), monospace');
                    label.setAttribute('data-derived-visual-only', 'true');
                    label.textContent = `(${px},${py})`;
                    textG.appendChild(label);
                });
            }

            /* ---------- draw hull edges ---------- */
            function drawPolyline(points, color, strokeWidth, dashArray, layerId) {
                const layer = getLayer(layerId);
                if (!layer || !points || points.length < 2) return;
                const polyline = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
                const ptsStr = points.map(p => `${p[0]},${p[1]}`).join(' ');
                polyline.setAttribute('points', ptsStr);
                polyline.setAttribute('fill', 'none');
                polyline.setAttribute('stroke', color);
                polyline.setAttribute('stroke-width', strokeWidth);
                polyline.setAttribute('stroke-linecap', 'round');
                polyline.setAttribute('stroke-linejoin', 'round');
                if (dashArray) {
                    polyline.setAttribute('stroke-dasharray', dashArray);
                }
                polyline.setAttribute('data-derived-visual-only', 'true');
                layer.appendChild(polyline);
            }

            function drawPolygon(points, fillColor, strokeColor, strokeWidth, layerId) {
                const layer = getLayer(layerId);
                if (!layer || !points || points.length < 3) return;
                const polygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                const ptsStr = points.map(p => `${p[0]},${p[1]}`).join(' ');
                polygon.setAttribute('points', ptsStr);
                polygon.setAttribute('fill', fillColor);
                polygon.setAttribute('stroke', strokeColor);
                polygon.setAttribute('stroke-width', strokeWidth);
                polygon.setAttribute('stroke-linejoin', 'round');
                polygon.setAttribute('data-derived-visual-only', 'true');
                layer.appendChild(polygon);
            }

            function clearLayer(layerId) {
                const layer = getLayer(layerId);
                if (!layer) return;
                while (layer.firstChild) layer.removeChild(layer.firstChild);
            }

            /* ---------- determine current point index (heuristic) ---------- */
            function inferCurrentPointIndex(frameState, phase) {
                // data-derived-visual-only heuristic
                const pts = frameState.delivery_points || accumState.delivery_points || [];
                if (pts.length === 0) return -1;
                const lower = frameState.lower || accumState.lower;
                const upper = frameState.upper || accumState.upper;

                if (phase && phase.toLowerCase().includes('lower hull') && lower && lower.length > 0) {
                    // processing from left to right
                    const lastLower = lower[lower.length - 1];
                    const lastIdx = pts.findIndex(p => p[0] === lastLower[0] && p[1] === lastLower[1]);
                    if (lastIdx >= 0 && lastIdx + 1 < pts.length) return lastIdx + 1;
                    if (lower.length < pts.length) return lower.length;
                }
                if (phase && phase.toLowerCase().includes('upper hull') && upper && upper.length > 0) {
                    // processing from right to left
                    const lastUpper = upper[upper.length - 1];
                    const lastIdx = pts.findIndex(p => p[0] === lastUpper[0] && p[1] === lastUpper[1]);
                    if (lastIdx >= 1) return lastIdx - 1;
                    if (upper.length < pts.length) return pts.length - 1 - upper.length;
                }
                return -1;
            }

            function inferPoppedSet(frameState, phase, framesUpToCurrent) {
                // data-derived-visual-only: track points popped from hulls
                const popped = new Set();
                const pts = frameState.delivery_points || accumState.delivery_points || [];
                if (pts.length === 0) return popped;
                const lower = frameState.lower || accumState.lower;
                const upper = frameState.upper || accumState.upper;

                // Points that are in the original set but not in either hull (and not in answer)
                if (lower && upper && lower.length > 0 && upper.length > 0) {
                    const hullPoints = new Set();
                    [...lower, ...upper].forEach(p => hullPoints.add(p[0] + ',' + p[1]));
                    pts.forEach((pt, i) => {
                        if (!hullPoints.has(pt[0] + ',' + pt[1])) {
                            // Check if this point was ever in a hull and then removed
                            // Simple heuristic: if it's not in current lower/upper but is between hull extremes
                            const xVals = [...lower, ...upper].map(p => p[0]);
                            const minX = Math.min(...xVals);
                            const maxX = Math.max(...xVals);
                            if (pt[0] > minX && pt[0] < maxX) {
                                popped.add(i);
                            }
                        }
                    });
                    // Also check the specific known internal point
                    const internalIdx = pts.findIndex(p => p[0] === 1 && p[1] === 1);
                    if (internalIdx >= 0 && lower.length + upper.length <= pts.length + 1) {
                        const allHullPts = [...lower, ...upper];
                        const isOnHull = allHullPts.some(p => p[0] === 1 && p[1] === 1);
                        if (!isOnHull) popped.add(internalIdx);
                    }
                }
                return popped;
            }

            /* ---------- main render ---------- */
            function renderFrame(index) {
                if (index < 0 || index >= totalFrames) return;
                const frame = frames[index];
                if (!frame) return;

                const frameState = frame.state || {};

                // Update accumulated state
                if (frameState.delivery_points !== undefined) accumState.delivery_points = frameState
                    .delivery_points;
                if (frameState.lower !== undefined) accumState.lower = frameState.lower;
                if (frameState.upper !== undefined) accumState.upper = frameState.upper;
                if (frameState.answer !== undefined) accumState.answer = frameState.answer;

                const allPoints = accumState.delivery_points || [];
                const lowerHull = accumState.lower;
                const upperHull = accumState.upper;
                const answerHull = accumState.answer;
                const phase = (frame.evidence && frame.evidence.phase) || '';
                const teaching = frame.teaching || {};

                // Determine current point (heuristic, data-derived-visual-only)
                const currentPtIdx = inferCurrentPointIndex(frameState, phase);
                const poppedSet = inferPoppedSet(frameState, phase, frames.slice(0, index + 1));

                // Clear dynamic layers
                clearLayer('layer-fill');
                clearLayer('layer-edges');

                // Draw final hull fill (if answer is available)
                if (answerHull && answerHull.length >= 3) {
                    drawPolygon(answerHull, 'rgba(239,68,68,0.15)', '#ef4444', 0.04, 'layer-fill');
                }

                // Draw lower hull edges
                if (lowerHull && lowerHull.length >= 2) {
                    drawPolyline(lowerHull, '#10b981', 0.05, null, 'layer-edges');
                }

                // Draw upper hull edges
                if (upperHull && upperHull.length >= 2) {
                    drawPolyline(upperHull, '#f97316', 0.05, '8,4', 'layer-edges');
                }

                // Draw final hull outline (on top) if answer exists
                if (answerHull && answerHull.length >= 2) {
                    // Close the polygon visually
                    const closed = [...answerHull, answerHull[0]];
                    drawPolyline(closed, '#ef4444', 0.06, null, 'layer-edges');
                }

                // Redraw grid (in case it was cleared)
                drawGrid();

                // Draw points
                drawPoints(allPoints, currentPtIdx, poppedSet);

                // Update explanation
                let explText = '';
                if (teaching.what) explText += teaching.what + ' ';
                if (teaching.why) explText += teaching.why;
                if (!explText.trim()) explText = frame.description || `Step ${frame.step}`;
                explanationEl.textContent = explText.trim();

                // Update phase display
                phaseTextEl.textContent = phase || (frame.evidence && frame.evidence.phase) || 'Processing';

                // Update result display
                if (answerHull) {
                    const resStr = JSON.stringify(answerHull);
                    resultDisplayEl.textContent = resStr;
                } else if (verifiedResult.length > 0) {
                    resultDisplayEl.textContent = JSON.stringify(verifiedResult);
                } else {
                    resultDisplayEl.textContent = '—';
                }
            }

            /* ---------- initialize ---------- */
            function init() {
                // Ensure result display shows verified result initially
                if (verifiedResult.length > 0) {
                    resultDisplayEl.textContent = JSON.stringify(verifiedResult);
                }
                drawGrid();
                // Render first frame
                goToFrame(0);
            }

            init();

            /* ---------- keyboard navigation ---------- */
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    goToFrame(currentFrameIndex - 1);
                } else if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    goToFrame(currentFrameIndex + 1);
                } else if (e.key === 'Home') {
                    e.preventDefault();
                    goToFrame(0);
                } else if (e.key === 'End') {
                    e.preventDefault();
                    goToFrame(totalFrames - 1);
                }
            });

        })();
    </script>
