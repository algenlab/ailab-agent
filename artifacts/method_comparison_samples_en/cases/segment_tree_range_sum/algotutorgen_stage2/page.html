<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segment Tree &ndash; Parcel Weight Query &amp; Update</title>
    <style>
        :root {
            --bg: #f7f8fa;
            --card-bg: #ffffff;
            --text: #1a1a2e;
            --text-secondary: #4a4a6a;
            --border: #e0e4ea;
            --accent: #2563eb;
            --accent-light: #dbeafe;
            --green: #16a34a;
            --green-light: #dcfce7;
            --green-border: #22c55e;
            --amber: #ea580c;
            --amber-light: #fff7ed;
            --amber-border: #f97316;
            --red-bg: #fef2f2;
            --red-text: #b91c1c;
            --shadow: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-lg: 0 4px 16px rgba(0, 0, 0, 0.08), 0 2px 6px rgba(0, 0, 0, 0.04);
            --radius: 10px;
            --radius-sm: 6px;
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --mono: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px 12px 40px;
        }

        #app {
            width: 100%;
            max-width: 880px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        /* Header */
        .header {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 22px;
            box-shadow: var(--shadow);
        }
        .header h1 {
            font-size: 1.35rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 6px;
            letter-spacing: -0.01em;
        }
        .header .subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        .header .input-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }
        .header .input-tag {
            background: #f1f5f9;
            border: 1px solid #dde4ed;
            border-radius: 20px;
            padding: 4px 14px;
            font-size: 0.85rem;
            font-family: var(--mono);
            color: #334155;
            white-space: nowrap;
        }
        .header .input-tag strong {
            color: #0f172a;
            margin-right: 2px;
        }

        /* Stage */
        #stage {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 12px 12px;
            box-shadow: var(--shadow-lg);
            overflow-x: auto;
            position: relative;
        }
        #stage svg {
            display: block;
            width: 100%;
            height: auto;
            min-height: 370px;
        }

        /* Array row */
        .array-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 6px;
            padding: 8px 0;
        }
        .array-row .array-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #64748b;
            margin-right: 4px;
            letter-spacing: 0.02em;
        }
        .array-cell {
            width: 52px;
            height: 40px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--mono);
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 2px solid #e2e8f0;
            background: #f8fafc;
            color: #334155;
            position: relative;
        }
        .array-cell.query-range {
            border-color: var(--green-border);
            background: var(--green-light);
            color: #15803d;
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.12);
        }
        .array-cell.update-pos {
            border-color: var(--amber-border);
            background: var(--amber-light);
            color: #c2410c;
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.15);
            animation: pulse-amber 0.8s ease-in-out 2;
        }
        .array-cell .cell-index {
            position: absolute;
            top: -18px;
            font-size: 0.7rem;
            color: #94a3b8;
            font-weight: 500;
        }
        @keyframes pulse-amber {
            0%,
            100% {
                box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.15);
            }
            50% {
                box-shadow: 0 0 0 8px rgba(249, 115, 22, 0.04);
            }
        }

        /* Result panel */
        .result-panel {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 22px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 24px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .result-panel .result-item {
            text-align: center;
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            background: #f8fafc;
            border: 1px solid #e8ecf1;
            min-width: 110px;
        }
        .result-panel .result-item .result-label {
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #64748b;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .result-panel .result-item .result-value {
            font-size: 1.6rem;
            font-weight: 700;
            font-family: var(--mono);
            color: #0f172a;
        }
        .result-panel .result-item.before-highlight .result-value {
            color: #2563eb;
        }
        .result-panel .result-item.after-highlight .result-value {
            color: #16a34a;
        }
        .result-badge {
            display: inline-block;
            background: #dbeafe;
            color: #1d4ed8;
            font-size: 0.72rem;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 12px;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        /* Controls */
        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px 18px;
            box-shadow: var(--shadow);
        }
        .controls button {
            padding: 9px 18px;
            border: 1px solid #d0d5dd;
            border-radius: 20px;
            background: #fff;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            color: #374151;
            transition: all 0.2s ease;
            white-space: nowrap;
            letter-spacing: 0.01em;
        }
        .controls button:hover {
            background: #f1f5f9;
            border-color: #b0b8c4;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
        }
        .controls button:active {
            background: #e2e8f0;
            transform: scale(0.97);
        }
        .controls button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            pointer-events: none;
        }
        .controls input[type=range] {
            flex: 1;
            min-width: 120px;
            max-width: 280px;
            height: 6px;
            accent-color: var(--accent);
            cursor: pointer;
        }
        #counter {
            font-weight: 600;
            font-size: 0.9rem;
            color: #475569;
            min-width: 90px;
            text-align: center;
            font-family: var(--mono);
            letter-spacing: 0.02em;
        }
        .step-title-badge {
            background: #eff6ff;
            color: #1e40af;
            padding: 4px 12px;
            border-radius: 14px;
            font-size: 0.8rem;
            font-weight: 600;
            white-space: nowrap;
        }

        /* Explanation */
        #explanation {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 22px;
            box-shadow: var(--shadow);
            min-height: 60px;
        }
        #explanation .exp-what {
            font-weight: 700;
            font-size: 1rem;
            color: #1e293b;
            margin-bottom: 4px;
        }
        #explanation .exp-why {
            font-size: 0.88rem;
            color: #475569;
            margin-bottom: 4px;
        }
        #explanation .exp-hint {
            font-size: 0.82rem;
            color: #6b7280;
            font-style: italic;
            background: #fefce8;
            padding: 8px 12px;
            border-radius: 6px;
            border-left: 3px solid #eab308;
            margin-top: 8px;
        }
        #explanation .exp-formula {
            font-family: var(--mono);
            font-size: 0.82rem;
            background: #f1f5f9;
            padding: 6px 10px;
            border-radius: 4px;
            color: #334155;
            margin-top: 4px;
            display: inline-block;
        }

        /* SVG node styles */
        .tree-node-rect {
            transition: all 0.35s ease;
            cursor: default;
        }
        .tree-node-text {
            font-family: var(--mono);
            font-size: 12px;
            fill: #1e293b;
            text-anchor: middle;
            pointer-events: none;
            transition: fill 0.3s ease;
        }
        .tree-node-text.sum-text {
            font-size: 11px;
            fill: #64748b;
        }
        .tree-edge {
            stroke: #cbd5e1;
            stroke-width: 2;
            fill: none;
            transition: all 0.35s ease;
        }
        .tree-edge.highlight-cover {
            stroke: #22c55e;
            stroke-width: 2.8;
            stroke-dasharray: none;
            filter: drop-shadow(0 0 3px rgba(34, 197, 94, 0.35));
        }
        .tree-edge.highlight-update {
            stroke: #f97316;
            stroke-width: 2.8;
            filter: drop-shadow(0 0 3px rgba(249, 115, 22, 0.35));
        }
        .tree-edge.highlight-query-path {
            stroke: #94a3b8;
            stroke-width: 2;
            stroke-dasharray: 5 3;
        }
        .legend-row {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 8px;
            font-size: 0.75rem;
            color: #64748b;
        }
        .legend-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 4px;
            vertical-align: middle;
        }
        .legend-dot.cover {
            background: #22c55e;
        }
        .legend-dot.update {
            background: #f97316;
        }
        .legend-dot.query-visit {
            background: #94a3b8;
        }
    </style>
</head>

            <p class="subtitle">Logistics center &mdash; query total weight over a time interval, apply a correction, then re-query.</p>
            <div class="input-tags" id="input-tags">
                <span class="input-tag"><strong>nums</strong> = [2, 1, 4, 5]</span>
                <span class="input-tag"><strong>query</strong> = [1, 3]</span>
                <span class="input-tag"><strong>update</strong> = [2, 6]</span>

        </div>

        <!-- Stage: SVG tree + array -->
        <div id="stage">
            <svg id="tree-svg" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid meet"></svg>
            <div class="array-row" id="array-row"></div>
            <div class="legend-row" id="legend-row"></div>
        </div>

        <!-- Result panel -->
        <div class="result-panel" id="result-panel">
            <div class="result-item before-highlight">
                <div class="result-label">Before correction</div>
                <div class="result-value" id="result-before">10</div>
            </div>
            <span class="result-badge">Verified</span>
            <div class="result-item after-highlight">
                <div class="result-label">After correction</div>
                <div class="result-value" id="result-after">12</div>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button id="prev" aria-label="Previous step">&#9664; Prev</button>
            <input type="range" id="range" min="0" max="3" value="0" step="1" aria-label="Step slider">
            <button id="next" aria-label="Next step">Next &#9654;</button>
            <span id="counter">Step 1 / 4</span>
            <span class="step-title-badge" id="step-title">Build Tree</span>

        <!-- Explanation -->
        <div id="explanation">

            <div class="exp-why" id="exp-why"></div>
            <div class="exp-formula" id="exp-formula"></div>
            <div class="exp-hint" id="exp-hint"></div>
        </div>
    </div>

<script>
        (function() {
            // ──────────────────────────────────────
            // Read artifact
            // ──────────────────────────────────────
            const artifactScript = document.getElementById('algolab-artifact');
            if (!artifactScript) {
                document.getElementById('explanation').innerHTML =
                    '<p style="color:#b91c1c;">Error: Artifact data not found. The page requires the algolab-artifact script tag.</p>';
                return;
            }
            let artifact;
            try {
                artifact = JSON.parse(artifactScript.textContent);
            } catch (e) {
                document.getElementById('explanation').innerHTML =
                    '<p style="color:#b91c1c;">Error: Failed to parse artifact JSON. ' + e.message + '</p>';
                return;
            }

            const frames = artifact.frames || [];
            const verifiedResult = artifact.result || { before: 10, after: 12 };
            const inputData = artifact.input_data || artifact.input || { nums: [2, 1, 4, 5], query: [1, 3],
            update: [2, 6] };

            if (frames.length === 0) {
                document.getElementById('explanation').innerHTML =
                    '<p style="color:#b91c1c;">Error: No frames found in artifact.</p>';
                return;
            }

            // ──────────────────────────────────────
            // DOM references
            // ──────────────────────────────────────
            const svgEl = document.getElementById('tree-svg');
            const arrayRowEl = document.getElementById('array-row');
            const legendRowEl = document.getElementById('legend-row');
            const resultBeforeEl = document.getElementById('result-before');
            const resultAfterEl = document.getElementById('result-after');
            const prevBtn = document.getElementById('prev');
            const nextBtn = document.getElementById('next');
            const rangeInput = document.getElementById('range');
            const counterEl = document.getElementById('counter');
            const stepTitleEl = document.getElementById('step-title');
            const expWhatEl = document.getElementById('exp-what');
            const expWhyEl = document.getElementById('exp-why');
            const expFormulaEl = document.getElementById('exp-formula');
            const expHintEl = document.getElementById('exp-hint');

            // ──────────────────────────────────────
            // Node position map (based on l,r range)
            // ──────────────────────────────────────
            const nodePositionMap = {
                'seg_1_0_3': { x: 400, y: 58 },
                'seg_2_0_1': { x: 235, y: 185 },
                'seg_3_2_3': { x: 565, y: 185 },
                'seg_4_0_0': { x: 125, y: 322 },
                'seg_5_1_1': { x: 345, y: 322 },
                'seg_6_2_2': { x: 455, y: 322 },
                'seg_7_3_3': { x: 675, y: 322 }
            };

            const NODE_W = 96;
            const NODE_H = 42;
            const NODE_RX = 8;

            function getNodePos(nodeId) {
                return nodePositionMap[nodeId] || { x: 400, y: 200 };
            }

            // ──────────────────────────────────────
            // Build SVG for a frame
            // ──────────────────────────────────────
            function buildSVG(frame) {
                const state = frame.state || {};
                const segTree = state.seg_tree || { nodes: [], edges: [] };
                const nodes = segTree.nodes || [];
                const edges = segTree.edges || [];
                const coverPathRaw = state.cover_path || [];
                const updatePathRaw = state.update_path || [];
                const queryPathRaw = state.query_path || [];

                // Normalize path arrays: extract node IDs from "node:seg_X_Y_Z" strings
                function normalizePath(arr) {
                    return arr.map(s => typeof s === 'string' ? s.replace(/^node:/, '') : s);
                }
                const coverSet = new Set(normalizePath(coverPathRaw));
                const updateSet = new Set(normalizePath(updatePathRaw));
                const queryVisitSet = new Set(normalizePath(queryPathRaw));

                // Build node lookup
                const nodeMap = {};
                nodes.forEach(n => { nodeMap[n.id] = n; });

                // Determine if this frame shows an update (changed values)
                const isUpdateFrame = updateSet.size > 0;
                const isQueryFrame = coverSet.size > 0 && !isUpdateFrame;
                const isAnswerFrame = !!(state.answer);

                let svgInner = '';

                // Draw edges
                edges.forEach(([parentId, childId]) => {
                    const pPos = getNodePos(parentId);
                    const cPos = getNodePos(childId);
                    const x1 = pPos.x;
                    const y1 = pPos.y + NODE_H / 2;
                    const x2 = cPos.x;
                    const y2 = cPos.y - NODE_H / 2;

                    let edgeClass = 'tree-edge';
                    const parentInCover = coverSet.has(parentId);
                    const childInCover = coverSet.has(childId);
                    const parentInUpdate = updateSet.has(parentId);
                    const childInUpdate = updateSet.has(childId);
                    const parentInQuery = queryVisitSet.has(parentId);
                    const childInQuery = queryVisitSet.has(childId);

                    if (parentInCover && childInCover) {
                        edgeClass += ' highlight-cover';
                    } else if (parentInUpdate && childInUpdate) {
                        edgeClass += ' highlight-update';
                    } else if (parentInQuery || childInQuery) {
                        edgeClass += ' highlight-query-path';
                    }

                    svgInner +=
                        `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${edgeClass}" data-derived-visual-only="true"></line>`;
                });

                // Draw nodes
                nodes.forEach(node => {
                    const pos = getNodePos(node.id);
                    const x = pos.x - NODE_W / 2;
                    const y = pos.y - NODE_H / 2;
                    const meta = node.meta || {};
                    const sum = meta.sum !== undefined ? meta.sum : 0;
                    const l = meta.l !== undefined ? meta.l : 0;
                    const r = meta.r !== undefined ? meta.r : 0;
                    const label = `[${l},${r}]`;

                    let fillColor = '#f8fafc';
                    let strokeColor = '#cbd5e1';
                    let strokeWidth = 2;
                    let textColor = '#1e293b';
                    let sumColor = '#64748b';
                    let extraClass = '';

                    if (coverSet.has(node.id)) {
                        fillColor = '#dcfce7';
                        strokeColor = '#22c55e';
                        strokeWidth = 3;
                        textColor = '#15803d';
                        sumColor = '#15803d';
                        extraClass = ' node-cover';
                    }
                    if (updateSet.has(node.id)) {
                        fillColor = '#fff7ed';
                        strokeColor = '#f97316';
                        strokeWidth = 3;
                        textColor = '#c2410c';
                        sumColor = '#c2410c';
                        extraClass = ' node-update';
                    }
                    if (queryVisitSet.has(node.id) && !coverSet.has(node.id) && !updateSet.has(node.id)) {
                        fillColor = '#f1f5f9';
                        strokeColor = '#94a3b8';
                        strokeWidth = 2;
                        textColor = '#475569';
                        sumColor = '#64748b';
                        extraClass = ' node-query-visit';
                    }
                    // Root gets a slightly bolder look
                    if (node.id === 'seg_1_0_3' && !coverSet.has(node.id) && !updateSet.has(node.id) && !queryVisitSet
                        .has(node.id)) {
                        fillColor = '#eff6ff';
                        strokeColor = '#93c5fd';
                        strokeWidth = 2.5;
                    }

                    svgInner += `
                <g data-derived-visual-only="true" class="tree-node-group${extraClass}">
                  <rect x="${x}" y="${y}" width="${NODE_W}" height="${NODE_H}" rx="${NODE_RX}" ry="${NODE_RX}"
                        fill="${fillColor}" stroke="${strokeColor}" stroke-width="${strokeWidth}"
                        class="tree-node-rect" data-node-id="${node.id}"/>
                  <text x="${pos.x}" y="${pos.y - 4}" class="tree-node-text" fill="${textColor}">${label}</text>
                  <text x="${pos.x}" y="${pos.y + 16}" class="tree-node-text sum-text" fill="${sumColor}">sum = ${sum}</text>
                </g>`;
                });

                return svgInner;
            }

            // ──────────────────────────────────────
            // Build array row HTML
            // ──────────────────────────────────────
            function buildArrayRow(frame) {
                const state = frame.state || {};
                const nums = state.nums || inputData.nums || [2, 1, 4, 5];
                const query = state.query || null;
                const update = state.update || null;
                const isQueryFrame = query !== null && update === null;
                const isUpdateFrame = update !== null;

                let html = '<span class="array-label">nums:</span>';
                nums.forEach((val, idx) => {
                    let cls = 'array-cell';
                    if (isQueryFrame && query && idx >= query[0] && idx <= query[1]) {
                        cls += ' query-range';
                    }
                    if (isUpdateFrame && update && idx === update[0]) {
                        cls += ' update-pos';
                    }
                    html +=
                        `<span class="${cls}" data-derived-visual-only="true"><span class="cell-index">${idx}</span>${val}</span>`;
                });
                return html;
            }

            // ──────────────────────────────────────
            // Build legend
            // ──────────────────────────────────────
            function buildLegend(frame) {
                const state = frame.state || {};
                const hasCover = (state.cover_path || []).length > 0;
                const hasUpdate = (state.update_path || []).length > 0;
                const hasQueryPath = (state.query_path || []).length > 0;

                let html = '';
                if (hasCover) html +=
                    '<span><span class="legend-dot cover"></span> Cover nodes (summed in query)</span>';
                if (hasQueryPath && !hasCover)
                    html += '<span><span class="legend-dot query-visit"></span> Visited nodes (query path)</span>';
                if (hasUpdate) html +=
                    '<span><span class="legend-dot update"></span> Updated nodes (leaf &amp; ancestors)</span>';
                if (!html) html = '<span>All nodes shown with their range and current sum</span>';
                return html;
            }

            // ──────────────────────────────────────
            // Update explanation
            // ──────────────────────────────────────
            function updateExplanation(frame) {
                const teaching = frame.teaching || {};
                expWhatEl.textContent = teaching.what || frame.description || '';
                expWhyEl.textContent = teaching.why || '';
                expFormulaEl.textContent = teaching.formula || '';
                expFormulaEl.style.display = teaching.formula ? 'inline-block' : 'none';
                expHintEl.textContent = teaching.hint || '';
                expHintEl.style.display = teaching.hint ? 'block' : 'none';
            }

            // ──────────────────────────────────────
            // Update result panel
            // ──────────────────────────────────────
            function updateResultPanel(frame) {
                const state = frame.state || {};
                if (state.answer) {
                    resultBeforeEl.textContent = state.answer.before !== undefined ? state.answer.before : verifiedResult
                        .before;
                    resultAfterEl.textContent = state.answer.after !== undefined ? state.answer.after : verifiedResult
                    .after;
                } else {
                    resultBeforeEl.textContent = verifiedResult.before;
                    resultAfterEl.textContent = verifiedResult.after;
                }
            }

            // ──────────────────────────────────────
            // Main render function
            // ──────────────────────────────────────
            let currentIndex = 0;

            function renderFrame(index) {
                if (index < 0 || index >= frames.length) return;
                currentIndex = index;
                const frame = frames[index];

                // Update SVG
                svgEl.innerHTML = buildSVG(frame);

                // Update array row
                arrayRowEl.innerHTML = buildArrayRow(frame);

                // Update legend
                legendRowEl.innerHTML = buildLegend(frame);

                // Update result
                updateResultPanel(frame);

                // Update explanation
                updateExplanation(frame);

                // Update controls
                const displayStep = index + 1;
                counterEl.textContent = `Step ${displayStep} / ${frames.length}`;
                stepTitleEl.textContent = frame.title || frame.description || `Step ${frame.step}`;
                rangeInput.value = index;
                rangeInput.max = frames.length - 1;
                prevBtn.disabled = index === 0;
                nextBtn.disabled = index === frames.length - 1;
            }

            // ──────────────────────────────────────
            // Event listeners
            // ──────────────────────────────────────
            prevBtn.addEventListener('click', () => {
                if (currentIndex > 0) renderFrame(currentIndex - 1);
            });
            nextBtn.addEventListener('click', () => {
                if (currentIndex < frames.length - 1) renderFrame(currentIndex + 1);
            });
            rangeInput.addEventListener('input', () => {
                const idx = parseInt(rangeInput.value, 10);
                if (!isNaN(idx) && idx >= 0 && idx < frames.length) {
                    renderFrame(idx);
                }
            });

            // Keyboard navigation
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft' && currentIndex > 0) {
                    e.preventDefault();
                    renderFrame(currentIndex - 1);
                } else if (e.key === 'ArrowRight' && currentIndex < frames.length - 1) {
                    e.preventDefault();
                    renderFrame(currentIndex + 1);
                }
            });

            // ──────────────────────────────────────
            // Initial render
            // ──────────────────────────────────────
            rangeInput.max = frames.length - 1;
            rangeInput.value = 0;
            renderFrame(0);

            // Log ready state
            console.log('Segment Tree Visualization ready. Frames:', frames.length,
                '| Verified result:', verifiedResult);
        })();
    </script>
