<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kahn Topological Sort - Course Sequence Visualizer</title>
    <style>
        :root {
            --bg: #f8f9fb;
            --card-bg: #ffffff;
            --text: #1a1a2e;
            --text-secondary: #555;
            --border: #e0e0e8;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            --accent: #3b6df0;
            --accent-light: #e8eeff;
            --processed: #4caf84;
            --processed-bg: #e6f7ee;
            --queued: #f0a050;
            --queued-bg: #fff6ed;
            --waiting: #c5c5d0;
            --waiting-bg: #f4f4f7;
            --active: #3b8df0;
            --active-glow: rgba(59, 141, 240, 0.45);
            --result: #2e7d5b;
            --result-bg: #e8f5ee;
            --radius: 12px;
            --transition: 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px 16px;
            line-height: 1.5;
        }

        #app {
            width: 100%;
            max-width: 780px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .header {
            text-align: center;
            padding: 6px 0;
        }
        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: var(--text);
        }
        .header .subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        /* Stage card */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            padding: 20px 22px;
        }

        #stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 16px 10px;
            min-height: 420px;
        }

        /* SVG graph */
        .graph-svg {
            width: 100%;
            max-width: 560px;
            height: auto;
            display: block;
        }

        /* Node styles */
        .node-circle {
            transition: fill var(--transition), stroke var(--transition), stroke-width var(--transition);
            cursor: default;
        }
        .node-circle.state-waiting {
            fill: #e8e8ef;
            stroke: #c5c5d0;
            stroke-width: 2;
        }
        .node-circle.state-queued {
            fill: #ffe0b8;
            stroke: #f0a050;
            stroke-width: 2.5;
        }
        .node-circle.state-active {
            fill: #d4e4ff;
            stroke: #3b8df0;
            stroke-width: 3.5;
            filter: drop-shadow(0 0 8px var(--active-glow));
        }
        .node-circle.state-processed {
            fill: #c8edda;
            stroke: #4caf84;
            stroke-width: 2.5;
        }
        .node-label {
            font-weight: 700;
            font-size: 16px;
            fill: #1a1a2e;
            text-anchor: middle;
            dominant-baseline: central;
            pointer-events: none;
            user-select: none;
        }
        .indegree-badge {
            font-size: 11px;
            fill: #666;
            text-anchor: middle;
            pointer-events: none;
            user-select: none;
        }
        .indegree-badge.zero {
            fill: #4caf84;
            font-weight: 700;
        }
        .edge-line {
            stroke: #bbb;
            stroke-width: 2;
            fill: none;
            transition: stroke var(--transition), stroke-width var(--transition);
        }
        .edge-line.highlighted {
            stroke: #3b8df0;
            stroke-width: 2.8;
        }

        /* Queue display */
        .queue-area {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .queue-label {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-secondary);
            white-space: nowrap;
        }
        .queue-slot {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-weight: 700;
            font-size: 1rem;
            background: var(--queued-bg);
            border: 2.5px solid var(--queued);
            color: #b85d10;
            transition: all var(--transition);
        }
        .queue-empty {
            font-style: italic;
            color: #999;
            font-size: 0.9rem;
        }

        /* Answer display */
        .answer-area {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .answer-label {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-secondary);
            white-space: nowrap;
        }
        .answer-slot {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            background: var(--processed-bg);
            border: 2.5px solid var(--processed);
            color: #1e6b3e;
            transition: all var(--transition);
        }
        .answer-slot.latest {
            border-color: #3b8df0;
            background: #d4e4ff;
            color: #1a3d80;
            box-shadow: 0 0 12px var(--active-glow);
            animation: pulse-slot 0.7s ease-out;
        }
        @keyframes pulse-slot {
            0% {
                transform: scale(1.15);
            }
            100% {
                transform: scale(1);
            }
        }
        .answer-empty {
            font-style: italic;
            color: #999;
            font-size: 0.9rem;
        }

        /* Verified result */
        .verified-result {
            text-align: center;
            padding: 10px 16px;
            background: var(--result-bg);
            border-radius: 8px;
            border: 1px solid #c3e6d3;
            font-weight: 600;
            color: var(--result);
            font-size: 0.95rem;
            transition: opacity var(--transition);
        }
        .verified-result.hidden {
            opacity: 0.35;
        }
        .verified-result .result-seq {
            font-weight: 800;
            letter-spacing: 0.04em;
            font-size: 1.05rem;
        }

        /* Controls */
        .controls-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            padding: 8px 0;
        }
        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: 1.5px solid var(--border);
            background: #fff;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s;
            color: var(--text);
            white-space: nowrap;
            user-select: none;
        }
        .btn:hover {
            background: #f0f2f8;
            border-color: #c0c4d4;
        }
        .btn:active {
            background: #e4e6f0;
            transform: scale(0.97);
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }
        .btn.primary {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .btn.primary:hover {
            background: #2f5cd6;
            border-color: #2f5cd6;
        }
        #range {
            flex: 1;
            min-width: 120px;
            max-width: 280px;
            accent-color: var(--accent);
            cursor: pointer;
            height: 8px;
        }
        #counter {
            font-weight: 700;
            font-size: 0.9rem;
            min-width: 70px;
            text-align: center;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        /* Explanation */
        #explanation {
            font-size: 0.92rem;
            color: var(--text);
            line-height: 1.6;
            padding: 4px 2px;
        }
        #explanation .exp-what {
            font-weight: 700;
            color: #1a1a2e;
        }
        #explanation .exp-why {
            color: #666;
            margin-top: 4px;
        }
        #explanation .exp-hint {
            color: #888;
            font-style: italic;
            margin-top: 3px;
            font-size: 0.85rem;
        }
        #explanation .exp-phase {
            display: inline-block;
            background: var(--accent-light);
            color: #2f5cd6;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        /* Responsive */
        @media (max-width: 600px) {
            #stage {
                padding: 10px 4px;
                gap: 10px;
            }
            .graph-svg {
                max-width: 100%;
            }
            .btn {
                padding: 8px 14px;
                font-size: 0.8rem;
            }
            #range {
                max-width: 160px;
            }
            .node-label {
                font-size: 13px;
            }
            .queue-slot,
            .answer-slot {
                width: 36px;
                height: 36px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>

                ✅ Verified Result: <span class="result-seq" id="verified-seq"></span>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls-bar">
            <button class="btn" id="prev" aria-label="Previous step">◀ Prev</button>
            <input type="range" id="range" min="0" max="0" value="0" step="1" aria-label="Step slider" />
            <span id="counter">Step 0 / 0</span>
            <button class="btn primary" id="next" aria-label="Next step">Next ▶</button>

        <!-- Explanation -->
        <div class="card" id="explanation" aria-label="Step explanation">

            <div class="exp-what">Loading visualization data…</div>
            <div class="exp-why"></div>
            <div class="exp-hint"></div>
        </div>
    </div>

<script>
        (function() {
            // ──────────────────────────────────────
            // Read the injected artifact
            // ──────────────────────────────────────
            const artifactScript = document.getElementById('algolab-artifact');
            if (!artifactScript) {
                document.getElementById('explanation').innerHTML =
                    '<span class="exp-phase">Error</span><div class="exp-what">Artifact data not found.</div><div class="exp-why">The AlgoLab runtime has not injected the algorithm artifact. Please ensure the page is loaded within the AlgoLab environment.</div>';
                return;
            }

            let artifact;
            try {
                artifact = JSON.parse(artifactScript.textContent);
            } catch (e) {
                document.getElementById('explanation').innerHTML =
                    '<span class="exp-phase">Error</span><div class="exp-what">Failed to parse artifact JSON.</div><div class="exp-why">The injected data is malformed. ' +
                    e.message + '</div>';
                return;
            }

            // Validate artifact structure
            if (!artifact.frames || !Array.isArray(artifact.frames) || artifact.frames.length === 0) {
                document.getElementById('explanation').innerHTML =
                    '<span class="exp-phase">Error</span><div class="exp-what">No frames found in artifact.</div><div class="exp-why">The artifact must contain a non-empty "frames" array with algorithm trace data.</div>';
                return;
            }

            const frames = artifact.frames;
            const verifiedResult = artifact.result;
            const inputData = artifact.input_data || artifact.input || null;

            // ──────────────────────────────────────
            // DOM references
            // ──────────────────────────────────────
            const stageEl = document.getElementById('stage');
            const edgesGroup = document.getElementById('edges-group');
            const nodesGroup = document.getElementById('nodes-group');
            const queueDisplay = document.getElementById('queue-display');
            const answerDisplay = document.getElementById('answer-display');
            const verifiedResultDisplay = document.getElementById('verified-result-display');
            const verifiedSeqEl = document.getElementById('verified-seq');
            const explanationEl = document.getElementById('explanation');
            const prevBtn = document.getElementById('prev');
            const nextBtn = document.getElementById('next');
            const rangeEl = document.getElementById('range');
            const counterEl = document.getElementById('counter');

            // ──────────────────────────────────────
            // Fixed node layout for the dependency graph
            // ──────────────────────────────────────
            const nodePositions = {
                'A': { cx: 300, cy: 75 },
                'B': { cx: 140, cy: 245 },
                'C': { cx: 460, cy: 245 },
                'D': { cx: 300, cy: 415 }
            };
            const nodeRadius = 36;
            const allNodeIds = ['A', 'B', 'C', 'D'];

            // Edge definitions (source -> target)
            const edgeDefs = [
                { u: 'A', v: 'B' },
                { u: 'A', v: 'C' },
                { u: 'B', v: 'D' },
                { u: 'C', v: 'D' }
            ];

            // ──────────────────────────────────────
            // Build static SVG elements (edges + nodes)
            // ──────────────────────────────────────
            function buildGraphSVG() {
                // Edges
                edgesGroup.innerHTML = '';
                edgeDefs.forEach((edge, idx) => {
                    const from = nodePositions[edge.u];
                    const to = nodePositions[edge.v];
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', from.cx);
                    line.setAttribute('y1', from.cy);
                    line.setAttribute('x2', to.cx);
                    line.setAttribute('y2', to.cy);
                    line.setAttribute('data-edge-id', `${edge.u}-${edge.v}`);
                    line.classList.add('edge-line');
                    line.setAttribute('marker-end', 'url(#arrowhead)');
                    edgesGroup.appendChild(line);
                });

                // Nodes (circles + labels + indegree badges)
                nodesGroup.innerHTML = '';
                allNodeIds.forEach(nodeId => {
                    const pos = nodePositions[nodeId];
                    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                    g.setAttribute('data-node-id', nodeId);
                    g.setAttribute('data-derived-visual-only', 'true');

                    // Circle
                    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    circle.setAttribute('cx', pos.cx);
                    circle.setAttribute('cy', pos.cy);
                    circle.setAttribute('r', nodeRadius);
                    circle.classList.add('node-circle', 'state-waiting');
                    circle.setAttribute('data-node-circle', nodeId);
                    g.appendChild(circle);

                    // Label
                    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    text.setAttribute('x', pos.cx);
                    text.setAttribute('y', pos.cy);
                    text.classList.add('node-label');
                    text.textContent = nodeId;
                    g.appendChild(text);

                    // Indegree badge (positioned below the node)
                    const badge = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    badge.setAttribute('x', pos.cx);
                    badge.setAttribute('y', pos.cy + nodeRadius + 18);
                    badge.classList.add('indegree-badge');
                    badge.setAttribute('data-indegree-badge', nodeId);
                    badge.textContent = 'in: —';
                    g.appendChild(badge);

                    nodesGroup.appendChild(g);
                });
            }

            buildGraphSVG();

            // ──────────────────────────────────────
            // Derive node status from frame state
            // ──────────────────────────────────────
            function deriveNodeStates(state) {
                // state may have: answer, zero_in_queue, indegree, graph
                const answer = state.answer || [];
                const queue = state.zero_in_queue || [];
                const indegree = state.indegree || {};

                const answerSet = new Set(answer);
                const queueSet = new Set(queue);

                const states = {};
                allNodeIds.forEach(nodeId => {
                    if (answerSet.has(nodeId)) {
                        // Check if it's the most recently processed node
                        const isLatest = answer.length > 0 && answer[answer.length - 1] === nodeId;
                        states[nodeId] = isLatest ? 'active' : 'processed';
                    } else if (queueSet.has(nodeId)) {
                        states[nodeId] = 'queued';
                    } else {
                        states[nodeId] = 'waiting';
                    }
                });
                return { nodeStates: states, answer, queue, indegree, answerSet, queueSet };
            }

            // ──────────────────────────────────────
            // Render a single frame
            // ──────────────────────────────────────
            function renderFrame(frameIndex) {
                const frame = frames[frameIndex];
                if (!frame) return;

                const state = frame.state || {};
                const teaching = frame.teaching || {};
                const evidence = frame.evidence || {};
                const phase = evidence.phase || '—';

                const { nodeStates, answer, queue, indegree } = deriveNodeStates(state);

                // Update node circles
                allNodeIds.forEach(nodeId => {
                    const circle = document.querySelector(`[data-node-circle="${nodeId}"]`);
                    if (!circle) return;
                    // Remove all state classes
                    circle.classList.remove('state-waiting', 'state-queued', 'state-active', 'state-processed');
                    // Add current state class
                    circle.classList.add(`state-${nodeStates[nodeId]}`);
                });

                // Update indegree badges
                allNodeIds.forEach(nodeId => {
                    const badge = document.querySelector(`[data-indegree-badge="${nodeId}"]`);
                    if (!badge) return;
                    const val = indegree.hasOwnProperty(nodeId) ? indegree[nodeId] : '—';
                    badge.textContent = 'in: ' + val;
                    badge.classList.toggle('zero', val === 0);
                });

                // Update edge highlights (highlight edges FROM the active node)
                const activeNodeId = answer.length > 0 ? answer[answer.length - 1] : null;
                document.querySelectorAll('.edge-line').forEach(line => {
                    const edgeId = line.getAttribute('data-edge-id');
                    line.classList.remove('highlighted');
                    line.setAttribute('marker-end', 'url(#arrowhead)');
                    if (activeNodeId && edgeId && edgeId.startsWith(activeNodeId + '-')) {
                        line.classList.add('highlighted');
                        line.setAttribute('marker-end', 'url(#arrowhead-hl)');
                    }
                });

                // Update queue display
                const queueLabelEl = queueDisplay.querySelector('.queue-label');
                const queueSlots = queueDisplay.querySelectorAll('.queue-slot');
                const queueEmptyEl = queueDisplay.querySelector('.queue-empty');
                // Remove old slots
                queueSlots.forEach(s => s.remove());
                if (queueEmptyEl) queueEmptyEl.remove();

                if (queue.length === 0) {
                    const emptySpan = document.createElement('span');
                    emptySpan.classList.add('queue-empty');
                    emptySpan.textContent = 'empty';
                    queueDisplay.appendChild(emptySpan);
                } else {
                    queue.forEach(nodeId => {
                        const slot = document.createElement('span');
                        slot.classList.add('queue-slot');
                        slot.textContent = nodeId;
                        slot.setAttribute('data-derived-visual-only', 'true');
                        queueDisplay.appendChild(slot);
                    });
                }
                // Ensure label stays first
                if (!queueDisplay.querySelector('.queue-label')) {
                    const lbl = document.createElement('span');
                    lbl.classList.add('queue-label');
                    lbl.textContent = 'Queue:';
                    queueDisplay.prepend(lbl);
                }

                // Update answer display
                const ansLabelEl = answerDisplay.querySelector('.answer-label');
                const ansSlots = answerDisplay.querySelectorAll('.answer-slot');
                const ansEmptyEl = answerDisplay.querySelector('.answer-empty');
                ansSlots.forEach(s => s.remove());
                if (ansEmptyEl) ansEmptyEl.remove();

                if (answer.length === 0) {
                    const emptySpan = document.createElement('span');
                    emptySpan.classList.add('answer-empty');
                    emptySpan.textContent = '—';
                    answerDisplay.appendChild(emptySpan);
                } else {
                    answer.forEach((nodeId, idx) => {
                        const slot = document.createElement('span');
                        slot.classList.add('answer-slot');
                        slot.textContent = nodeId;
                        slot.setAttribute('data-derived-visual-only', 'true');
                        if (idx === answer.length - 1 && nodeStates[nodeId] === 'active') {
                            slot.classList.add('latest');
                        }
                        answerDisplay.appendChild(slot);
                    });
                }
                if (!answerDisplay.querySelector('.answer-label')) {
                    const lbl = document.createElement('span');
                    lbl.classList.add('answer-label');
                    lbl.textContent = 'Sequence:';
                    answerDisplay.prepend(lbl);
                }

                // Update verified result visibility
                const isFinalFrame = (frameIndex === frames.length - 1);
                if (verifiedResult && isFinalFrame) {
                    verifiedResultDisplay.classList.remove('hidden');
                    verifiedSeqEl.textContent = '[' + verifiedResult.join(', ') + ']';
                } else if (verifiedResult) {
                    verifiedResultDisplay.classList.add('hidden');
                }

                // Update explanation
                explanationEl.innerHTML = '';
                const phaseSpan = document.createElement('span');
                phaseSpan.classList.add('exp-phase');
                phaseSpan.textContent = phase;
                explanationEl.appendChild(phaseSpan);

                const whatDiv = document.createElement('div');
                whatDiv.classList.add('exp-what');
                whatDiv.textContent = teaching.what || frame.description || 'Step ' + frame.step;
                explanationEl.appendChild(whatDiv);

                if (teaching.why) {
                    const whyDiv = document.createElement('div');
                    whyDiv.classList.add('exp-why');
                    whyDiv.textContent = teaching.why;
                    explanationEl.appendChild(whyDiv);
                }

                if (teaching.hint) {
                    const hintDiv = document.createElement('div');
                    hintDiv.classList.add('exp-hint');
                    hintDiv.textContent = '💡 ' + teaching.hint;
                    explanationEl.appendChild(hintDiv);
                }

                // Update counter
                counterEl.textContent = `Step ${frame.step} / ${frames[frames.length - 1].step}`;

                // Update range slider
                rangeEl.value = frameIndex;

                // Update button states
                prevBtn.disabled = (frameIndex === 0);
                nextBtn.disabled = (frameIndex === frames.length - 1);
            }

            // ──────────────────────────────────────
            // Initialize controls
            // ──────────────────────────────────────
            rangeEl.min = 0;
            rangeEl.max = frames.length - 1;
            rangeEl.value = 0;

            // Display verified result in the card
            if (verifiedResult) {
                verifiedSeqEl.textContent = '[' + verifiedResult.join(', ') + ']';
                verifiedResultDisplay.classList.add('hidden');
            } else {
                verifiedResultDisplay.style.display = 'none';
            }

            // ──────────────────────────────────────
            // Event handlers
            // ──────────────────────────────────────
            let currentFrameIndex = 0;

            function goToFrame(index) {
                index = Math.max(0, Math.min(frames.length - 1, index));
                if (index === currentFrameIndex && document.querySelector('.node-circle.state-waiting') === null) {
                    // Already rendered this frame (initial state), but force re-render
                }
                currentFrameIndex = index;
                renderFrame(index);
            }

            prevBtn.addEventListener('click', () => {
                if (currentFrameIndex > 0) {
                    goToFrame(currentFrameIndex - 1);
                }
            });

            nextBtn.addEventListener('click', () => {
                if (currentFrameIndex < frames.length - 1) {
                    goToFrame(currentFrameIndex + 1);
                }
            });

            rangeEl.addEventListener('input', () => {
                goToFrame(parseInt(rangeEl.value, 10));
            });

            // Keyboard navigation
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    if (currentFrameIndex > 0) goToFrame(currentFrameIndex - 1);
                } else if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    if (currentFrameIndex < frames.length - 1) goToFrame(currentFrameIndex + 1);
                } else if (e.key === 'Home') {
                    e.preventDefault();
                    goToFrame(0);
                } else if (e.key === 'End') {
                    e.preventDefault();
                    goToFrame(frames.length - 1);
                }
            });

            // ──────────────────────────────────────
            // Initial render
            // ──────────────────────────────────────
            goToFrame(0);

            // Log ready state
            console.log('AlgoLab Kahn Topological Sort Visualizer ready.');
            console.log('Frames loaded:', frames.length);
            console.log('Verified result:', verifiedResult);
            console.log('Input data:', inputData);
        })();
    </script>
</body>
</html>
