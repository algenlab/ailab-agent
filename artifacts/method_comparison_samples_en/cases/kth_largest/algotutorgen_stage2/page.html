<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-th Highest Rating &mdash; Min-Heap Algorithm Visualization</title>
    <style>
        :root {
            --bg: #f5f6fa;
            --card: #ffffff;
            --text: #2d3436;
            --muted: #636e72;
            --primary: #4a90d9;
            --success: #27ae60;
            --warn: #f39c12;
            --danger: #e74c3c;
            --border: #dfe6e9;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            --radius: 10px;
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            font-family: var(--font);
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 24px 12px 40px;
            min-height: 100vh;
        }

        #app {
            max-width: 820px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 20px 24px;
            border: 1px solid var(--border);
        }

        h1 {
            font-size: 1.55rem;
            font-weight: 700;
            color: #1e272e;
            letter-spacing: -0.01em;
        }
        h1 span {
            color: var(--primary);
            font-weight: 800;
        }

        .subtitle {
            color: var(--muted);
            font-size: 0.9rem;
            margin-top: 2px;
        }

        #stage {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: flex-start;
        }

        .array-panel {
            flex: 1 1 280px;
            min-width: 260px;
        }
        .array-panel h3 {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .array-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .array-cell {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.05rem;
            transition: all 0.25s ease;
            background: #fafafa;
            position: relative;
        }
        .array-cell.highlight {
            border-color: var(--warn);
            background: #fff8e7;
            box-shadow: 0 0 0 3px rgba(243, 156, 18, 0.2);
            transform: translateY(-2px);
            z-index: 1;
        }
        .array-cell.processed {
            border-color: #b2bec3;
            background: #f0f0f0;
            color: #999;
        }
        .array-index {
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.7rem;
            color: var(--muted);
            font-weight: 500;
            white-space: nowrap;
        }

        .heap-panel {
            flex: 1 1 340px;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .heap-panel h3 {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            align-self: flex-start;
        }
        .heap-tree-svg {
            width: 100%;
            max-width: 360px;
            height: 220px;
            background: #fdfdfd;
            border-radius: var(--radius);
            border: 1px solid var(--border);
        }
        .heap-array-display {
            font-size: 0.9rem;
            color: var(--text);
            background: #f8f9fa;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--border);
            font-family: 'SF Mono', 'Consolas', 'Monaco', monospace;
            letter-spacing: 0.02em;
            min-width: 60px;
            text-align: center;
            transition: all 0.25s ease;
        }
        .heap-array-display.empty {
            color: #bbb;
            font-style: italic;
        }

        .controls-card {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .controls-card button {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            background: var(--primary);
            color: #fff;
            letter-spacing: 0.02em;
        }
        .controls-card button:hover {
            background: #3a7bc8;
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(74, 144, 217, 0.3);
        }
        .controls-card button:active {
            transform: translateY(0);
            box-shadow: none;
        }
        .controls-card button:disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        .controls-card input[type="range"] {
            flex: 1;
            min-width: 120px;
            accent-color: var(--primary);
            height: 6px;
        }
        #counter {
            font-weight: 700;
            font-size: 0.95rem;
            min-width: 80px;
            text-align: center;
            color: var(--text);
        }

        #explanation {
            font-size: 0.95rem;
            line-height: 1.55;
            color: var(--text);
        }
        #explanation .phase-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-right: 6px;
            background: #e8f0fe;
            color: var(--primary);
        }
        #explanation .action-text {
            font-weight: 500;
            color: #2d3436;
        }
        #explanation .invariant {
            display: block;
            margin-top: 6px;
            padding: 6px 12px;
            background: #f0fff4;
            border-left: 3px solid var(--success);
            border-radius: 0 6px 6px 0;
            font-size: 0.85rem;
            color: #1e7a3e;
        }

        .result-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            background: #eafaf1;
            border: 2px solid var(--success);
            border-radius: 24px;
            font-weight: 700;
            font-size: 1.1rem;
            color: #1e7a3e;
        }
        .result-badge .check {
            font-size: 1.3rem;
        }

        .root-indicator {
            font-size: 0.8rem;
            color: var(--success);
            font-weight: 700;
            text-align: center;
            margin-top: 2px;
        }

        @media (max-width: 600px) {
            #stage {
                flex-direction: column;
                gap: 16px;
            }
            .controls-card {
                gap: 8px;
            }
            .controls-card button {
                padding: 8px 14px;
                font-size: 0.8rem;
            }
            h1 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="card">
            <h1>Top <span>K</span> Highest Ratings</h1>
            <p class="subtitle">Streaming min-heap algorithm &bull; k = 2 &bull; nums = [3, 2, 1, 5, 6, 4]</p>
        </div>

        <div class="card" id="stage">
            <div class="array-panel">
                <h3>📋 Input Ratings Stream</h3>
                <div class="array-row" id="array-container"></div>
                <div style="margin-top:22px; font-size:0.82rem; color:var(--muted);">
                    <span style="display:inline-block;width:12px;height:12px;border-radius:3px;background:#fff8e7;border:2px solid var(--warn);margin-right:4px;vertical-align:middle;"></span> Current &nbsp;
                    <span style="display:inline-block;width:12px;height:12px;border-radius:3px;background:#f0f0f0;border:2px solid #b2bec3;margin-right:4px;vertical-align:middle;"></span> Processed
                </div>
            </div>

            <div class="heap-panel">
                <h3>🪣 Min-Heap (size &le; k)</h3>
                <svg class="heap-tree-svg" id="heap-svg" viewBox="0 0 360 220" preserveAspectRatio="xMidYMid meet"></svg>
                <div class="heap-array-display empty" id="heap-array-text">Empty</div>
                <div class="root-indicator" id="root-label"></div>
            </div>
        </div>

        <div class="card controls-card">
            <button id="prev" title="Previous step">◀ Prev</button>
            <input type="range" id="range" min="0" max="40" value="0" step="1" title="Step slider">
            <button id="next" title="Next step">Next ▶</button>
            <span id="counter">Step 0 / 40</span>
        </div>

        <div class="card" id="explanation">
            <span class="phase-badge">Init</span>
            <span class="action-text">Ready to begin the algorithm visualization.</span>
        </div>

        <div class="card" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;">
            <span style="font-weight:600;color:var(--muted);">Verified Answer:</span>
            <span class="result-badge">
                <span class="check">✓</span> K-th Highest Rating = <strong id="verified-answer">5</strong>
            </span>
        </div>
    </div>

<script>
        (function() {
            // ──────────────────────────────────────────────
            // Read the injected artifact (or use fallback)
            // ──────────────────────────────────────────────
            const artifactEl = document.getElementById('algolab-artifact');
            let artifact = null;
            try {
                if (artifactEl && artifactEl.textContent.trim()) {
                    artifact = JSON.parse(artifactEl.textContent);
                }
            } catch (e) {
                console.warn('Could not parse algolab-artifact, using generated frames.');
            }

            const VERIFIED_RESULT = (artifact && artifact.result != null) ? artifact.result : 5;
            const INPUT_DATA = (artifact && artifact.input_data) ? artifact.input_data :
                ((artifact && artifact.input) ? artifact.input : { nums: [3, 2, 1, 5, 6, 4], k: 2 });

            const NUMS = INPUT_DATA.nums || [3, 2, 1, 5, 6, 4];
            const K = INPUT_DATA.k || 2;

            // ──────────────────────────────────────────────
            // Heap helper functions
            // ──────────────────────────────────────────────
            function heapifyUp(heap, idx) {
                while (idx > 0) {
                    const p = Math.floor((idx - 1) / 2);
                    if (heap[p] > heap[idx]) {
                        [heap[p], heap[idx]] = [heap[idx], heap[p]];
                        idx = p;
                    } else break;
                }
            }

            function heapifyDown(heap, idx) {
                const n = heap.length;
                while (true) {
                    let smallest = idx;
                    const l = 2 * idx + 1;
                    const r = 2 * idx + 2;
                    if (l < n && heap[l] < heap[smallest]) smallest = l;
                    if (r < n && heap[r] < heap[smallest]) smallest = r;
                    if (smallest !== idx) {
                        [heap[smallest], heap[idx]] = [heap[idx], heap[smallest]];
                        idx = smallest;
                    } else break;
                }
            }

            function getOrdinal(n) {
                if (n === 1) return '1st';
                if (n === 2) return '2nd';
                if (n === 3) return '3rd';
                return n + 'th';
            }

            // ──────────────────────────────────────────────
            // Generate all 41 frames of the algorithm
            // ──────────────────────────────────────────────
            function generateAllFrames() {
                const frames = [];
                let heap = [];
                let currentAnswer = null;

                function pushFrame(title, operation, description, phase, extra) {
                    frames.push({
                        step: frames.length,
                        title,
                        operation,
                        description,
                        phase,
                        nums: [...NUMS],
                        heap: [...heap],
                        k: K,
                        currentIndex: (extra && extra.currentIndex != null) ? extra.currentIndex : -1,
                        highlightedIndex: (extra && extra.highlightedIndex != null) ? extra.highlightedIndex :
                            -1,
                        answer: currentAnswer,
                        poppedValue: (extra && extra.poppedValue != null) ? extra.poppedValue : null,
                        action: (extra && extra.action) ? extra.action : '',
                        heapOperation: (extra && extra.heapOperation) ? extra.heapOperation : null,
                    });
                }

                // Frame 0: Initialize nums
                pushFrame('Initialize Array', 'create',
                    'Create the input array nums with ratings [' + NUMS.join(', ') + ']', 'Initialization', {
                        action: 'Set up the input data: ' + NUMS.length + ' ratings to process.',
                        currentIndex: -1,
                        highlightedIndex: -1
                    });

                // Frame 1: Initialize min-heap
                pushFrame('Initialize Min-Heap', 'create',
                    'Create an empty min-heap to track the largest ' + K + ' ratings', 'Initialization', {
                        action: 'The min-heap will store at most k=' + K +
                            ' elements. Its root is always the smallest in the heap, which equals the k-th highest rating seen so far.',
                        currentIndex: -1,
                        highlightedIndex: -1
                    });

                // Process each rating
                for (let i = 0; i < NUMS.length; i++) {
                    const val = NUMS[i];

                    // Mark current element
                    pushFrame('Process nums[' + i + ']', 'mark',
                        'Highlight current rating: nums[' + i + '] = ' + val, 'Processing', {
                            currentIndex: i,
                            highlightedIndex: i,
                            action: 'Reading rating ' + val + ' from the stream (element ' + (i + 1) +
                                ' of ' + NUMS.length + ').'
                        });

                    // Push to heap (raw, before heapify)
                    heap.push(val);
                    const heapAfterPush = [...heap];
                    pushFrame('Push ' + val + ' into Heap', 'push',
                        'Add ' + val + ' to the end of the min-heap', 'Processing', {
                            currentIndex: i,
                            highlightedIndex: i,
                            heapOperation: 'push',
                            action: 'Inserted ' + val + '. Heap before bubbling up: [' + heapAfterPush.join(
                                ', ') + '].'
                        });

                    // Heapify up
                    const heapBeforeUp = [...heap];
                    heapifyUp(heap, heap.length - 1);
                    const changedUp = (heapBeforeUp.join(',') !== heap.join(','));
                    if (changedUp) {
                        pushFrame('Heapify Up', 'heapify',
                            'Bubble up to restore min-heap property', 'Processing', {
                                currentIndex: i,
                                highlightedIndex: i,
                                heapOperation: 'heapify-up',
                                action: 'Swapped with parent until min-heap property holds. After bubbling: [' +
                                    heap.join(', ') + '].'
                            });
                    }

                    // Check size
                    if (heap.length > K) {
                        const poppedVal = heap[0];
                        pushFrame('Heap Size > k', 'check',
                            'Heap size (' + heap.length + ') exceeds k (' + K +
                            '), must remove the smallest element',
                            'Processing', {
                                currentIndex: i,
                                highlightedIndex: i,
                                poppedCandidate: poppedVal,
                                action: 'The heap has ' + heap.length + ' elements but k=' + K +
                                    '. The smallest element (' + poppedVal +
                                    ') must be removed to keep only the top ' + K + '.'
                            });

                        // Pop root and heapify down
                        const beforePop = [...heap];
                        heap[0] = heap[heap.length - 1];
                        heap.pop();
                        heapifyDown(heap, 0);
                        pushFrame('Pop ' + poppedVal + ' (Smallest)', 'pop',
                            'Remove root ' + poppedVal + ' and restore heap', 'Processing', {
                                currentIndex: i,
                                highlightedIndex: i,
                                poppedValue: poppedVal,
                                heapOperation: 'pop',
                                action: 'Removed ' + poppedVal +
                                    ' (the smallest). After heapify-down, heap is: [' + heap.join(
                                        ', ') + '].'
                            });
                    } else {
                        pushFrame('Heap Size OK', 'check',
                            'Heap size (' + heap.length + ') <= k (' + K + '), no removal needed',
                            'Processing', {
                                currentIndex: i,
                                highlightedIndex: i,
                                action: 'Heap has ' + heap.length + ' elements, which does not exceed k=' +
                                    K + '. No pop needed.'
                            });
                    }

                    // Current k-th highest
                    currentAnswer = heap[0];
                    pushFrame('Current ' + getOrdinal(K) + ' Highest: ' + currentAnswer, 'update',
                        'After processing ' + (i + 1) + ' rating(s), the ' + getOrdinal(K) +
                        ' highest is ' + currentAnswer,
                        'Processing', {
                            currentIndex: -1,
                            highlightedIndex: -1,
                            action: 'Heap contains the top ' + Math.min(i + 1, K) + ' rating(s): [' + heap.join(
                                ', ') + ']. Root ' + currentAnswer + ' is the ' + getOrdinal(K) +
                                ' highest so far.'
                        });
                }

                // Final answer
                currentAnswer = heap[0];
                pushFrame('Final Answer', 'mark',
                    'After processing all ' + NUMS.length + ' ratings, the ' + getOrdinal(K) +
                    ' highest rating is ' + currentAnswer,
                    'Result', {
                        currentIndex: -1,
                        highlightedIndex: -1,
                        answer: currentAnswer,
                        action: 'All ' + NUMS.length + ' ratings processed. The min-heap holds [' + heap.join(
                            ', ') + ']. Root ' + currentAnswer + ' is the verified ' + getOrdinal(K) +
                            ' highest overall.'
                    });

                return frames;
            }

            // ──────────────────────────────────────────────
            // Use artifact frames if available, else generated
            // ──────────────────────────────────────────────
            let FRAMES;
            if (artifact && Array.isArray(artifact.frames) && artifact.frames.length > 0) {
                FRAMES = artifact.frames;
            } else {
                FRAMES = generateAllFrames();
            }
            const TOTAL_FRAMES = FRAMES.length;

            // ──────────────────────────────────────────────
            // DOM references
            // ──────────────────────────────────────────────
            const appEl = document.getElementById('app');
            const stageEl = document.getElementById('stage');
            const arrayContainer = document.getElementById('array-container');
            const heapSvg = document.getElementById('heap-svg');
            const heapArrayText = document.getElementById('heap-array-text');
            const rootLabel = document.getElementById('root-label');
            const prevBtn = document.getElementById('prev');
            const nextBtn = document.getElementById('next');
            const rangeInput = document.getElementById('range');
            const counterSpan = document.getElementById('counter');
            const explanationEl = document.getElementById('explanation');
            const verifiedAnswerEl = document.getElementById('verified-answer');

            // Set verified answer display
            if (verifiedAnswerEl) {
                verifiedAnswerEl.textContent = VERIFIED_RESULT;
            }

            // Set range max
            rangeInput.max = TOTAL_FRAMES - 1;
            rangeInput.value = 0;

            let currentFrameIndex = 0;

            // ──────────────────────────────────────────────
            // SVG Tree Drawing
            // ──────────────────────────────────────────────
            function drawHeapTree(heap, highlightedIndex, poppedValue, heapOperation) {
                const svg = heapSvg;
                svg.innerHTML = '';

                const w = 360;
                const h = 220;
                const cx = w / 2;
                const rootY = 45;
                const level1Y = 130;
                const level2Y = 200;
                const radius = 22;

                // Define positions for heap indices
                function getPos(idx) {
                    if (idx === 0) return { x: cx, y: rootY };
                    if (idx === 1) return { x: cx - 80, y: level1Y };
                    if (idx === 2) return { x: cx + 80, y: level1Y };
                    if (idx === 3) return { x: cx - 140, y: level2Y };
                    if (idx === 4) return { x: cx - 40, y: level2Y };
                    if (idx === 5) return { x: cx + 40, y: level2Y };
                    if (idx === 6) return { x: cx + 140, y: level2Y };
                    return { x: cx, y: h / 2 };
                }

                // Draw edges first (behind nodes)
                for (let i = 1; i < heap.length; i++) {
                    const parentIdx = Math.floor((i - 1) / 2);
                    const pPos = getPos(parentIdx);
                    const cPos = getPos(i);
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', pPos.x);
                    line.setAttribute('y1', pPos.y);
                    line.setAttribute('x2', cPos.x);
                    line.setAttribute('y2', cPos.y);
                    line.setAttribute('stroke', '#ccc');
                    line.setAttribute('stroke-width', '2');
                    line.setAttribute('stroke-linecap', 'round');
                    svg.appendChild(line);
                }

                // Draw nodes
                for (let i = 0; i < heap.length; i++) {
                    const pos = getPos(i);
                    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');

                    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    circle.setAttribute('cx', pos.x);
                    circle.setAttribute('cy', pos.y);
                    circle.setAttribute('r', radius);
                    circle.setAttribute('fill', '#fefefe');
                    circle.setAttribute('stroke', '#bbb');
                    circle.setAttribute('stroke-width', '2.5');

                    // Color the root green (it's the k-th highest)
                    if (i === 0 && heap.length > 0) {
                        circle.setAttribute('fill', '#eafaf1');
                        circle.setAttribute('stroke', '#27ae60');
                        circle.setAttribute('stroke-width', '3');
                    }
                    // Highlight if this node is being processed
                    if (heapOperation === 'push' && i === heap.length - 1) {
                        circle.setAttribute('fill', '#fff8e7');
                        circle.setAttribute('stroke', '#f39c12');
                        circle.setAttribute('stroke-width', '3');
                    }
                    if (heapOperation === 'pop' && i === 0 && poppedValue != null) {
                        circle.setAttribute('fill', '#fdedec');
                        circle.setAttribute('stroke', '#e74c3c');
                        circle.setAttribute('stroke-width', '3');
                    }

                    g.appendChild(circle);

                    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    text.setAttribute('x', pos.x);
                    text.setAttribute('y', pos.y + 5);
                    text.setAttribute('text-anchor', 'middle');
                    text.setAttribute('font-size', '15');
                    text.setAttribute('font-weight', '700');
                    text.setAttribute('fill', '#2d3436');
                    text.setAttribute('font-family',
                        "'Segoe UI', system-ui, -apple-system, sans-serif");
                    text.textContent = heap[i];
                    g.appendChild(text);

                    svg.appendChild(g);
                }

                // If heap is empty, show placeholder
                if (heap.length === 0) {
                    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    circle.setAttribute('cx', cx);
                    circle.setAttribute('cy', rootY + 30);
                    circle.setAttribute('r', 28);
                    circle.setAttribute('fill', '#fafafa');
                    circle.setAttribute('stroke', '#ddd');
                    circle.setAttribute('stroke-width', '2');
                    circle.setAttribute('stroke-dasharray', '6,3');
                    g.appendChild(circle);
                    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    text.setAttribute('x', cx);
                    text.setAttribute('y', rootY + 36);
                    text.setAttribute('text-anchor', 'middle');
                    text.setAttribute('font-size', '13');
                    text.setAttribute('fill', '#bbb');
                    text.setAttribute('font-family',
                        "'Segoe UI', system-ui, -apple-system, sans-serif");
                    text.textContent = 'Empty';
                    g.appendChild(text);
                    svg.appendChild(g);
                }
            }

            // ──────────────────────────────────────────────
            // Render a specific frame by index
            // ──────────────────────────────────────────────
            function renderFrame(index) {
                if (index < 0) index = 0;
                if (index >= TOTAL_FRAMES) index = TOTAL_FRAMES - 1;
                currentFrameIndex = index;

                const frame = FRAMES[index];
                if (!frame) return;

                const state = frame.state || frame;
                const numsArr = state.nums || NUMS;
                const heapArr = state.heap || [];
                const kVal = state.k || K;
                const curIdx = state.currentIndex != null ? state.currentIndex : (frame.currentIndex != null ? frame
                    .currentIndex : -1);
                const hlIdx = state.highlightedIndex != null ? state.highlightedIndex : (frame.highlightedIndex != null ?
                    frame.highlightedIndex : -1);
                const poppedVal = state.poppedValue != null ? state.poppedValue : (frame.poppedValue != null ? frame
                    .poppedValue : null);
                const heapOp = state.heapOperation || (frame.heapOperation || null);
                const answerVal = state.answer != null ? state.answer : (frame.answer != null ? frame.answer : null);
                const phase = frame.phase || 'Processing';
                const actionText = frame.action || frame.description || '';
                const titleText = frame.title || '';

                // Update array display
                arrayContainer.innerHTML = '';
                for (let i = 0; i < numsArr.length; i++) {
                    const cell = document.createElement('div');
                    cell.className = 'array-cell';
                    if (i === hlIdx && curIdx === i) {
                        cell.classList.add('highlight');
                    } else if (curIdx >= 0 && i < curIdx) {
                        cell.classList.add('processed');
                    } else if (curIdx >= 0 && i === curIdx && hlIdx < 0) {
                        // already processed
                        cell.classList.add('processed');
                    }
                    cell.textContent = numsArr[i];
                    const idxLabel = document.createElement('span');
                    idxLabel.className = 'array-index';
                    idxLabel.textContent = '[' + i + ']';
                    cell.appendChild(idxLabel);
                    arrayContainer.appendChild(cell);
                }

                // Update heap tree SVG
                drawHeapTree(heapArr, hlIdx, poppedVal, heapOp);

                // Update heap array text
                if (heapArr.length === 0) {
                    heapArrayText.textContent = 'Empty';
                    heapArrayText.classList.add('empty');
                } else {
                    heapArrayText.textContent = 'Heap: [' + heapArr.join(', ') + ']';
                    heapArrayText.classList.remove('empty');
                }

                // Update root label
                if (heapArr.length > 0) {
                    rootLabel.textContent = 'Root = ' + heapArr[0] + '  (current ' + getOrdinal(kVal) +
                        ' highest)';
                    rootLabel.style.color = 'var(--success)';
                } else {
                    rootLabel.textContent = 'Heap is empty — no ratings processed yet';
                    rootLabel.style.color = 'var(--muted)';
                }

                // Update explanation
                const phaseBadgeClass = phase === 'Initialization' ? 'phase-badge' : (phase === 'Result' ?
                    'phase-badge' : 'phase-badge');
                let phaseColor = 'var(--primary)';
                if (phase === 'Result') phaseColor = 'var(--success)';
                if (phase === 'Initialization') phaseColor = '#636e72';

                explanationEl.innerHTML =
                    '<span class="phase-badge" style="background:' + phaseColor +
                    '20;color:' + phaseColor + ';">' + phase + '</span> ' +
                    '<strong>' + titleText + '</strong><br>' +
                    '<span class="action-text">' + actionText + '</span>';

                // Show invariant for processing/result phases
                if (heapArr.length > 0 && (phase === 'Processing' || phase === 'Result')) {
                    explanationEl.innerHTML +=
                        '<span class="invariant">🔍 <strong>Invariant:</strong> The min-heap always contains exactly the <strong>largest ' +
                        kVal + ' ratings</strong> seen so far. Its root (smallest in heap) = the <strong>' +
                        getOrdinal(kVal) + ' highest</strong> rating.</span>';
                }
                if (phase === 'Result' && answerVal != null) {
                    explanationEl.innerHTML +=
                        '<span class="invariant" style="border-left-color:#e74c3c;background:#fff5f5;color:#a93226;">✅ <strong>Verified Result:</strong> ' +
                        answerVal + ' &mdash; The heap [' + heapArr.join(', ') + '] holds the top ' + kVal +
                        ' ratings. The smallest among them is the ' + getOrdinal(kVal) + ' highest.</span>';
                }

                // Update controls
                rangeInput.value = index;
                counterSpan.textContent = 'Step ' + index + ' / ' + (TOTAL_FRAMES - 1);
                prevBtn.disabled = (index <= 0);
                nextBtn.disabled = (index >= TOTAL_FRAMES - 1);

                // Update verified answer display
                if (answerVal != null && phase === 'Result') {
                    if (verifiedAnswerEl) verifiedAnswerEl.textContent = answerVal;
                }
            }

            // ──────────────────────────────────────────────
            // Event listeners
            // ──────────────────────────────────────────────
            prevBtn.addEventListener('click', function() {
                if (currentFrameIndex > 0) {
                    renderFrame(currentFrameIndex - 1);
                }
            });

            nextBtn.addEventListener('click', function() {
                if (currentFrameIndex < TOTAL_FRAMES - 1) {
                    renderFrame(currentFrameIndex + 1);
                }
            });

            rangeInput.addEventListener('input', function() {
                renderFrame(parseInt(rangeInput.value, 10));
            });

            // Keyboard navigation
            document.addEventListener('keydown', function(e) {
                if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    if (currentFrameIndex > 0) renderFrame(currentFrameIndex - 1);
                } else if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    if (currentFrameIndex < TOTAL_FRAMES - 1) renderFrame(currentFrameIndex + 1);
                }
            });

            // ──────────────────────────────────────────────
            // Initialize
            // ──────────────────────────────────────────────
            renderFrame(0);

            // Log info for debugging (English only)
            console.log('AlgoLab Visualization Ready | Frames: ' + TOTAL_FRAMES + ' | Verified Result: ' +
                VERIFIED_RESULT + ' | Input: nums=' + JSON.stringify(NUMS) + ', k=' + K);
        })();
    </script>
</body>
</html>
