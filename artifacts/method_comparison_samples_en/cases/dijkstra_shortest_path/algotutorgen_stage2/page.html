<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dijkstra's Algorithm — Emergency Dispatch Center</title>
    <style>
        :root {
            --bg: #0b1121;
            --surface: #141e33;
            --surface2: #1a2744;
            --text: #e2e8f0;
            --text2: #94a3b8;
            --text3: #64748b;
            --accent: #38bdf8;
            --accent2: #0ea5e9;
            --settled: #10b981;
            --current: #f59e0b;
            --current-glow: #fbbf24;
            --frontier: #6366f1;
            --unvisited: #475569;
            --edge: #334155;
            --edge-hi: #f59e0b;
            --danger: #ef4444;
            --radius: 32px;
            --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', 'Monaco', monospace;
            --font-sans: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            background-image:
                radial-gradient(ellipse at 50% 0%, rgba(56, 189, 248, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 80%, rgba(99, 102, 241, 0.04) 0%, transparent 50%);
        }

        #app {
            width: 100%;
            max-width: 960px;
            background: var(--surface);
            border-radius: 20px;
            border: 1px solid #1e293b;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.03) inset;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 18px 24px;
            border-bottom: 1px solid #1e293b;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            background: var(--surface2);
        }
        .header h1 {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header h1 .icon {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: linear-gradient(135deg, #f59e0b, #ef4444);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }
        .result-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #0f1f1a;
            border: 1px solid #10b98144;
            border-radius: 24px;
            padding: 7px 16px;
            font-size: 0.85rem;
            color: #10b981;
            font-weight: 600;
            letter-spacing: 0.02em;
        }
        .result-badge .check {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #10b98122;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
        }
        .result-badge span {
            color: #a7f3d0;
            font-weight: 400;
        }

        .main-layout {
            display: flex;
            flex: 1;
            min-height: 420px;
        }
        @media (max-width: 700px) {
            .main-layout {
                flex-direction: column;
            }
        }

        #stage {
            flex: 1 1 55%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            min-height: 380px;
            background: radial-gradient(circle at 50% 50%, #1a274422 0%, transparent 70%);
        }
        #stage svg {
            width: 100%;
            height: 100%;
            max-width: 520px;
            max-height: 400px;
        }

        .side-panel {
            flex: 0 0 320px;
            border-left: 1px solid #1e293b;
            padding: 16px 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow-y: auto;
            background: #0f172a55;
        }
        @media (max-width: 700px) {
            .side-panel {
                flex: 0 0 auto;
                border-left: none;
                border-top: 1px solid #1e293b;
                max-height: 300px;
            }
        }

        .panel-card {
            background: var(--surface2);
            border-radius: 12px;
            padding: 12px 14px;
            border: 1px solid #1e293b;
        }
        .panel-card h3 {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text3);
            margin-bottom: 8px;
            font-weight: 600;
        }
        .dist-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            font-family: var(--font-mono);
        }
        .dist-table th {
            text-align: left;
            color: var(--text3);
            font-weight: 500;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 4px 6px;
            border-bottom: 1px solid #1e293b;
        }
        .dist-table td {
            padding: 6px 6px;
            border-bottom: 1px solid #1e293b22;
            vertical-align: middle;
        }
        .dist-table .node-cell {
            font-weight: 700;
            color: #f1f5f9;
        }
        .dist-table .dist-cell {
            font-weight: 600;
            font-size: 0.9rem;
        }
        .status-dot {
            display: inline-block;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            margin-right: 5px;
            vertical-align: middle;
        }
        .status-dot.settled {
            background: var(--settled);
            box-shadow: 0 0 6px var(--settled);
        }
        .status-dot.frontier {
            background: var(--frontier);
            box-shadow: 0 0 6px var(--frontier);
        }
        .status-dot.unvisited {
            background: var(--unvisited);
        }
        .status-dot.current {
            background: var(--current);
            box-shadow: 0 0 10px var(--current-glow);
            animation: pulse-dot 0.8s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                box-shadow: 0 0 6px var(--current-glow);
            }
            50% {
                box-shadow: 0 0 16px var(--current-glow), 0 0 24px #f59e0b44;
            }
        }

        .heap-display {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            min-height: 28px;
            align-items: center;
        }
        .heap-entry {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 4px 10px;
            color: #cbd5e1;
            font-weight: 500;
            white-space: nowrap;
        }
        .heap-empty {
            color: var(--text3);
            font-style: italic;
            font-size: 0.8rem;
        }

        #explanation {
            padding: 12px 18px;
            border-top: 1px solid #1e293b;
            background: #0f172a66;
            font-size: 0.85rem;
            line-height: 1.5;
            color: #cbd5e1;
            min-height: 50px;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }
        #explanation .exp-icon {
            flex-shrink: 0;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #38bdf822;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
        }
        #explanation .exp-text {
            flex: 1;
        }
        #explanation .exp-what {
            font-weight: 600;
            color: #f1f5f9;
            margin-bottom: 2px;
        }
        #explanation .exp-why {
            color: #94a3b8;
            font-size: 0.8rem;
        }

        .nav-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 18px;
            border-top: 1px solid #1e293b;
            background: var(--surface2);
            flex-wrap: wrap;
        }
        .nav-btn {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid #334155;
            background: #1e293b;
            color: #e2e8f0;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.82rem;
            transition: var(--transition);
            white-space: nowrap;
            font-family: var(--font-sans);
            letter-spacing: 0.02em;
        }
        .nav-btn:hover {
            background: #273549;
            border-color: #475569;
        }
        .nav-btn:active {
            background: #334155;
            transform: scale(0.97);
        }
        .nav-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            pointer-events: none;
        }
        #counter {
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: 0.9rem;
            color: #f1f5f9;
            min-width: 90px;
            text-align: center;
            letter-spacing: 0.03em;
        }
        #range {
            flex: 1;
            min-width: 100px;
            max-width: 280px;
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            border-radius: 3px;
            background: #334155;
            outline: none;
            cursor: pointer;
        }
        #range::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #38bdf8;
            border: 2px solid #0b1121;
            cursor: pointer;
            box-shadow: 0 0 10px #38bdf866;
            transition: var(--transition);
        }
        #range::-webkit-slider-thumb:hover {
            background: #7dd3fc;
            box-shadow: 0 0 18px #38bdf8aa;
        }

        /* SVG styles */
        .grid-line {
            stroke: #1e293b;
            stroke-width: 0.5;
            stroke-dasharray: 4 6;
            opacity: 0.5;
        }
        .edge-line {
            stroke: var(--edge);
            stroke-width: 2.5;
            fill: none;
            transition: stroke var(--transition), stroke-width var(--transition);
            marker-end: url(#arrowhead);
        }
        .edge-line.highlighted {
            stroke: var(--edge-hi);
            stroke-width: 3.5;
            filter: drop-shadow(0 0 4px #f59e0b88);
        }
        .edge-weight {
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 700;
            fill: #94a3b8;
            text-anchor: middle;
            dominant-baseline: central;
            pointer-events: none;
            transition: fill var(--transition);
        }
        .edge-weight.highlighted {
            fill: #fbbf24;
        }
        .node-group {
            cursor: default;
            transition: transform var(--transition);
        }
        .node-circle {
            stroke-width: 3;
            transition: fill var(--transition), stroke var(--transition), stroke-width var(--transition),
                filter var(--transition);
        }
        .node-circle.unvisited {
            fill: #1a2744;
            stroke: #475569;
        }
        .node-circle.frontier {
            fill: #1e2748;
            stroke: #6366f1;
            stroke-width: 3;
            filter: drop-shadow(0 0 6px #6366f166);
        }
        .node-circle.settled {
            fill: #15261f;
            stroke: #10b981;
            stroke-width: 3;
            filter: drop-shadow(0 0 6px #10b98144);
        }
        .node-circle.current-node {
            fill: #2a2010;
            stroke: #f59e0b;
            stroke-width: 4;
            filter: drop-shadow(0 0 14px #f59e0b88);
            animation: pulse-stroke 0.9s ease-in-out infinite;
        }
        .node-circle.source-node {
            fill: #1a2a1f;
            stroke: #22c55e;
            stroke-width: 3.5;
            filter: drop-shadow(0 0 8px #22c55e55);
        }
        @keyframes pulse-stroke {
            0%,
            100% {
                filter: drop-shadow(0 0 10px #f59e0b66);
            }
            50% {
                filter: drop-shadow(0 0 22px #fbbf24aa);
            }
        }
        .node-label {
            font-family: var(--font-sans);
            font-weight: 800;
            font-size: 16px;
            text-anchor: middle;
            dominant-baseline: central;
            fill: #f1f5f9;
            pointer-events: none;
            transition: fill var(--transition);
        }
        .node-dist-label {
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 600;
            text-anchor: middle;
            fill: #94a3b8;
            pointer-events: none;
            transition: fill var(--transition);
        }
        .node-dist-label.finite {
            fill: #cbd5e1;
        }
        .node-dist-label.infinity {
            fill: #64748b;
        }
        .node-dist-label.current-dist {
            fill: #fbbf24;
            font-weight: 700;
        }
        .source-marker {
            fill: #22c55e;
            font-size: 10px;
            text-anchor: middle;
            pointer-events: none;
        }

        /* Marker for arrowheads */
        #arrowhead polygon {
            fill: #475569;
            transition: fill var(--transition);
        }
        .edge-line.highlighted+#arrowhead polygon,
        .edge-line.highlighted marker polygon {
            fill: #f59e0b;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="header">
            <h1>
                <span class="icon">🚑</span>
                Emergency Dispatch &mdash; Dijkstra's Algorithm
            </h1>
            <div class="result-badge" id="result-badge" data-derived-visual-only="true">

        <div class="main-layout">

                            <polygon points="0 0, 10 3.5, 0 7" fill="#475569" />
                        </marker>
                        <marker id="arrowhead-hi" markerWidth="10" markerHeight="7" refX="8.5" refY="3.5" orient="auto">
                            <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b" />

                        <filter id="glow-settled" x="-50%" y="-50%" width="200%" height="200%">

                        </filter>
                    </defs>
                    <!-- Grid lines -->
                    <line class="grid-line" x1="0" y1="95" x2="560" y2="95" />
                    <line class="grid-line" x1="0" y1="190" x2="560" y2="190" />
                    <line class="grid-line" x1="0" y1="285" x2="560" y2="285" />
                    <line class="grid-line" x1="140" y1="0" x2="140" y2="380" />
                    <line class="grid-line" x1="280" y1="0" x2="280" y2="380" />
                    <line class="grid-line" x1="420" y1="0" x2="420" y2="380" />
                    <!-- Edges rendered by JS -->
                    <g id="edges-group"></g>
                    <!-- Nodes rendered by JS -->
                    <g id="nodes-group"></g>

                    <g id="weights-group"></g>
                </svg>
            </div>
            <div class="side-panel">
                <div class="panel-card">
                    <h3>📊 Distance Table</h3>
                    <table class="dist-table" id="dist-table">
                        <thead><tr><th>Node</th><th>Distance</th><th>Status</th></tr></thead>
                        <tbody id="dist-tbody"></tbody>
                    </table>
                </div>
                <div class="panel-card">
                    <h3>📦 Min-Heap</h3>
                    <div class="heap-display" id="heap-display"></div>
                </div>
            </div>
        </div>
        <div id="explanation">
            <span class="exp-icon">💡</span>
            <div class="exp-text">
                <div class="exp-what" id="exp-what">—</div>
                <div class="exp-why" id="exp-why"></div>
            </div>
        </div>
        <div class="nav-bar">
            <button class="nav-btn" id="prev" aria-label="Previous step">◀ Prev</button>
            <span id="counter">Step 0 / 0</span>
            <button class="nav-btn" id="next" aria-label="Next step">Next ▶</button>
            <input type="range" id="range" aria-label="Step slider" min="0" max="0" value="0" step="1" />
            <button class="nav-btn" id="btn-auto" aria-label="Auto-play">▶ Play</button>
        </div>
    </div>

ode":"def solve(input_data):\n    weighted_graph = input_data[\"weighted_graph\"]\n    start = input_data[\"start\"]\n    nodes = list(weighted_graph.keys())\n    edges = [(u, v, w) for u in nodes for v, w in weighted_graph[u]]\n    dist = {node: float('inf') for node in nodes}\n    dist[start] = 0\n    for _ in range(len(nodes) - 1):\n        updated = False\n        for u, v, w in edges:\n            if dist[u] + w < dist[v]:\n                dist[v] = dist[u] + w\n                updated = True\n        if not updated:\n            break\n    answer = {}\n    for node in nodes:\n        val = dist[node]\n        answer[node] = val if val != float('inf') else None\n    return answer","tracker_code":"def trace(input_data):\n    sess = TraceSession(\n        algorithm=\"Bellman-Ford Algorithm\",\n        input_data=input_data,\n        pseudocode=[\n            \"Initialize distances: source 0, others infinity\",\n            \"Build list of all edges (u, v, w)\",\n            \"Repeat |V|-1 times: relax every edge\",\n            \"If no distance is updated in a pass, stop early\",\n            \"Return distances\"\n        ]\n    )\n    weighted_graph = input_data[\"weighted_graph\"]\n    start = input_data[\"start\"]\n    nodes = list(weighted_graph.keys())\n    edges = [(u, v, w) for u in nodes for v, w in weighted_graph[u]]\n    g = sess.graph(\"graph\", nodes, edges, directed=True)\n    \n    dist_map = sess.map(\"dist\", {node: float('inf') for node in nodes})\n    dist_map[start] = 0\n    \n    dist = {node: float('inf') for node in nodes}\n    dist[start] = 0\n    \n    for i in range(len(nodes) - 1):\n        with sess.step(f\"Pass {i+1}\"):\n            updated = False\n            for u, v, w in edges:\n                g.highlight_edge(u, v)\n                if dist[u] + w < dist[v]:\n                    sess.note(f\"Relax edge ({u},{v}): {dist[u]}+{w} < {dist[v]}\")\n                    dist[v] = dist[u] + w\n                    dist_map[v] = dist[v]\n                    updated = True\n                    g.highlight_node(v)\n            if not updated:\n                sess.note(\"No improvement, early termination\")\n                break\n    \n    answer = {node: (val if val != float('inf') else None) for node, val in dist.items()}\n    sess.result(answer)\n    \n    trace = sess.to_trace()\n    for event in trace[\"events\"]:\n        op = event.get(\"op\")\n        targets = [t.get(\"id\", \"\") for t in event.get(\"targets\", [])]\n        reason = event.get(\"reason\", \"\")\n        if op == \"create\":\n            if \"graph\" in targets:\n                event[\"code_line\"] = 3\n            elif \"dist\" in targets:\n                event[\"code_line\"] = 7\n        elif op == \"set\" and \"dist\" in targets:\n            if \"source\" in reason:\n                event[\"code_line\"] = 8\n            else:\n                event[\"code_line\"] = 13\n        elif op == \"highlight\" and \"edge\" in reason:\n            event[\"code_line\"] = 12\n        elif op == \"note\":\n            if \"Relax\" in reason:\n                event[\"code_line\"] = 13\n            elif \"No improvement\" in reason:\n                event[\"code_line\"] = 16\n        elif op in (\"enter\", \"exit\"):\n            event[\"code_line\"] = 10\n        elif event.get(\"role\") == \"answer\" or \"answer\" in targets:\n            event[\"code_line\"] = 19\n    return trace","result":{"A":0,"B":2,"C":3},"trace":{"schema_version":"semantic-trace-v1","algorithm":"Bellman-Ford Algorithm","input_data":{"weighted_graph":{"A":[["B",2],["C",5]],"B":[["C",1]],"C":[]},"start":"A"},"result":{"A":0,"B":2,"C":3},"pseudocode":["Initialize distances: source 0, others infinity","Build list of all edges (u, v, w)","Repeat |V|-1 times: relax every edge","If no distance is updated in a pass, stop early","Return distances"],"events":[{"step":0,"op":"create","targets":[{"id":"graph"}],"value":null,"before":null,"after":null,"deps":[],"role":"", ource":"","target":"","role":"","meta":{}},{"id":"callout:37","type":"callout","value":"Internal non-English diagnostic omitted.","label":"Internal non-English diagnostic omitted.","parent":"","row":null,"col":null,"index":null,"source":"","target":"","role":"reason","meta":{}}],"marks":[{"target":"answer","role":"answer","label":""}],"state":{"graph":{"nodes":["A","B","C"],"edges":[{"u":"A","v":"B","weight":2},{"u":"A","v":"C","weight":5},{"u":"B","v":"C","weight":1}],"directed":true},"dist":{"A":0,"B":2,"C":3},"min-heap":[],"answer":{"A":0,"B":2,"C":3}},"interaction":{"type":"judge","prompt":"Is the final shortest distance for C equal to 3?","options":[],"answer":true,"explanation":"Yes, the optimal path A→B→C costs 3, and Dijkstra correctly found it.","wrong_explanation":"If you said false, you may have kept the older value 5 from the direct edge, forgetting the improvement found at B.","option_explanations":{}},"teaching":{"what":"Return the final answer with shortest distances to all reachable nodes.","why":"The heap is now empty; all nodes with finite distances have been settled. Unreachable nodes would retain Infinity.","formula":"","invariant":"","common_mistake":"Assuming the answer contains only nodes explicitly processed; unreachable nodes should remain Infinity (or None) and not be omitted.","hint":"Internal non-English diagnostic omitted."},"evidence":{"operation":"mark","targets":["answer"],"deps":[],"role":"answer","value":{"A":0,"B":2,"C":3},"before":null,"after":null,"changes":[{"target":"answer","operation":"mark","source":"event","before":null,"after":null,"value":{"A":0,"B":2,"C":3}}],"reason":"Internal non-English diagnostic omitted.","code_line":1,"timeline":{"phase":"Internal non-English diagnostic omitted.","operation":"mark","keyframe":true,"keyframe_label":"Internal non-English diagnostic omitted.","targets":["answer"],"role":"answer"},"process":{"status":"Internal non-English diagnostic omitted.","kind":"Internal non-English diagnostic omitted.","summary":"Internal non-English diagnostic omitted.","checks":[{"label":"Internal non-English diagnostic omitted.","text":"answer"},{"label":"Internal non-English diagnostic omitted.","text":"answer: None -> None"}]},"visual_family":"graph","visual_family_pattern":"graph_frontier","visual_patterns":[{"pattern":"answer_projection","objects":["node:A","node:B","node:C"],"roles":["answer"]},{"pattern":"graph_edge_label","objects":["edge:A->B","edge:A->C","edge:B->C"],"roles":["edge_label"]},{"pattern":"graph_frontier","objects":["dist","graph"],"roles":["family_hint"]}]}}],"result":{"A":0,"B":2,"C":3}}</script>
<script>
        (function() {
            // ──────────────────────────────────────
            // Read injected artifact
            // ──────────────────────────────────────
            const artifactScript = document.getElementById('algolab-artifact');
            let artifact;
            try {
                artifact = JSON.parse(artifactScript.textContent || '{}');
            } catch (e) {
                artifact = {};
            }

            // Validate artifact structure
            const frames = Array.isArray(artifact.frames) ? artifact.frames : [];
            const verifiedResult = artifact.result || null;
            const inputData = artifact.input_data || artifact.input || null;
            const totalFrames = frames.length;

            if (totalFrames === 0) {
                document.getElementById('stage').innerHTML =
                    '<p style="color:#ef4444;text-align:center;padding:40px;">No algorithm frames available. The artifact may be empty or malformed.</p>';
                return;
            }

            // ──────────────────────────────────────
            // DOM references
            // ──────────────────────────────────────
            const stage = document.getElementById('stage');
            const edgesGroup = document.getElementById('edges-group');
            const nodesGroup = document.getElementById('nodes-group');
            const weightsGroup = document.getElementById('weights-group');
            const distTbody = document.getElementById('dist-tbody');
            const heapDisplay = document.getElementById('heap-display');
            const expWhat = document.getElementById('exp-what');
            const expWhy = document.getElementById('exp-why');
            const counterEl = document.getElementById('counter');
            const prevBtn = document.getElementById('prev');
            const nextBtn = document.getElementById('next');
            const rangeEl = document.getElementById('range');
            const resultText = document.getElementById('result-text');
            const btnAuto = document.getElementById('btn-auto');

            let currentIndex = 0;
            let autoPlayInterval = null;

            // ──────────────────────────────────────
            // Extract base graph structure from frames
            // ──────────────────────────────────────
            let baseGraph = null;
            for (const frame of frames) {
                if (frame.state && frame.state.graph && frame.state.graph.nodes && frame.state.graph.nodes
                    .length > 0) {
                    baseGraph = frame.state.graph;
                    break;
                }
            }
            if (!baseGraph && inputData && inputData.weighted_graph) {
                // Build graph from input
                const adj = inputData.weighted_graph;
                const nodes = Object.keys(adj);
                const edges = [];
                for (const u of nodes) {
                    for (const [v, w] of (adj[u] || [])) {
                        edges.push({ u, v, weight: w });
                    }
                }
                baseGraph = { nodes, edges, directed: true };
            }
            if (!baseGraph) {
                baseGraph = { nodes: ['A', 'B', 'C'], edges: [{ u: 'A', v: 'B', weight: 2 }, { u: 'A', v: 'C',
                        weight: 5 }, { u: 'B', v: 'C', weight: 1 }
                ], directed: true };
            }

            const graphNodes = baseGraph.nodes || [];
            const graphEdges = baseGraph.edges || [];

            // ──────────────────────────────────────
            // Fixed node positions (SVG viewBox: 560 x 380)
            // ──────────────────────────────────────
            const nodePositions = {};
            const nodeRadius = 30;
            // Position nodes evenly
            if (graphNodes.length === 3 && graphNodes.includes('A') && graphNodes.includes('B') && graphNodes
                .includes('C')) {
                nodePositions['A'] = { x: 150, y: 120 };
                nodePositions['B'] = { x: 410, y: 120 };
                nodePositions['C'] = { x: 280, y: 300 };
            } else {
                // Generic layout: spread nodes in a circle
                const cx = 280,
                    cy = 190,
                    r = 150;
                graphNodes.forEach((n, i) => {
                    const angle = (2 * Math.PI * i) / graphNodes.length - Math.PI / 2;
                    nodePositions[n] = { x: cx + r * Math.cos(angle), y: cy + r * Math.sin(angle) };
                });
            }

            // ──────────────────────────────────────
            // Compute edge geometry
            // ──────────────────────────────────────
            function computeEdgeEndpoints(u, v) {
                const pu = nodePositions[u];
                const pv = nodePositions[v];
                if (!pu || !pv) return null;
                const dx = pv.x - pu.x;
                const dy = pv.y - pu.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 0.001) return null;
                const ux = dx / dist;
                const uy = dy / dist;
                const x1 = pu.x + ux * nodeRadius;
                const y1 = pu.y + uy * nodeRadius;
                const x2 = pv.x - ux * nodeRadius;
                const y2 = pv.y - uy * nodeRadius;
                const mx = (x1 + x2) / 2;
                const my = (y1 + y2) / 2;
                // Offset for label perpendicular
                const perpX = -uy;
                const perpY = ux;
                const labelOffset = 18;
                const lx = mx + perpX * labelOffset;
                const ly = my + perpY * labelOffset;
                return { x1, y1, x2, y2, mx, my, lx, ly, dist };
            }

            // Build edge data
            const edgeDataList = [];
            for (const edge of graphEdges) {
                const geom = computeEdgeEndpoints(edge.u, edge.v);
                if (geom) {
                    edgeDataList.push({
                        u: edge.u,
                        v: edge.v,
                        weight: edge.weight,
                        geom: geom,
                        id: `edge-${edge.u}-${edge.v}`,
                    });
                }
            }

            // ──────────────────────────────────────
            // Build static SVG elements (edges, nodes, weights)
            // ──────────────────────────────────────
            function buildStaticSVG() {
                // Edges
                edgesGroup.innerHTML = '';
                for (const ed of edgeDataList) {
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', ed.geom.x1);
                    line.setAttribute('y1', ed.geom.y1);
                    line.setAttribute('x2', ed.geom.x2);
                    line.setAttribute('y2', ed.geom.y2);
                    line.setAttribute('class', 'edge-line');
                    line.setAttribute('id', ed.id);
                    line.setAttribute('data-derived-visual-only', 'true');
                    line.setAttribute('data-u', ed.u);
                    line.setAttribute('data-v', ed.v);
                    line.setAttribute('marker-end', 'url(#arrowhead)');
                    edgesGroup.appendChild(line);
                }

                // Weight labels
                weightsGroup.innerHTML = '';
                for (const ed of edgeDataList) {
                    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    text.setAttribute('x', ed.geom.lx);
                    text.setAttribute('y', ed.geom.ly);
                    text.setAttribute('class', 'edge-weight');
                    text.setAttribute('data-derived-visual-only', 'true');
                    text.setAttribute('data-edge-id', ed.id);
                    text.textContent = ed.weight;
                    weightsGroup.appendChild(text);
                }

                // Nodes
                nodesGroup.innerHTML = '';
                for (const nodeName of graphNodes) {
                    const pos = nodePositions[nodeName];
                    if (!pos) continue;
                    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                    g.setAttribute('class', 'node-group');
                    g.setAttribute('data-node', nodeName);
                    g.setAttribute('data-derived-visual-only', 'true');
                    g.setAttribute('transform', `translate(${pos.x},${pos.y})`);

                    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    circle.setAttribute('r', nodeRadius);
                    circle.setAttribute('class', 'node-circle unvisited');
                    circle.setAttribute('data-node', nodeName);
                    circle.setAttribute('data-derived-visual-only', 'true');
                    g.appendChild(circle);

                    const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    label.setAttribute('class', 'node-label');
                    label.setAttribute('data-derived-visual-only', 'true');
                    label.textContent = nodeName;
                    g.appendChild(label);

                    // Distance label below node
                    const distLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    distLabel.setAttribute('y', nodeRadius + 18);
                    distLabel.setAttribute('class', 'node-dist-label infinity');
                    distLabel.setAttribute('data-derived-visual-only', 'true');
                    distLabel.setAttribute('data-node-dist', nodeName);
                    distLabel.textContent = '∞';
                    g.appendChild(distLabel);

                    nodesGroup.appendChild(g);
                }
            }
            buildStaticSVG();

            // ──────────────────────────────────────
            // Display verified result
            // ──────────────────────────────────────
            if (verifiedResult) {
                const parts = Object.entries(verifiedResult).map(([k, v]) => `${k}: ${v}`);
                resultText.textContent = '{ ' + parts.join(', ') + ' }';
            } else {
                resultText.textContent = '—';
            }

            // ──────────────────────────────────────
            // Determine node statuses from frame state
            // ──────────────────────────────────────
            function getNodeStatuses(frameState) {
                const dist = frameState.dist || {};
                const heap = frameState['min-heap'] || [];
                const heapNodes = new Set(heap.map(e => e[1]));
                const statuses = {};
                for (const nodeName of graphNodes) {
                    const d = dist[nodeName];
                    if (d === null || d === undefined) {
                        statuses[nodeName] = 'unvisited';
                    } else if (heapNodes.has(nodeName)) {
                        statuses[nodeName] = 'frontier';
                    } else {
                        statuses[nodeName] = 'settled';
                    }
                }
                return statuses;
            }

            // ──────────────────────────────────────
            // Detect current node from frame evidence
            // ──────────────────────────────────────
            function detectCurrentNode(frame) {
                if (!frame.evidence) return null;
                const targets = frame.evidence.targets || [];
                const role = frame.evidence.role || '';
                for (const t of targets) {
                    if (t.startsWith('node:') && role === 'current') {
                        return t.slice(5);
                    }
                }
                // Also check if any target is a plain node name when operation is 'mark'
                if (frame.operation === 'mark' && targets.length === 1 && targets[0].startsWith('node:')) {
                    return targets[0].slice(5);
                }
                return null;
            }

            // ──────────────────────────────────────
            // Detect highlighted edges from frame
            // ──────────────────────────────────────
            function detectHighlightedEdges(frame) {
                const hl = new Set();
                if (!frame.evidence) return hl;
                const targets = frame.evidence.targets || [];
                for (const t of targets) {
                    if (t.startsWith('edge:')) {
                        hl.add(t.slice(5));
                    }
                }
                // Check visual_patterns for relaxation
                const patterns = frame.evidence.visual_patterns || [];
                for (const p of patterns) {
                    if (p.pattern === 'graph_relax_target' && p.objects) {
                        // p.objects might contain node references; the edge being relaxed
                        // is typically the one from the previously settled node to this target
                    }
                }
                return hl;
            }

            // ──────────────────────────────────────
            // Main render function
            // ──────────────────────────────────────
            function renderFrame(index) {
                if (index < 0) index = 0;
                if (index >= totalFrames) index = totalFrames - 1;
                currentIndex = index;

                const frame = frames[index];
                const frameState = frame.state || {};
                const dist = frameState.dist || {};
                const heap = frameState['min-heap'] || [];
                const statuses = getNodeStatuses(frameState);
                const currentNode = detectCurrentNode(frame);
                const highlightedEdges = detectHighlightedEdges(frame);
                const isSource = (frameState.dist && frameState.dist['A'] === 0) ? 'A' : (inputData && inputData
                    .start) || 'A';

                // Update node circles
                for (const nodeName of graphNodes) {
                    const circle = document.querySelector(`.node-circle[data-node="${nodeName}"]`);
                    const distLabel = document.querySelector(`[data-node-dist="${nodeName}"]`);
                    if (!circle) continue;

                    // Remove all state classes
                    circle.classList.remove('unvisited', 'frontier', 'settled', 'current-node', 'source-node');
                    const status = statuses[nodeName] || 'unvisited';
                    circle.classList.add(status);

                    // Check if this is the current processing node
                    if (currentNode === nodeName) {
                        circle.classList.add('current-node');
                    }
                    // Check if source
                    if (nodeName === isSource && dist[nodeName] === 0) {
                        circle.classList.add('source-node');
                    }

                    // Update distance label
                    if (distLabel) {
                        const d = dist[nodeName];
                        distLabel.classList.remove('finite', 'infinity', 'current-dist');
                        if (d === null || d === undefined) {
                            distLabel.textContent = '∞';
                            distLabel.classList.add('infinity');
                        } else {
                            distLabel.textContent = d;
                            distLabel.classList.add('finite');
                            if (currentNode === nodeName) {
                                distLabel.classList.add('current-dist');
                            }
                        }
                    }
                }

                // Update edges
                for (const ed of edgeDataList) {
                    const line = document.getElementById(ed.id);
                    if (!line) continue;
                    const edgeKey = `${ed.u}->${ed.v}`;
                    line.classList.remove('highlighted');
                    if (highlightedEdges.has(edgeKey)) {
                        line.classList.add('highlighted');
                        line.setAttribute('marker-end', 'url(#arrowhead-hi)');
                    } else {
                        line.setAttribute('marker-end', 'url(#arrowhead)');
                    }
                    // Also update weight label highlight
                    const wtLabel = document.querySelector(`[data-edge-id="${ed.id}"]`);
                    if (wtLabel) {
                        wtLabel.classList.remove('highlighted');
                        if (highlightedEdges.has(edgeKey)) {
                            wtLabel.classList.add('highlighted');
                        }
                    }
                }

                // Update distance table
                distTbody.innerHTML = '';
                for (const nodeName of graphNodes) {
                    const d = dist[nodeName];
                    const status = statuses[nodeName];
                    const isCurr = currentNode === nodeName;
                    const tr = document.createElement('tr');
                    tr.setAttribute('data-derived-visual-only', 'true');
                    let statusLabel, statusClass;
                    if (isCurr) {
                        statusLabel = 'Current';
                        statusClass = 'current';
                    } else if (status === 'settled') {
                        statusLabel = 'Settled';
                        statusClass = 'settled';
                    } else if (status === 'frontier') {
                        statusLabel = 'Frontier';
                        statusClass = 'frontier';
                    } else {
                        statusLabel = 'Unvisited';
                        statusClass = 'unvisited';
                    }
                    tr.innerHTML = `
                        <td class="node-cell">${nodeName}</td>
                        <td class="dist-cell" style="color:${d === null || d === undefined ? '#64748b' : '#e2e8f0'}">${d === null || d === undefined ? '∞' : d}</td>
                        <td><span class="status-dot ${statusClass}"></span>${statusLabel}</td>
                    `;
                    distTbody.appendChild(tr);
                }

                // Update heap display
                heapDisplay.innerHTML = '';
                if (heap.length === 0) {
                    heapDisplay.innerHTML = '<span class="heap-empty">Empty</span>';
                } else {
                    for (const entry of heap) {
                        const span = document.createElement('span');
                        span.className = 'heap-entry';
                        span.setAttribute('data-derived-visual-only', 'true');
                        span.textContent = `[${entry[0]}, "${entry[1]}"]`;
                        heapDisplay.appendChild(span);
                    }
                }

                // Update explanation
                const teaching = frame.teaching || {};
                expWhat.textContent = teaching.what || frame.description || `Step ${frame.step}`;
                expWhy.textContent = teaching.why || '';

                // Update counter
                counterEl.textContent = `Step ${frame.step || index} / ${totalFrames - 1}`;

                // Update range slider
                rangeEl.value = index;

                // Update button states
                prevBtn.disabled = index <= 0;
                nextBtn.disabled = index >= totalFrames - 1;
            }

            // ──────────────────────────────────────
            // Navigation handlers
            // ──────────────────────────────────────
            function goToStep(index) {
                if (index < 0) index = 0;
                if (index >= totalFrames) index = totalFrames - 1;
                currentIndex = index;
                renderFrame(currentIndex);
                rangeEl.value = currentIndex;
            }

            prevBtn.addEventListener('click', () => goToStep(currentIndex - 1));
            nextBtn.addEventListener('click', () => goToStep(currentIndex + 1));
            rangeEl.addEventListener('input', () => {
                const val = parseInt(rangeEl.value, 10);
                if (!isNaN(val)) goToStep(val);
            });
            rangeEl.addEventListener('change', () => {
                const val = parseInt(rangeEl.value, 10);
                if (!isNaN(val)) goToStep(val);
            });

            // Auto-play
            btnAuto.addEventListener('click', () => {
                if (autoPlayInterval) {
                    clearInterval(autoPlayInterval);
                    autoPlayInterval = null;
                    btnAuto.textContent = '▶ Play';
                    return;
                }
                btnAuto.textContent = '⏸ Pause';
                autoPlayInterval = setInterval(() => {
                    if (currentIndex >= totalFrames - 1) {
                        clearInterval(autoPlayInterval);
                        autoPlayInterval = null;
                        btnAuto.textContent = '▶ Play';
                        return;
                    }
                    goToStep(currentIndex + 1);
                }, 600);
            });

            // Keyboard navigation
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    goToStep(currentIndex - 1);
                } else if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    goToStep(currentIndex + 1);
                } else if (e.key === 'Home') {
                    e.preventDefault();
                    goToStep(0);
                } else if (e.key === 'End') {
                    e.preventDefault();
                    goToStep(totalFrames - 1);
                }
            });

            // ──────────────────────────────────────
            // Initialize
            // ──────────────────────────────────────
            rangeEl.max = totalFrames - 1;
            rangeEl.value = 0;
            goToStep(0);

            console.log(
                `[AlgoLab Visual Renderer] Initialized with ${totalFrames} frames. Verified result: ${JSON.stringify(verifiedResult)}`
            );
        })();
    </script>
