<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trie Prefix Count — Visualizer</title>
    <style>
        :root {
            --bg: #f7f8fa;
            --card: #ffffff;
            --text: #2c3e50;
            --text-secondary: #5a6c7d;
            --accent: #4a90d9;
            --accent-light: #e8f2fb;
            --terminal: #27ae60;
            --terminal-light: #eafaf1;
            --highlight-new: #f39c12;
            --highlight-new-light: #fef9f0;
            --highlight-prefix: #8e44ad;
            --highlight-prefix-light: #f5eff8;
            --highlight-result: #e74c3c;
            --highlight-result-light: #fdedec;
            --border: #e0e4e8;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            --radius: 10px;
            --transition: 0.25s ease;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
        }
        #app {
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        /* Header */
        .header {
            background: var(--card);
            border-radius: var(--radius);
            padding: 18px 22px;
            box-shadow: var(--shadow);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            border: 1px solid var(--border);
        }
        .header .title-section h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text);
            margin: 0 0 4px;
        }
        .header .title-section .subtitle {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .result-badge {
            background: #eafaf1;
            border: 2px solid var(--terminal);
            border-radius: 20px;
            padding: 8px 18px;
            font-weight: 700;
            font-size: 1.05rem;
            color: #1e7e34;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .result-badge .icon {
            font-size: 1.2rem;
        }
        .result-badge .verified-label {
            font-size: 0.7rem;
            font-weight: 500;
            color: #5a8a6a;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        /* Input summary */
        .input-summary {
            background: var(--card);
            border-radius: var(--radius);
            padding: 14px 22px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
            font-size: 0.9rem;
        }
        .input-summary .words-display {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }
        .input-summary .word-tag {
            background: #eef3f9;
            border-radius: 14px;
            padding: 4px 12px;
            font-family: 'SF Mono', 'Consolas', 'Monaco', monospace;
            font-size: 0.85rem;
            color: #3a5a8c;
            border: 1px solid #d4dde8;
            transition: var(--transition);
        }
        .input-summary .word-tag.inserted {
            background: #eafaf1;
            border-color: #b7dfc4;
            color: #1e7e34;
        }
        .input-summary .prefix-highlight {
            background: #f5eff8;
            border-radius: 14px;
            padding: 4px 14px;
            font-family: 'SF Mono', 'Consolas', 'Monaco', monospace;
            font-weight: 700;
            color: var(--highlight-prefix);
            border: 2px solid var(--highlight-prefix);
            font-size: 0.9rem;
        }
        /* Main content */
        .main-content {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }
        .viz-panel {
            flex: 1 1 620px;
            min-width: 420px;
            background: var(--card);
            border-radius: var(--radius);
            padding: 10px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .viz-panel #stage {
            width: 100%;
            overflow: hidden;
            position: relative;
        }
        .viz-panel #stage svg {
            width: 100%;
            height: auto;
            display: block;
        }
        .info-panel {
            flex: 0 0 320px;
            min-width: 280px;
            background: var(--card);
            border-radius: var(--radius);
            padding: 18px 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .info-panel h2 {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text);
            margin: 0;
        }
        #explanation {
            font-size: 0.88rem;
            color: var(--text-secondary);
            line-height: 1.6;
            background: #f9fafb;
            border-radius: 8px;
            padding: 14px 16px;
            border-left: 4px solid var(--accent);
            min-height: 80px;
            transition: var(--transition);
        }
        #explanation .what {
            font-weight: 600;
            color: var(--text);
            margin-bottom: 4px;
        }
        #explanation .why {
            color: var(--text-secondary);
            font-style: italic;
            margin-bottom: 6px;
        }
        #explanation .hint {
            font-size: 0.8rem;
            color: #888;
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px dashed #ddd;
        }
        .step-indicator {
            font-size: 0.82rem;
            color: var(--text-secondary);
            background: #f0f3f6;
            border-radius: 6px;
            padding: 8px 12px;
            text-align: center;
        }
        .step-indicator strong {
            color: var(--text);
        }
        /* Navigation */
        .nav-bar {
            background: var(--card);
            border-radius: var(--radius);
            padding: 14px 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            justify-content: center;
        }
        .nav-bar button {
            padding: 9px 20px;
            border-radius: 20px;
            border: 2px solid var(--accent);
            background: #fff;
            color: var(--accent);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
        }
        .nav-bar button:hover {
            background: var(--accent-light);
        }
        .nav-bar button:active {
            background: var(--accent);
            color: #fff;
        }
        .nav-bar button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }
        #counter {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text);
            min-width: 100px;
            text-align: center;
        }
        #range {
            flex: 1 1 180px;
            min-width: 120px;
            accent-color: var(--accent);
            cursor: pointer;
        }
        /* SVG styles */
        .node-circle {
            transition: fill var(--transition), stroke var(--transition), stroke-width var(--transition), opacity var(--transition);
            cursor: default;
        }
        .node-circle.default {
            fill: #eaf2fb;
            stroke: #b0c8e3;
            stroke-width: 2;
        }
        .node-circle.terminal-ring {
            stroke-width: 3;
            stroke-dasharray: none;
        }
        .node-circle.highlight-new {
            fill: #fef6e8;
            stroke: var(--highlight-new);
            stroke-width: 3;
            animation: pulse-new 0.6s ease-out 2;
        }
        .node-circle.highlight-prefix {
            fill: #f3eafa;
            stroke: var(--highlight-prefix);
            stroke-width: 3;
        }
        .node-circle.highlight-result {
            fill: #fde8e8;
            stroke: var(--highlight-result);
            stroke-width: 3.5;
        }
        @keyframes pulse-new {
            0%,
            100% {
                r: 22;
            }
            50% {
                r: 27;
            }
        }
        .node-text {
            font-family: 'SF Mono', 'Consolas', 'Monaco', monospace;
            font-weight: 700;
            font-size: 15px;
            fill: #2c3e50;
            text-anchor: middle;
            dominant-baseline: central;
            pointer-events: none;
        }
        .node-count {
            font-size: 11px;
            fill: #5a6c7d;
            text-anchor: middle;
            font-weight: 500;
            pointer-events: none;
        }
        .node-root-label {
            font-size: 9px;
            fill: #8899aa;
            text-anchor: middle;
            font-weight: 400;
            pointer-events: none;
        }
        .edge-line {
            stroke: #c5cdd5;
            stroke-width: 2;
            transition: stroke var(--transition), stroke-width var(--transition), opacity var(--transition);
        }
        .edge-line.prefix-edge {
            stroke: var(--highlight-prefix);
            stroke-width: 3;
        }
        .edge-line.result-edge {
            stroke: var(--highlight-result);
            stroke-width: 3;
        }
        /* Legend */
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            padding: 4px 0;
        }
        .legend span {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .legend .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            border: 2px solid;
        }
        .legend .dot.prefix-dot {
            background: #f3eafa;
            border-color: var(--highlight-prefix);
        }
        .legend .dot.new-dot {
            background: #fef6e8;
            border-color: var(--highlight-new);
        }
        .legend .dot.result-dot {
            background: #fde8e8;
            border-color: var(--highlight-result);
        }
        .legend .dot.terminal-dot {
            background: #eafaf1;
            border-color: var(--terminal);
        }
</style>
</head>
<body>
    <div id="app">
        <!-- Header with verified result -->
        <header class="header">
            <div class="title-section">
                <h1>Trie Prefix Count</h1>
                <p class="subtitle">Count how many search words start with a given prefix</p>
            </div>
            <div class="result-badge">
                <span class="icon">✓</span>
                <span>Result: <strong id="result-display">—</strong></span>
                <span class="verified-label">Verified</span>
            </div>
        </header>

        <!-- Input summary -->
        <div class="input-summary" id="input-summary">
            <span style="font-weight:600;color:var(--text);">Words:</span>
            <span class="words-display" id="words-display"></span>
            <span style="font-weight:600;color:var(--text);margin-left:8px;">Prefix:</span>
            <span class="prefix-highlight" id="prefix-display"></span>
        </div>

        <!-- Main visualization and info -->
        <div class="main-content">
            <div class="viz-panel" data-derived-visual-only="true">
                <div id="stage">
                    <svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" id="trie-svg">
                        <g id="edges-group"></g>
                        <g id="nodes-group"></g>
                    </svg>
                </div>
                <div class="legend">
                    <span><span class="dot prefix-dot"></span> Prefix path</span>
                    <span><span class="dot new-dot"></span> Newly created</span>
                    <span><span class="dot result-dot"></span> Result node</span>
                    <span><span class="dot terminal-dot"></span> Terminal (word end)</span>
                </div>
            </div>
            <aside class="info-panel">
                <h2>Current Step</h2>
                <div class="step-indicator" id="step-indicator">—</div>
                <div id="explanation">
                    <div class="what">Loading…</div>
                </div>
            </aside>
        </div>

        <!-- Navigation controls -->
        <nav class="nav-bar">
            <button id="prev" aria-label="Previous step">◀ Previous</button>
            <span id="counter">Frame 0 / 0</span>
            <input type="range" id="range" min="0" max="0" value="0" step="1" aria-label="Frame slider">
            <button id="next" aria-label="Next step">Next ▶</button>
        </nav>
    </div>

<script>
        (function() {
            // ─────────────────────────────────────
            // Read the injected artifact
            // ─────────────────────────────────────
            const artifactEl = document.getElementById('algolab-artifact');
            if (!artifactEl || !artifactEl.textContent.trim()) {
                document.getElementById('explanation').innerHTML =
                    '<div class="what">Artifact not found.</div><p>Please ensure the page is served with valid runtime data.</p>';
                return;
            }
            let artifact;
            try {
                artifact = JSON.parse(artifactEl.textContent);
            } catch (e) {
                document.getElementById('explanation').innerHTML =
                    '<div class="what">Invalid artifact JSON.</div><p>Could not parse the runtime data.</p>';
                return;
            }

            // ─────────────────────────────────────
            // Extract core data
            // ─────────────────────────────────────
            const frames = artifact.frames || [];
            const verifiedResult = artifact.result;
            const inputData = artifact.input_data || artifact.input || {};
            const words = inputData.words || [];
            const prefix = inputData.prefix || '';

            // Display verified result
            document.getElementById('result-display').textContent = verifiedResult !== undefined ? verifiedResult :
                '—';

            // Display input words and prefix
            const wordsDisplay = document.getElementById('words-display');
            wordsDisplay.innerHTML = words.map(w =>
                `<span class="word-tag" data-word="${w}">${w}</span>`
            ).join('');
            document.getElementById('prefix-display').textContent = prefix;

            // ─────────────────────────────────────
            // Build complete trie structure from the most complete frame
            // ─────────────────────────────────────
            function findMostCompleteFrame() {
                let bestFrame = null;
                let maxNodes = 0;
                for (const f of frames) {
                    const nodes = f.state?.trie?.nodes;
                    if (nodes && nodes.length > maxNodes) {
                        maxNodes = nodes.length;
                        bestFrame = f;
                    }
                }
                return bestFrame;
            }

            const completeFrame = findMostCompleteFrame();
            const completeNodes = completeFrame ? (completeFrame.state?.trie?.nodes || []) : [];

            // Build a map of all possible node IDs and their data from the complete trie
            const allNodeData = new Map();
            for (const n of completeNodes) {
                allNodeData.set(n.id, {
                    id: n.id,
                    char: n.char,
                    children: n.children || {},
                    terminal: n.terminal || false,
                    count: n.count || 0
                });
            }

            // ─────────────────────────────────────
            // Compute tree layout positions
            // ─────────────────────────────────────
            const nodePositions = new Map(); // id -> {x, y, depth}
            const LEVEL_HEIGHT = 80;
            const TOP_Y = 50;
            const RADIUS = 22;

            // Build adjacency from allNodeData
            function getChildren(nodeId) {
                const data = allNodeData.get(nodeId);
                if (!data || !data.children) return [];
                const result = [];
                for (const [ch, childId] of Object.entries(data.children)) {
                    result.push({ char: ch, id: childId });
                }
                // Sort for consistent left-to-right ordering
                result.sort((a, b) => a.char.localeCompare(b.char));
                return result;
            }

            // Count leaves in subtree for width allocation
            function countLeaves(nodeId, visited = new Set()) {
                if (visited.has(nodeId)) return 0;
                visited.add(nodeId);
                const children = getChildren(nodeId);
                if (children.length === 0) return 1;
                let total = 0;
                for (const child of children) {
                    total += countLeaves(child.id, visited);
                }
                return total;
            }

            // Assign X positions using a simple proportional layout
            function assignPositions(nodeId, depth, xStart, xEnd, visited) {
                if (visited.has(nodeId)) return;
                visited.add(nodeId);
                const x = (xStart + xEnd) / 2;
                const y = TOP_Y + depth * LEVEL_HEIGHT;
                nodePositions.set(nodeId, { x, y, depth });

                const children = getChildren(nodeId);
                if (children.length === 0) return;
                const totalLeaves = children.reduce((sum, c) => sum + countLeaves(c.id, new Set()), 0);
                if (totalLeaves === 0) return;
                let cursor = xStart;
                const span = xEnd - xStart;
                for (const child of children) {
                    const childLeaves = countLeaves(child.id, new Set());
                    const childWidth = (childLeaves / totalLeaves) * span;
                    assignPositions(child.id, depth + 1, cursor, cursor + childWidth, visited);
                    cursor += childWidth;
                }
            }

            if (allNodeData.has(0)) {
                assignPositions(0, 0, 40, 760, new Set());
            }

            // ─────────────────────────────────────
            // Pre-build SVG elements for all possible nodes and edges
            // ─────────────────────────────────────
            const edgesGroup = document.getElementById('edges-group');
            const nodesGroup = document.getElementById('nodes-group');

            // Collect all edges (parent -> child) from the complete trie
            const allEdges = [];
            for (const [nodeId, data] of allNodeData) {
                for (const [ch, childId] of Object.entries(data.children)) {
                    allEdges.push({ parentId: nodeId, childId, char: ch });
                }
            }

            // Create edge SVG elements
            const edgeElements = new Map(); // key: "parentId-childId"
            for (const edge of allEdges) {
                const key = `${edge.parentId}-${edge.childId}`;
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('data-edge', key);
                line.setAttribute('data-derived-visual-only', 'true');
                line.classList.add('edge-line');
                line.style.visibility = 'hidden';
                edgesGroup.appendChild(line);
                edgeElements.set(key, line);
            }

            // Create node SVG groups
            const nodeGroups = new Map(); // id -> {group, circle, charText, countText, rootLabel}
            for (const [nodeId, data] of allNodeData) {
                const pos = nodePositions.get(nodeId) || { x: 400, y: 300, depth: 0 };
                const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                g.setAttribute('data-node-id', nodeId);
                g.setAttribute('data-derived-visual-only', 'true');
                g.style.visibility = 'hidden';

                // Circle
                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', pos.x);
                circle.setAttribute('cy', pos.y);
                circle.setAttribute('r', RADIUS);
                circle.classList.add('node-circle', 'default');
                g.appendChild(circle);

                // Character text
                const charText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                charText.setAttribute('x', pos.x);
                charText.setAttribute('y', pos.y);
                charText.classList.add('node-text');
                charText.textContent = data.char || '·';
                g.appendChild(charText);

                // Count badge
                const countText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                countText.setAttribute('x', pos.x);
                countText.setAttribute('y', pos.y + RADIUS + 15);
                countText.classList.add('node-count');
                countText.textContent = '0';
                g.appendChild(countText);

                // Root label
                const rootLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                rootLabel.setAttribute('x', pos.x);
                rootLabel.setAttribute('y', pos.y - RADIUS - 12);
                rootLabel.classList.add('node-root-label');
                rootLabel.textContent = nodeId === 0 ? 'root' : '';
                g.appendChild(rootLabel);

                nodesGroup.appendChild(g);
                nodeGroups.set(nodeId, { g, circle, charText, countText, rootLabel, pos });
            }

            // ─────────────────────────────────────
            // Determine which words are fully inserted in a given trie state
            // ─────────────────────────────────────
            function getInsertedWords(nodesById) {
                const inserted = new Set();
                for (const word of words) {
                    let currentId = 0;
                    let allExist = true;
                    for (const ch of word) {
                        const node = nodesById.get(currentId);
                        if (!node || !node.children || node.children[ch] === undefined) {
                            allExist = false;
                            break;
                        }
                        currentId = node.children[ch];
                    }
                    if (allExist) {
                        const finalNode = nodesById.get(currentId);
                        if (finalNode && finalNode.terminal) {
                            inserted.add(word);
                        }
                    }
                }
                return inserted;
            }

            // ─────────────────────────────────────
            // Compute prefix path node IDs from a trie state
            // ─────────────────────────────────────
            function getPrefixPathIds(nodesById, prefixStr) {
                const pathIds = [0];
                let currentId = 0;
                for (const ch of prefixStr) {
                    const node = nodesById.get(currentId);
                    if (!node || !node.children || node.children[ch] === undefined) {
                        return pathIds; // Partial path
                    }
                    currentId = node.children[ch];
                    pathIds.push(currentId);
                }
                return pathIds;
            }

            // ─────────────────────────────────────
            // Main render function
            // ─────────────────────────────────────
            function renderFrame(index) {
                if (index < 0 || index >= frames.length) return;
                const frame = frames[index];
                const state = frame.state || {};
                const trieState = state.trie || {};
                const nodesArray = trieState.nodes || [];
                const answerVal = state.answer;

                // Build lookup for current frame's nodes
                const currentNodesById = new Map();
                for (const n of nodesArray) {
                    currentNodesById.set(n.id, {
                        id: n.id,
                        char: n.char,
                        children: n.children || {},
                        terminal: n.terminal || false,
                        count: n.count || 0
                    });
                }

                // Determine inserted words
                const insertedWords = getInsertedWords(currentNodesById);

                // Determine prefix path
                const prefixPathIds = getPrefixPathIds(currentNodesById, prefix);
                const prefixPathSet = new Set(prefixPathIds);
                const lastPrefixNodeId = prefixPathIds[prefixPathIds.length - 1];
                const isPrefixComplete = prefixPathIds.length === prefix.length + 1;

                // Determine newly created node from evidence
                let newlyCreatedNodeId = null;
                if (frame.evidence && frame.evidence.targets) {
                    for (const target of frame.evidence.targets) {
                        const match = target.match(/^node:(\d+)$/);
                        if (match) {
                            newlyCreatedNodeId = parseInt(match[1], 10);
                            break;
                        }
                    }
                }
                // Also check changes for node creation
                if (!newlyCreatedNodeId && frame.evidence && frame.evidence.changes) {
                    for (const change of frame.evidence.changes) {
                        const tgt = change.target || '';
                        const match = tgt.match(/^node:(\d+)$/);
                        if (match && change.operation === 'create') {
                            newlyCreatedNodeId = parseInt(match[1], 10);
                            break;
                        }
                    }
                }

                // Determine if this is the result frame
                const isResultFrame = (frame.operation === 'mark' && frame.evidence?.targets?.includes('answer')) ||
                    (answerVal !== undefined && answerVal !== null);

                // Result node ID (the node whose count is the answer)
                const resultNodeId = isPrefixComplete ? lastPrefixNodeId : null;

                // ────────────────────
                // Update node visuals
                // ────────────────────
                for (const [nodeId, nodeGroup] of nodeGroups) {
                    const currentNode = currentNodesById.get(nodeId);
                    const pos = nodeGroup.pos;

                    if (!currentNode) {
                        // Node doesn't exist in this frame
                        nodeGroup.g.style.visibility = 'hidden';
                        continue;
                    }

                    nodeGroup.g.style.visibility = 'visible';
                    // Update position (in case layout differs, though we use fixed positions)
                    nodeGroup.circle.setAttribute('cx', pos.x);
                    nodeGroup.circle.setAttribute('cy', pos.y);
                    nodeGroup.charText.setAttribute('x', pos.x);
                    nodeGroup.charText.setAttribute('y', pos.y);
                    nodeGroup.charText.textContent = currentNode.char || (nodeId === 0 ? '·' : '');
                    nodeGroup.countText.setAttribute('x', pos.x);
                    nodeGroup.countText.setAttribute('y', pos.y + RADIUS + 15);
                    nodeGroup.countText.textContent = currentNode.count;
                    nodeGroup.rootLabel.setAttribute('x', pos.x);
                    nodeGroup.rootLabel.setAttribute('y', pos.y - RADIUS - 12);
                    nodeGroup.rootLabel.textContent = nodeId === 0 ? 'root' : '';

                    // Reset classes
                    nodeGroup.circle.classList.remove('highlight-new', 'highlight-prefix', 'highlight-result',
                        'terminal-ring');
                    nodeGroup.circle.classList.add('default');

                    // Apply highlights
                    if (nodeId === newlyCreatedNodeId) {
                        nodeGroup.circle.classList.add('highlight-new');
                        nodeGroup.circle.classList.remove('default');
                    }
                    if (isPrefixComplete && prefixPathSet.has(nodeId)) {
                        nodeGroup.circle.classList.add('highlight-prefix');
                        nodeGroup.circle.classList.remove('default');
                    }
                    if (isResultFrame && nodeId === resultNodeId) {
                        nodeGroup.circle.classList.add('highlight-result');
                        nodeGroup.circle.classList.remove('default');
                    }
                    if (currentNode.terminal) {
                        nodeGroup.circle.classList.add('terminal-ring');
                    }
                }

                // ────────────────────
                // Update edge visuals
                // ────────────────────
                for (const [key, line] of edgeElements) {
                    const [pIdStr, cIdStr] = key.split('-');
                    const parentId = parseInt(pIdStr, 10);
                    const childId = parseInt(cIdStr, 10);
                    const parentNode = currentNodesById.get(parentId);
                    const childNode = currentNodesById.get(childId);
                    const parentPos = nodePositions.get(parentId);
                    const childPos = nodePositions.get(childId);

                    // Edge exists if both nodes exist AND child is in parent's children
                    const childExists = parentNode && parentNode.children &&
                        Object.values(parentNode.children).includes(childId) &&
                        childNode !== undefined;

                    if (!childExists || !parentPos || !childPos) {
                        line.style.visibility = 'hidden';
                        continue;
                    }

                    line.style.visibility = 'visible';
                    line.setAttribute('x1', parentPos.x);
                    line.setAttribute('y1', parentPos.y + RADIUS);
                    line.setAttribute('x2', childPos.x);
                    line.setAttribute('y2', childPos.y - RADIUS);
                    line.classList.remove('prefix-edge', 'result-edge');

                    // Highlight prefix path edges
                    if (isPrefixComplete && prefixPathSet.has(parentId) && prefixPathSet.has(childId)) {
                        line.classList.add('prefix-edge');
                    }
                    // Highlight result edge
                    if (isResultFrame && prefixPathSet.has(parentId) && childId === resultNodeId) {
                        line.classList.add('result-edge');
                    }
                }

                // ────────────────────
                // Update word tags
                // ────────────────────
                const wordTags = document.querySelectorAll('.word-tag');
                wordTags.forEach(tag => {
                    const word = tag.getAttribute('data-word');
                    if (insertedWords.has(word)) {
                        tag.classList.add('inserted');
                    } else {
                        tag.classList.remove('inserted');
                    }
                });

                // ────────────────────
                // Update explanation
                // ────────────────────
                const explanationEl = document.getElementById('explanation');
                const teaching = frame.teaching || {};
                const what = teaching.what || frame.description || '';
                const why = teaching.why || '';
                const hint = teaching.hint || '';
                const commonMistake = teaching.common_mistake || '';

                let explHTML = '';
                if (what) explHTML += '<div class="what">' + escapeHTML(what) + '</div>';
                if (why) explHTML += '<div class="why">' + escapeHTML(why) + '</div>';
                if (commonMistake) explHTML +=
                    '<div style="margin-top:6px;font-size:0.8rem;color:#c0392b;">⚠ ' + escapeHTML(commonMistake) +
                    '</div>';
                if (hint) explHTML += '<div class="hint">' + escapeHTML(hint) + '</div>';
                if (!explHTML) explHTML = '<div class="what">' + escapeHTML(frame.description || 'Processing…') +
                    '</div>';

                explanationEl.innerHTML = explHTML;

                // ────────────────────
                // Update step indicator
                // ────────────────────
                const stepInd = document.getElementById('step-indicator');
                stepInd.innerHTML = '<strong>Step ' + (frame.step !== undefined ? frame.step : index) + '</strong>: ' +
                    escapeHTML(frame.title || frame.operation || '') +
                    (frame.code_line ? ' <span style="color:#888;">(line ' + frame.code_line + ')</span>' : '');

                // ────────────────────
                // Update navigation state
                // ────────────────────
                document.getElementById('counter').textContent =
                    'Frame ' + index + ' / ' + (frames.length - 1);
                document.getElementById('range').value = index;
                document.getElementById('prev').disabled = (index <= 0);
                document.getElementById('next').disabled = (index >= frames.length - 1);

                // Store current index
                document.getElementById('range').setAttribute('data-current', index);
            }

            function escapeHTML(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            // ─────────────────────────────────────
            // Set up navigation
            // ─────────────────────────────────────
            const rangeEl = document.getElementById('range');
            rangeEl.max = Math.max(0, frames.length - 1);
            rangeEl.value = 0;

            let currentIndex = 0;

            function goToFrame(index) {
                index = Math.max(0, Math.min(frames.length - 1, index));
                if (index === currentIndex && document.getElementById('range').getAttribute('data-current') == index)
                    return;
                currentIndex = index;
                renderFrame(currentIndex);
            }

            document.getElementById('prev').addEventListener('click', () => {
                if (currentIndex > 0) goToFrame(currentIndex - 1);
            });
            document.getElementById('next').addEventListener('click', () => {
                if (currentIndex < frames.length - 1) goToFrame(currentIndex + 1);
            });
            rangeEl.addEventListener('input', () => {
                goToFrame(parseInt(rangeEl.value, 10));
            });

            // Keyboard navigation
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    if (currentIndex > 0) goToFrame(currentIndex - 1);
                } else if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    if (currentIndex < frames.length - 1) goToFrame(currentIndex + 1);
                }
            });

            // ─────────────────────────────────────
            // Initial render
            // ─────────────────────────────────────
            if (frames.length > 0) {
                goToFrame(0);
            } else {
                document.getElementById('explanation').innerHTML =
                    '<div class="what">No frames available.</div><p>The artifact contains no animation frames. Please check the runtime data.</p>';
                document.getElementById('counter').textContent = 'No frames';
                document.getElementById('prev').disabled = true;
                document.getElementById('next').disabled = true;
                rangeEl.disabled = true;
            }

            // Log that visualization is ready
            console.log('Trie Prefix Count Visualizer initialized. Frames:', frames.length,
                'Verified result:', verifiedResult);
        })();
    </script>
</body>
</html>
